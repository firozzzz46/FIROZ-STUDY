<html lang="en">
<head>

<title>Part 5 - Noun | Infinity MCQ</title>

<style>
/* =========================================================
   PART 5 - NOUN
   INFINITY MCQ PRACTICE SYSTEM
   Single File HTML + CSS + JavaScript
========================================================= */

@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600;700;800&display=swap');

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

:root {
    --soft-bg: #f8fafc;
    --card-bg: rgba(255,255,255,0.72);
    --border: rgba(255,255,255,0.85);
    --text: #172033;
    --muted: #64748b;
    --primary: #4f46e5;
    --primary-dark: #3730a3;
    --green: #15803d;
    --green-bg: rgba(220,252,231,0.85);
    --red: #dc2626;
    --red-bg: rgba(254,226,226,0.85);
    --shadow: 0 20px 60px rgba(30,41,59,0.10);
}

body {
    min-height: 100vh;
    color: var(--text);

    background:
        radial-gradient(circle at 10% 10%, rgba(99,102,241,0.08), transparent 30%),
        radial-gradient(circle at 90% 20%, rgba(14,165,233,0.08), transparent 30%),
        radial-gradient(circle at 50% 100%, rgba(168,85,247,0.06), transparent 35%),
        linear-gradient(135deg, #ffffff 0%, #f8fafc 50%, #f1f5f9 100%);

    font-family: "Times New Roman", "Noto Sans Bengali", serif;
    padding: 25px 15px;
}

/* Main Container */

.app {
    width: min(100%, 1050px);
    margin: auto;
}

/* Header */

.header {
    text-align: center;
    margin-bottom: 22px;
    animation: headerIn 1s cubic-bezier(.16,1,.3,1);
}

.header h1 {
    font-size: clamp(28px, 5vw, 44px);
    font-weight: 800;
    letter-spacing: .5px;
}

.header h1 span {
    color: var(--primary);
}

.header p {
    margin-top: 8px;
    font-family: "Noto Sans Bengali", "Kalpurush", sans-serif;
    font-size: 18px;
    color: var(--muted);
}

/* Glass Card */

.glass-card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    border-radius: 28px;
    box-shadow: var(--shadow);
}

/* Top Information */

.top-bar {
    padding: 18px 22px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 15px;
    margin-bottom: 18px;
}

.part-label {
    font-size: 21px;
    font-weight: 700;
}

.part-label span {
    color: var(--primary);
}

.stats {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    justify-content: flex-end;
}

.stat {
    padding: 9px 14px;
    border-radius: 14px;
    background: rgba(255,255,255,.8);
    border: 1px solid rgba(226,232,240,.9);
    font-size: 17px;
    font-weight: 700;
}

/* Progress */

.progress-wrapper {
    margin-bottom: 18px;
}

.progress-info {
    display: flex;
    justify-content: space-between;
    margin-bottom: 8px;
    font-size: 17px;
    font-weight: 700;
}

.progress-track {
    height: 9px;
    background: rgba(203,213,225,.55);
    border-radius: 50px;
    overflow: hidden;
}

.progress-bar {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #4f46e5, #7c3aed, #0ea5e9);
    border-radius: 50px;
    transition: width .7s cubic-bezier(.16,1,.3,1);
}

/* Question Card */

.question-card {
    padding: clamp(22px, 5vw, 42px);
    overflow: hidden;
}

/* Question Animation Container */

.question-content {
    animation: questionEnter .9s cubic-bezier(.16,1,.3,1);
}

.question-number {
    display: inline-block;
    padding: 7px 13px;
    border-radius: 12px;
    background: rgba(79,70,229,.10);
    color: var(--primary-dark);
    font-weight: 800;
    font-size: 16px;
    margin-bottom: 16px;
}

.question {
    font-family: "Times New Roman", serif;
    font-size: clamp(22px, 3vw, 29px);
    line-height: 1.5;
    font-weight: 700;
}

.question-bangla {
    margin-top: 8px;
    font-family: "Noto Sans Bengali", "Kalpurush", sans-serif;
    font-size: 18px;
    line-height: 1.7;
    color: #64748b;
}

/* Options */

.options {
    margin-top: 28px;
    display: grid;
    gap: 13px;
}

.option {
    width: 100%;
    padding: 16px 18px;
    border-radius: 17px;
    border: 1px solid rgba(203,213,225,.8);
    background: rgba(255,255,255,.72);
    cursor: pointer;

    display: flex;
    align-items: center;
    gap: 14px;

    font-family: "Times New Roman", serif;
    font-size: 20px;
    text-align: left;

    transition:
        transform .35s cubic-bezier(.16,1,.3,1),
        box-shadow .35s ease,
        border-color .35s ease,
        background .35s ease;
}

.option:hover {
    transform: translateX(5px);
    border-color: rgba(79,70,229,.4);
    box-shadow: 0 10px 28px rgba(79,70,229,.10);
}

.option-letter {
    min-width: 35px;
    height: 35px;
    border-radius: 50%;
    background: rgba(79,70,229,.10);
    color: var(--primary);
    display: grid;
    place-items: center;
    font-weight: 800;
}

.option.correct {
    background: var(--green-bg);
    border-color: rgba(21,128,61,.4);
    color: #166534;
}

.option.correct .option-letter {
    background: #15803d;
    color: white;
}

.option.wrong {
    background: var(--red-bg);
    border-color: rgba(220,38,38,.4);
    color: #991b1b;
}

.option.wrong .option-letter {
    background: #dc2626;
    color: white;
}

.option.disabled {
    cursor: default;
}

.option.disabled:hover {
    transform: none;
}

/* Explanation */

.explanation {
    margin-top: 25px;
    padding: 20px;
    border-radius: 20px;
    background: rgba(248,250,252,.85);
    border-left: 5px solid var(--primary);

    font-family: "Noto Sans Bengali", "Kalpurush", sans-serif;
    font-size: 18px;
    line-height: 1.9;

    animation: explanationIn .7s cubic-bezier(.16,1,.3,1);
}

.explanation strong {
    color: var(--primary-dark);
}

/* Controls */

.controls {
    margin-top: 22px;
    display: flex;
    justify-content: space-between;
    gap: 12px;
}

.btn {
    border: none;
    padding: 14px 24px;
    border-radius: 15px;
    cursor: pointer;

    font-family: "Times New Roman", serif;
    font-size: 18px;
    font-weight: 700;

    transition:
        transform .3s cubic-bezier(.16,1,.3,1),
        box-shadow .3s ease,
        opacity .3s ease;
}

.btn:hover:not(:disabled) {
    transform: translateY(-3px);
}

.btn:active:not(:disabled) {
    transform: scale(.96);
}

.previous {
    background: rgba(226,232,240,.85);
    color: #334155;
}

.next {
    background: linear-gradient(135deg, #4f46e5, #7c3aed);
    color: white;
    box-shadow: 0 10px 25px rgba(79,70,229,.22);
}

.btn:disabled {
    opacity: .4;
    cursor: not-allowed;
}

/* Footer */

.footer {
    text-align: center;
    margin-top: 18px;
    color: #64748b;
    font-size: 15px;
}

/* Animations */

@keyframes questionEnter {
    0% {
        opacity: 0;
        transform: translateX(35px) scale(.985);
        filter: blur(4px);
    }

    100% {
        opacity: 1;
        transform: translateX(0) scale(1);
        filter: blur(0);
    }
}

@keyframes explanationIn {
    0% {
        opacity: 0;
        transform: translateY(18px);
    }

    100% {
        opacity: 1;
        transform: translateY(0);
    }
}

@keyframes headerIn {
    0% {
        opacity: 0;
        transform: translateY(-20px);
    }

    100% {
        opacity: 1;
        transform: translateY(0);
    }
}

/* Mobile */

@media (max-width: 650px) {

    body {
        padding: 14px 10px;
    }

    .glass-card {
        border-radius: 21px;
    }

    .top-bar {
        flex-direction: column;
        align-items: flex-start;
        padding: 16px;
    }

    .stats {
        width: 100%;
        justify-content: flex-start;
    }

    .stat {
        font-size: 16px;
    }

    .question-card {
        padding: 22px 17px;
    }

    .question {
        font-size: 22px;
    }

    .question-bangla {
        font-size: 18px;
    }

    .option {
        font-size: 19px;
        padding: 14px;
    }

    .controls {
        position: sticky;
        bottom: 8px;
        padding-top: 10px;
    }

    .btn {
        flex: 1;
        padding: 13px 10px;
    }
}
</style>

    <header class="header">

        <p>Infinity MCQ Practice System</p>

    <div class="glass-card top-bar">

        <div class="part-label">
            Grammar Part: <span>Noun</span>

        <div id="questionArea"></div>

<script>

/* =========================================================
   PART 5 — NOUN
   INFINITE QUESTION GENERATOR
========================================================= */


/* ---------------------------------------------------------
   Allowed Names
--------------------------------------------------------- */

const names = [
    "Firoz",
    "Fatiha",
    "Fatema",
    "Jui",
    "Ema",
    "Rupa",
    "Moksed",
    "Ferjousi",
    "Jannati",
    "Mini",
    "Miraz",
    "Mujahid",
    "Milon",
    "Hannan",
    "Joba",
    "Tanzila",
    "Rina",
    "Tania",
    "Taslima"
];


/* ---------------------------------------------------------
   Question History
--------------------------------------------------------- */

let questions = [];
let currentIndex = 0;

let score = 0;
let correctCount = 0;
let attempted = 0;


/* ---------------------------------------------------------
   Random Helper
--------------------------------------------------------- */

function randomItem(array) {
    return array[Math.floor(Math.random() * array.length)];
}

function shuffle(array) {
    return [...array].sort(() => Math.random() - 0.5);
}


/* ---------------------------------------------------------
   Question Templates
--------------------------------------------------------- */

const generators = [

    /* 1. Identify Common Noun */

    function() {

        const data = [
            {
                sentence: `${randomItem(names)} bought a new book.`,
                answer: "book",
                options: ["Firoz", "book", "new", "bought"],
                explanation:
                "‘Book’ হলো Common Noun। কারণ এটি কোনো নির্দিষ্ট একটি বইয়ের নাম নয়; সাধারণভাবে একটি বইকে বোঝাচ্ছে। ‘Firoz’ হলো Proper Noun, ‘new’ adjective এবং ‘bought’ verb।"
            },
            {
                sentence: `${randomItem(names)} visited the school.`,
                answer: "school",
                options: ["visited", "school", "the", randomItem(names)],
                explanation:
                "‘School’ এখানে Common Noun। কারণ এটি একটি সাধারণ প্রতিষ্ঠানের নাম বোঝাচ্ছে। কোনো নির্দিষ্ট স্কুলের নিজস্ব নাম দেওয়া হয়নি।"
            },
            {
                sentence: `${randomItem(names)} opened the door.`,
                answer: "door",
                options: ["opened", "the", "door", randomItem(names)],
                explanation:
                "‘Door’ হলো Common Noun। এটি একটি সাধারণ দরজাকে বোঝাচ্ছে। ‘Opened’ verb এবং ব্যক্তির নামটি Proper Noun।"
            }
        ];

        const item = randomItem(data);

        return makeQuestion(
            item.sentence,
            "Which word is a Common Noun?",
            item.answer,
            item.options,
            item.explanation
        );
    },


    /* 2. Proper Noun */

    function() {

        const person = randomItem(names);

        return makeQuestion(
            `${person} is reading an English grammar book.`,
            "Which word is a Proper Noun?",
            person,
            [person, "reading", "grammar", "book"],
            `‘${person}’ একটি নির্দিষ্ট ব্যক্তির নাম। তাই এটি Proper Noun। Proper Noun কোনো নির্দিষ্ট ব্যক্তি, স্থান, প্রতিষ্ঠান বা বস্তুর বিশেষ নাম বোঝায় এবং সাধারণত Capital Letter দিয়ে শুরু হয়।`
        );
    },


    /* 3. Abstract Noun */

    function() {

        const items = [
            ["Honesty", "Honesty is a great virtue."],
            ["Kindness", "Kindness makes a person respected."],
            ["Wisdom", "Wisdom is valuable."],
            ["Beauty", "Beauty attracts attention."],
            ["Freedom", "Freedom is precious."]
        ];

        const item = randomItem(items);

        return makeQuestion(
            item[1],
            "Which word is an Abstract Noun?",
            item[0],
            [item[0], "person", "attention", "great"],
            `‘${item[0]}’ হলো Abstract Noun। কারণ এটি এমন একটি গুণ, অবস্থা বা ধারণাকে বোঝায়, যাকে সরাসরি চোখে দেখা বা হাতে স্পর্শ করা যায় না।`
        );
    },


    /* 4. Collective Noun */

    function() {

        const data = [
            ["A team of players won the match.", "team"],
            ["A flock of birds flew away.", "flock"],
            ["A bunch of flowers was on the table.", "bunch"],
            ["A group of students entered the room.", "group"],
            ["A herd of cattle was moving.", "herd"]
        ];

        const item = randomItem(data);

        return makeQuestion(
            item[0],
            "Which word is a Collective Noun?",
            item[1],
            [item[1], "match", "room", "moving"],
            `‘${item[1]}’ হলো Collective Noun। এটি একাধিক ব্যক্তি, প্রাণী বা বস্তুকে একসঙ্গে একটি দল বা সমষ্টি হিসেবে বোঝায়।`
        );
    },


    /* 5. Material Noun */

    function() {

        const data = [
            ["Gold is a valuable metal.", "Gold"],
            ["Water is essential for life.", "Water"],
            ["Silver is used to make ornaments.", "Silver"],
            ["Milk is good for health.", "Milk"],
            ["Iron is a useful metal.", "Iron"]
        ];

        const item = randomItem(data);

        return makeQuestion(
            item[0],
            "Which word is a Material Noun?",
            item[1],
            [item[1], "valuable", "life", "useful"],
            `‘${item[1]}’ হলো Material Noun। Material Noun এমন পদার্থের নাম বোঝায়, যেগুলো দিয়ে বিভিন্ন বস্তু তৈরি করা যায় অথবা যেগুলো কোনো পদার্থকে নির্দেশ করে।`
        );
    },


    /* 6. Countable Noun */

    function() {

        const data = [
            ["I bought three books.", "books"],
            ["Firoz has two pens.", "pens"],
            ["Jui bought five apples.", "apples"],
            ["Milon has four bags.", "bags"]
        ];

        const item = randomItem(data);

        return makeQuestion(
            item[0],
            "Which word is a Countable Noun?",
            item[1],
            [item[1], "bought", "has", "five"],
            `‘${item[1]}’ হলো Countable Noun। কারণ এটিকে সংখ্যা দিয়ে গণনা করা যায়—যেমন one ${item[1].replace(/s$/, "")}, two ${item[1]}, three ${item[1]} ইত্যাদি।`
        );
    },


    /* 7. Uncountable Noun */

    function() {

        const data = [
            ["We need some water.", "water"],
            ["Fatiha bought some rice.", "rice"],
            ["There is some milk in the glass.", "milk"],
            ["We need some information.", "information"],
            ["He gave me some advice.", "advice"]
        ];

        const item = randomItem(data);

        return makeQuestion(
            item[0],
            "Which word is an Uncountable Noun?",
            item[1],
            [item[1], "some", "glass", "need"],
            `‘${item[1]}’ সাধারণভাবে সরাসরি সংখ্যা দিয়ে গণনা করা যায় না। তাই এটি Uncountable Noun। এ ধরনের noun-এর আগে সাধারণত some, much, little ইত্যাদি ব্যবহার করা যায়।`
        );
    },


    /* 8. Gender */

    function() {

        const data = [
            ["The boy is playing.", "boy"],
            ["The woman is reading.", "woman"],
            ["The king ruled the country.", "king"],
            ["The mother loves her child.", "mother"]
        ];

        const item = randomItem(data);

        return makeQuestion(
            item[0],
            "Which word is a Masculine or Feminine Gender Noun?",
            item[1],
            [item[1], "playing", "reading", "country"],
            `‘${item[1]}’ একটি Gender Noun। এটি ব্যক্তি বা প্রাণীর পুরুষ বা স্ত্রীলিঙ্গ বোঝাতে ব্যবহৃত হয়েছে।`
        );
    },


    /* 9. Plural Noun */

    function() {

        const data = [
            ["Firoz bought two books.", "books"],
            ["There are three boxes.", "boxes"],
            ["Jannati has two pens.", "pens"],
            ["The children are playing.", "children"]
        ];

        const item = randomItem(data);

        return makeQuestion(
            item[0],
            "Which word is a Plural Noun?",
            item[1],
            [item[1], "bought", "two", "playing"],
            `‘${item[1]}’ একাধিক ব্যক্তি বা বস্তুকে বোঝাচ্ছে। তাই এটি Plural Noun। Plural Noun সাধারণত একের বেশি ব্যক্তি, প্রাণী বা বস্তুর নাম প্রকাশ করে।`
        );
    },


    /* 10. Possessive Noun */

    function() {

        const person = randomItem(names);

        return makeQuestion(
            `This is ${person}'s book.`,
            "Which word shows possession?",
            `${person}'s`,
            [`${person}'s`, "book", "This", "is"],
            `‘${person}'s’ মালিকানা বা অধিকার বোঝাচ্ছে। তাই এটি Possessive form। Apostrophe + s (‘s) সাধারণত কোনো ব্যক্তি বা বস্তুর মালিকানা প্রকাশ করতে ব্যবহৃত হয়।`
        );
    },


    /* 11. Noun as Subject */

    function() {

        const person = randomItem(names);

        return makeQuestion(
            `${person} reads English every day.`,
            "Which word is the Subject of the sentence?",
            person,
            [person, "reads", "English", "day"],
            `‘${person}’ বাক্যের Subject। কারণ কাজটি কে করছে—এই প্রশ্নের উত্তর হলো ‘${person}’। Subject সাধারণত কাজের কর্তা বা বাক্যের মূল বিষয়কে প্রকাশ করে।`
        );
    },


    /* 12. Noun as Object */

    function() {

        const person = randomItem(names);

        return makeQuestion(
            `${person} reads a book.`,
            "Which word is the Object of the verb?",
            "book",
            [person, "reads", "book", "a"],
            "‘Book’ হলো verb ‘reads’-এর Object। কারণ ‘reads’ কাজটি কিসের ওপর করা হচ্ছে—এই প্রশ্নের উত্তর হলো ‘a book’।"
        );
    },


    /* 13. Noun from Adjective */

    function() {

        const data = [
            ["honest", "honesty"],
            ["kind", "kindness"],
            ["beautiful", "beauty"],
            ["wise", "wisdom"],
            ["brave", "bravery"]
        ];

        const item = randomItem(data);

        return makeQuestion(
            `The quality of being ${item[0]} is called ______.`,
            "Choose the correct Abstract Noun.",
            item[1],
            [item[1], item[0], item[0] + "ly", item[0] + "ing"],
            `‘${item[1]}’ হলো ‘${item[0]}’ থেকে গঠিত Abstract Noun। এটি একটি গুণ বা অবস্থার নাম প্রকাশ করে।`
        );
    },


    /* 14. Singular Noun */

    function() {

        const data = [
            ["a book", "book"],
            ["a pen", "pen"],
            ["a student", "student"],
            ["a flower", "flower"]
        ];

        const item = randomItem(data);

        return makeQuestion(
            `${randomItem(names)} has ${item[0]}.`,
            "Which word is a Singular Noun?",
            item[1],
            [item[1], "has", randomItem(names), "a"],
            `‘${item[1]}’ একজন বা একটি বস্তুকে বোঝাচ্ছে। তাই এটি Singular Noun। Singular Noun সাধারণত এক ব্যক্তি, প্রাণী বা বস্তুর নাম প্রকাশ করে।`
        );
    },


    /* 15. Proper vs Common */

    function() {

        const person = randomItem(names);

        return makeQuestion(
            `${person} lives in a village.`,
            "Which word is a Proper Noun?",
            person,
            [person, "lives", "village", "a"],
            `‘${person}’ একটি নির্দিষ্ট ব্যক্তির নাম। তাই এটি Proper Noun। অন্যদিকে ‘village’ সাধারণ একটি গ্রামের নাম বোঝায়, তাই এটি Common Noun।`
        );
    }

];


/* ---------------------------------------------------------
   Question Builder
--------------------------------------------------------- */

function makeQuestion(sentence, question, answer, options, explanation) {

    let uniqueOptions = [...new Set(options)];

    while (uniqueOptions.length < 4) {

        const extra = randomItem([
            "teacher",
            "student",
            "book",
            "school",
            "river",
            "garden"
        ]);

        if (!uniqueOptions.includes(extra)) {
            uniqueOptions.push(extra);
        }
    }

    uniqueOptions = shuffle(uniqueOptions).slice(0, 4);

    return {
        sentence,
        question,
        answer,
        options: uniqueOptions,
        explanation,
        selected: null,
        answered: false
    };
}


/* ---------------------------------------------------------
   Generate New Question
--------------------------------------------------------- */

function generateQuestion() {

    const generator = randomItem(generators);

    let newQuestion = generator();

    /*
       Prevent immediate duplicate question
    */

    if (questions.length > 0) {

        const last = questions[questions.length - 1];

        let attempts = 0;

        while (
            newQuestion.sentence === last.sentence &&
            attempts < 10
        ) {
            newQuestion = randomItem(generators)();
            attempts++;
        }
    }

    return newQuestion;
}


/* ---------------------------------------------------------
   Add Question
--------------------------------------------------------- */

function addQuestion() {

    questions.push(generateQuestion());

}


/* ---------------------------------------------------------
   Render Question
--------------------------------------------------------- */

function renderQuestion(direction = "next") {

    const question = questions[currentIndex];

    const area = document.getElementById("questionArea");

    /*
       Replace content so only the inner question changes.
       No page reload.
    */

    area.innerHTML = "";

    const wrapper = document.createElement("div");

    wrapper.className = "question-content";

    wrapper.innerHTML = `

        <div class="question-number">
            Question ${currentIndex + 1}
        </div>

        <div class="question">
            ${escapeHTML(question.question)}
        </div>

        <div class="question-bangla">
            (${escapeHTML(question.sentence)})
        </div>

        <div class="options"></div>

        ${
            question.answered
            ?
            `
            <div class="explanation">
                <strong>Explanation:</strong><br>
                ${question.explanation}
            </div>
            `
            :
            ""
        }

    `;

    area.appendChild(wrapper);


    const optionsContainer =
        wrapper.querySelector(".options");


    const letters = ["A", "B", "C", "D"];


    question.options.forEach((option, index) => {

        const button = document.createElement("button");

        button.className = "option";

        if (question.answered) {
            button.classList.add("disabled");

            if (option === question.answer) {
                button.classList.add("correct");
            }

            if (
                option === question.selected &&
                option !== question.answer
            ) {
                button.classList.add("wrong");
            }
        }

        button.innerHTML = `
            <span class="option-letter">
                ${letters[index]}
            </span>

            <span>
                ${escapeHTML(option)}
            </span>
        `;

        if (!question.answered) {

            button.addEventListener(
                "click",
                () => selectAnswer(option)
            );

        }

        optionsContainer.appendChild(button);

    });


    updateControls();
    updateProgress();

}


/* ---------------------------------------------------------
   Select Answer
--------------------------------------------------------- */

function selectAnswer(selected) {

    const question = questions[currentIndex];

    if (question.answered) {
        return;
    }

    question.selected = selected;
    question.answered = true;

    attempted++;

    if (selected === question.answer) {

        correctCount++;
        score += 10;

    } else {

        score = Math.max(0, score - 2);

    }

    updateStats();

    renderQuestion("same");

}


/* ---------------------------------------------------------
   Next Question
--------------------------------------------------------- */

function nextQuestion() {

    if (currentIndex < questions.length - 1) {

        currentIndex++;

    } else {

        /*
           Infinite system:
           Whenever user reaches the end,
           automatically generate a brand-new question.
        */

        addQuestion();
        currentIndex++;

    }

    renderQuestion("next");

}


/* ---------------------------------------------------------
   Previous Question
--------------------------------------------------------- */

function previousQuestion() {

    if (currentIndex > 0) {

        currentIndex--;

        renderQuestion("previous");

    }

}


/* ---------------------------------------------------------
   Controls
--------------------------------------------------------- */

function updateControls() {

    document.getElementById("previousBtn").disabled =
        currentIndex === 0;

}


/* ---------------------------------------------------------
   Progress
--------------------------------------------------------- */

function updateProgress() {

    const number = currentIndex + 1;

    document.getElementById("progressText").textContent =
        `Question ${number}`;

    /*
       Since this is infinite, the progress bar represents
       the current position in the generated session.
    */

    const total = Math.max(questions.length, number);

    let percent = (number / total) * 100;

    if (number === total) {
        percent = 100;
    }

    document.getElementById("progressBar").style.width =
        percent + "%";
}


/* ---------------------------------------------------------
   Statistics
--------------------------------------------------------- */

function updateStats() {

    document.getElementById("score").textContent =
        score;

    document.getElementById("correct").textContent =
        correctCount;

    document.getElementById("attempted").textContent =
        attempted;

}


/* ---------------------------------------------------------
   Escape HTML
--------------------------------------------------------- */

function escapeHTML(value) {

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


/* ---------------------------------------------------------
   Button Events
--------------------------------------------------------- */

document
    .getElementById("nextBtn")
    .addEventListener("click", nextQuestion);

document
    .getElementById("previousBtn")
    .addEventListener("click", previousQuestion);


/* ---------------------------------------------------------
   Initial Questions
--------------------------------------------------------- */

for (let i = 0; i < 5; i++) {
    addQuestion();
}

renderQuestion();
updateStats();


/* ---------------------------------------------------------
   Keyboard Navigation
--------------------------------------------------------- */

document.addEventListener("keydown", function(event) {

    if (event.key === "ArrowRight") {
        nextQuestion();
    }

    if (event.key === "ArrowLeft") {
        previousQuestion();
    }

});

</script>
