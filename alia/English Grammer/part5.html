<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<title>Part 1 - Noun | Infinity MCQ Practice</title>

<style>
/* =========================================================
   PART 1 - NOUN
   INFINITY MCQ PRACTICE SYSTEM
   Single HTML File
========================================================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

:root{
    --primary:#4f46e5;
    --primary-light:#818cf8;
    --success:#16a34a;
    --danger:#dc2626;
    --text:#172033;
    --muted:#667085;
    --card:rgba(255,255,255,.72);
    --border:rgba(255,255,255,.85);
}

html{
    scroll-behavior:smooth;
}

body{
    min-height:100vh;
    font-family:"Times New Roman","Kalpurush",sans-serif;
    color:var(--text);

    background:
        radial-gradient(circle at 10% 10%, rgba(129,140,248,.16), transparent 30%),
        radial-gradient(circle at 90% 20%, rgba(96,165,250,.13), transparent 30%),
        radial-gradient(circle at 50% 100%, rgba(167,139,250,.12), transparent 35%),
        linear-gradient(135deg,#ffffff,#f8fafc,#f1f5f9);

    overflow-x:hidden;
}

/* ---------- Background Decoration ---------- */

body::before,
body::after{
    content:"";
    position:fixed;
    width:280px;
    height:280px;
    border-radius:50%;
    filter:blur(70px);
    opacity:.22;
    z-index:-1;
    animation:floatBlob 12s ease-in-out infinite alternate;
}

body::before{
    background:#818cf8;
    top:-80px;
    left:-80px;
}

body::after{
    background:#38bdf8;
    bottom:-100px;
    right:-80px;
    animation-delay:2s;
}

@keyframes floatBlob{
    from{transform:translate(0,0) scale(1);}
    to{transform:translate(30px,30px) scale(1.15);}
}

/* ---------- Main Container ---------- */

.app{
    width:min(100%,1100px);
    margin:auto;
    padding:25px 18px 50px;
}

/* ---------- Header ---------- */

.header{
    text-align:center;
    margin-bottom:25px;
    animation:fadeDown 1s ease both;
}

.header h1{
    font-size:clamp(30px,5vw,48px);
    font-weight:800;
    letter-spacing:.5px;
}

.header h1 span{
    background:linear-gradient(90deg,#4f46e5,#7c3aed,#2563eb);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
}

.header p{
    margin-top:8px;
    font-size:22px;
    color:var(--muted);
}

/* ---------- Stats ---------- */

.stats{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:12px;
    margin-bottom:20px;
}

.stat{
    background:var(--card);
    border:1px solid var(--border);
    backdrop-filter:blur(16px);
    -webkit-backdrop-filter:blur(16px);
    border-radius:18px;
    padding:14px 10px;
    text-align:center;
    box-shadow:0 10px 30px rgba(15,23,42,.08);
    transition:.35s ease;
}

.stat:hover{
    transform:translateY(-4px);
    box-shadow:0 15px 35px rgba(15,23,42,.13);
}

.stat-label{
    display:block;
    font-size:17px;
    color:var(--muted);
}

.stat-value{
    display:block;
    font-size:26px;
    font-weight:bold;
    margin-top:3px;
}

/* ---------- Progress ---------- */

.progress-wrapper{
    margin-bottom:20px;
}

.progress-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-size:18px;
    margin-bottom:7px;
}

.progress-bar{
    height:10px;
    background:rgba(148,163,184,.22);
    border-radius:50px;
    overflow:hidden;
}

.progress-fill{
    height:100%;
    width:0%;
    border-radius:50px;
    background:linear-gradient(90deg,#4f46e5,#7c3aed,#2563eb);
    transition:width .7s cubic-bezier(.22,1,.36,1);
}

/* ---------- Main Card ---------- */

.quiz-card{
    background:rgba(255,255,255,.68);
    border:1px solid rgba(255,255,255,.9);
    backdrop-filter:blur(22px);
    -webkit-backdrop-filter:blur(22px);
    border-radius:28px;
    padding:35px;
    box-shadow:
        0 25px 70px rgba(15,23,42,.10),
        inset 0 1px 0 rgba(255,255,255,.8);

    animation:cardIn .9s ease both;
}

.question-number{
    display:inline-flex;
    align-items:center;
    gap:8px;
    padding:8px 15px;
    border-radius:30px;
    background:rgba(79,70,229,.10);
    color:#4338ca;
    font-size:18px;
    font-weight:bold;
    margin-bottom:18px;
}

.question{
    font-size:30px;
    line-height:1.45;
    font-weight:700;
    margin-bottom:6px;
}

.question-bangla{
    font-family:"Kalpurush","Noto Sans Bengali",sans-serif;
    font-size:23px;
    color:#475467;
    line-height:1.6;
    margin-bottom:25px;
}

/* ---------- Options ---------- */

.options{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
}

.option{
    position:relative;
    width:100%;
    min-height:70px;

    display:flex;
    align-items:center;
    gap:15px;

    padding:15px 18px;

    border:1px solid rgba(148,163,184,.28);
    border-radius:18px;

    background:rgba(255,255,255,.70);

    font-family:"Times New Roman","Kalpurush",sans-serif;
    font-size:25px;
    text-align:left;

    cursor:pointer;

    box-shadow:0 8px 25px rgba(15,23,42,.06);

    transition:
        transform .35s ease,
        box-shadow .35s ease,
        background .35s ease,
        border .35s ease;
}

.option:hover:not(:disabled){
    transform:translateY(-4px) scale(1.01);
    box-shadow:0 15px 30px rgba(79,70,229,.13);
    border-color:rgba(79,70,229,.35);
}

.option-letter{
    width:42px;
    height:42px;
    min-width:42px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:12px;
    background:#eef2ff;
    color:#4338ca;
    font-weight:bold;
}

.option.correct{
    background:rgba(22,163,74,.10);
    border-color:rgba(22,163,74,.55);
    color:#166534;
    animation:pulseCorrect .65s ease;
}

.option.correct .option-letter{
    background:#16a34a;
    color:white;
}

.option.wrong{
    background:rgba(220,38,38,.09);
    border-color:rgba(220,38,38,.55);
    color:#991b1b;
    animation:shake .55s ease;
}

.option.wrong .option-letter{
    background:#dc2626;
    color:white;
}

.option:disabled{
    cursor:default;
}

/* ---------- Explanation ---------- */

.explanation{
    display:none;
    margin-top:25px;
    padding:23px;

    border-radius:20px;

    background:rgba(248,250,252,.86);
    border:1px solid rgba(148,163,184,.20);

    animation:explanationIn .6s ease both;
}

.explanation.show{
    display:block;
}

.explanation-title{
    font-size:24px;
    font-weight:bold;
    margin-bottom:10px;
}

.explanation-text{
    font-family:"Kalpurush","Noto Sans Bengali",sans-serif;
    font-size:23px;
    line-height:1.8;
    color:#344054;
}

.rule-box{
    margin-top:15px;
    padding:15px 18px;
    border-left:5px solid var(--primary);
    background:rgba(79,70,229,.07);
    border-radius:10px;

    font-family:"Kalpurush","Noto Sans Bengali",sans-serif;
    font-size:21px;
    line-height:1.7;
}

/* ---------- Controls ---------- */

.controls{
    display:flex;
    justify-content:space-between;
    gap:15px;
    margin-top:28px;
}

.btn{
    min-width:150px;
    padding:15px 22px;

    border:none;
    border-radius:15px;

    font-family:"Times New Roman","Kalpurush",sans-serif;
    font-size:22px;
    font-weight:bold;

    cursor:pointer;

    transition:.3s ease;
}

.btn:hover{
    transform:translateY(-3px);
}

.btn:active{
    transform:scale(.96);
}

.previous{
    background:#e2e8f0;
    color:#334155;
}

.next{
    color:white;
    background:linear-gradient(135deg,#4f46e5,#7c3aed);
    box-shadow:0 10px 25px rgba(79,70,229,.25);
}

.next:hover{
    box-shadow:0 15px 35px rgba(79,70,229,.35);
}

/* ---------- Footer ---------- */

.footer{
    text-align:center;
    margin-top:25px;
    color:#667085;
    font-size:17px;
}

/* ---------- Animations ---------- */

@keyframes fadeDown{
    from{
        opacity:0;
        transform:translateY(-30px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

@keyframes cardIn{
    from{
        opacity:0;
        transform:translateY(35px) scale(.97);
    }
    to{
        opacity:1;
        transform:translateY(0) scale(1);
    }
}

@keyframes explanationIn{
    from{
        opacity:0;
        transform:translateY(20px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

@keyframes pulseCorrect{
    0%{transform:scale(1);}
    45%{transform:scale(1.025);}
    100%{transform:scale(1);}
}

@keyframes shake{
    0%,100%{transform:translateX(0);}
    20%{transform:translateX(-8px);}
    40%{transform:translateX(8px);}
    60%{transform:translateX(-6px);}
    80%{transform:translateX(6px);}
}

.slide-in{
    animation:slideIn .65s cubic-bezier(.22,1,.36,1);
}

@keyframes slideIn{
    from{
        opacity:0;
        transform:translateX(50px);
    }
    to{
        opacity:1;
        transform:translateX(0);
    }
}

/* ---------- Responsive ---------- */

@media(max-width:750px){

    .app{
        padding:18px 12px 35px;
    }

    .stats{
        grid-template-columns:repeat(2,1fr);
    }

    .quiz-card{
        padding:23px 17px;
        border-radius:22px;
    }

    .question{
        font-size:27px;
    }

    .question-bangla{
        font-size:21px;
    }

    .options{
        grid-template-columns:1fr;
        gap:12px;
    }

    .option{
        font-size:23px;
        min-height:64px;
    }

    .explanation-text{
        font-size:21px;
    }

    .rule-box{
        font-size:20px;
    }

    .controls{
        flex-direction:column;
    }

    .btn{
        width:100%;
    }
}

@media(max-width:420px){

    .header h1{
        font-size:31px;
    }

    .header p{
        font-size:19px;
    }

    .question{
        font-size:24px;
    }

    .question-bangla{
        font-size:20px;
    }

    .option{
        font-size:22px;
        padding:12px;
    }

    .stat-value{
        font-size:23px;
    }
}
</style>
</head>

/* =========================================================
   RANDOM UTILITIES
========================================================= */

function randomItem(array){
    return array[Math.floor(Math.random()*array.length)];
}

function shuffle(array){

    const arr=[...array];

    for(let i=arr.length-1;i>0;i--){

        const j=Math.floor(Math.random()*(i+1));

        [arr[i],arr[j]]=[arr[j],arr[i]];
    }

    return arr;
}


/* =========================================================
   QUESTION GENERATOR
========================================================= */

function generateQuestion(){

    const category=randomItem(nounData);

    let question="";
    let bangla="";
    let options=[];
    let correctAnswer="";
    let explanation="";
    let rule="";

    /* ---------- IDENTIFY ---------- */

    if(category.type==="identify"){

        const item=randomItem(category.sentences);

        question=item[0];
        bangla=category.bangla;

        options=shuffle([
            item[1],
            "reads",
            "beautiful",
            "slowly"
        ]);

        correctAnswer=item[1];

        explanation=
            `"${item[1]}" এখানে একটি Noun, কারণ এটি একজন ব্যক্তি, বস্তু বা জিনিসের নাম প্রকাশ করছে।`;

        rule=
            "Noun হলো এমন word যা কোনো person, place, animal, thing বা idea-এর নাম প্রকাশ করে।";
    }


    /* ---------- COMMON ---------- */

    else if(category.type==="common"){

        const set=randomItem(category.sets);

        question=category.template;
        bangla=category.bangla;

        options=shuffle(set);

        correctAnswer=set[0];

        explanation=
            `"${correctAnswer}" একটি Common Noun। এটি কোনো নির্দিষ্ট ব্যক্তির বা স্থানের নাম নয়; বরং একই ধরনের সাধারণ ব্যক্তি/বস্তু বোঝায়।`;

        rule=
            "Common Noun সাধারণ ব্যক্তি, স্থান, প্রাণী বা বস্তুর নাম বোঝায়। যেমন: boy, city, teacher, book।";
    }


    /* ---------- PROPER ---------- */

    else if(category.type==="proper"){

        const set=randomItem(category.sets);

        question=category.template;
        bangla=category.bangla;

        options=shuffle(set);

        correctAnswer=set[0];

        explanation=
            `"${correctAnswer}" একটি Proper Noun। এটি একটি নির্দিষ্ট ব্যক্তি, স্থান, দিন বা বিশেষ নাম বোঝায়।`;

        rule=
            "Proper Noun হলো নির্দিষ্ট ব্যক্তি, স্থান, দেশ, নদী, দিন ইত্যাদির নাম। সাধারণত এর প্রথম অক্ষর Capital Letter হয়।";
    }


    /* ---------- COLLECTIVE ---------- */

    else if(category.type==="collective"){

        const set=randomItem(category.sets);

        question=category.template;
        bangla=category.bangla;

        options=shuffle(set);

        correctAnswer=set[0];

        explanation=
            `"${correctAnswer}" একটি Collective Noun। এটি একাধিক ব্যক্তি বা প্রাণীর একটি দল/সমষ্টিকে একসঙ্গে বোঝায়।`;

        rule=
            "Collective Noun হলো এমন Noun যা একদল ব্যক্তি, প্রাণী বা বস্তুকে একসঙ্গে বোঝায়। যেমন: team, class, army, flock।";
    }


    /* ---------- ABSTRACT ---------- */

    else if(category.type==="abstract"){

        const set=randomItem(category.sets);

        question=category.template;
        bangla=category.bangla;

        options=shuffle(set);

        correctAnswer=set[0];

        explanation=
            `"${correctAnswer}" একটি Abstract Noun। এটি এমন একটি গুণ, অবস্থা বা ধারণা প্রকাশ করে যা সাধারণত চোখে দেখা বা হাতে ধরা যায় না।`;

        rule=
            "Abstract Noun কোনো গুণ, অবস্থা, অনুভূতি বা ধারণার নাম বোঝায়। যেমন: honesty, beauty, wisdom, freedom।";
    }


    /* ---------- MATERIAL ---------- */

    else if(category.type==="material"){

        const set=randomItem(category.sets);

        question=category.template;
        bangla=category.bangla;

        options=shuffle(set);

        correctAnswer=set[0];

        explanation=
            `"${correctAnswer}" একটি Material Noun। এটি এমন একটি পদার্থের নাম যা দিয়ে অন্য বস্তু তৈরি হতে পারে।`;

        rule=
            "Material Noun কোনো পদার্থ বা উপাদানের নাম বোঝায়। যেমন: gold, silver, iron, water, wood।";
    }


    /* ---------- COUNTABLE ---------- */

    else if(category.type==="countable"){

        const set=randomItem(category.sets);

        question=category.template;
        bangla=category.bangla;

        options=shuffle(set);

        correctAnswer=set[0];

        explanation=
            `"${correctAnswer}" Countable Noun, কারণ এটিকে সংখ্যা দিয়ে গণনা করা যায়—যেমন one ${correctAnswer}, two ${correctAnswer}s।`;

        rule=
            "Countable Noun-এর একবচন ও বহুবচন হতে পারে এবং এগুলো সংখ্যা দিয়ে গণনা করা যায়।";
    }


    /* ---------- UNCOUNTABLE ---------- */

    else if(category.type==="uncountable"){

        const set=randomItem(category.sets);

        question=category.template;
        bangla=category.bangla;

        options=shuffle(set);

        correctAnswer=set[0];

        explanation=
            `"${correctAnswer}" সাধারণভাবে Uncountable Noun হিসেবে ব্যবহৃত হয়। এটিকে সরাসরি one, two, three দিয়ে গণনা করা যায় না।`;

        rule=
            "Uncountable Noun সাধারণত পদার্থ, ধারণা বা এমন জিনিস বোঝায় যা সরাসরি সংখ্যা দিয়ে গণনা করা যায় না।";
    }


    /* ---------- PLURAL ---------- */

    else if(category.type==="plural"){

        const item=randomItem(category.sets);

        question=`${category.template} "${item[0]}"`;
        bangla=category.bangla;

        options=item[1];

        correctAnswer=item[1][item[2]];

        explanation=
            `"${item[0]}"-এর সঠিক plural form হলো "${correctAnswer}"। এটি একটি irregular plural form।`;

        rule=
            "কিছু Noun-এর plural করতে শুধু -s বা -es যোগ হয় না; শব্দের রূপ পরিবর্তিত হয়। যেমন: child → children, man → men, tooth → teeth।";
    }


    /* ---------- SINGULAR ---------- */

    else if(category.type==="singular"){

        const item=randomItem(category.sets);

        question=`${category.template} "${item[0]}"`;
        bangla=category.bangla;

        options=item[1];

        correctAnswer=item[1][item[2]];

        explanation=
            `"${item[0]}"-এর সঠিক singular form হলো "${correctAnswer}"।`;

        rule=
            "Singular Noun একজন ব্যক্তি, একটি প্রাণী, একটি বস্তু বা একটি জিনিস বোঝায়।";
    }


    /* ---------- POSSESSIVE ---------- */

    else if(category.type==="possessive"){

        const item=randomItem(category.sets);

        question=item[0];
        bangla=category.bangla;

        options=item.slice(1);

        correctAnswer=item[1];

        explanation=
            `"${correctAnswer}" সঠিক, কারণ এখানে একটি ব্যক্তির মালিকানা বোঝানো হয়েছে। Singular proper noun-এর শেষে সাধারণত apostrophe + s ('s) বসে।`;

        rule=
            "Singular noun-এর Possessive করতে সাধারণত noun-এর শেষে 's বসে। যেমন: Firoz's book, Rina's pen।";
    }


    /* ---------- FORMATION ---------- */

    else if(category.type==="formation"){

        const item=randomItem(category.sets);

        question=`${category.template} "${item[0]}"`;
        bangla=category.bangla;

        options=shuffle(item.slice(1));

        correctAnswer=item[1];

        explanation=
            `"${item[0]}"-এর সঠিক Noun form হলো "${correctAnswer}"। এটি সংশ্লিষ্ট গুণ বা ধারণার নাম প্রকাশ করে।`;

        rule=
            "একটি Adjective বা অন্য word থেকে বিভিন্ন suffix ব্যবহার করে Noun তৈরি হতে পারে। যেমন: honest → honesty, kind → kindness।";
    }


    /* ---------- SENTENCE ---------- */

    else if(category.type==="sentence"){

        const item=randomItem(category.sets);

        question=item[0];
        bangla=category.bangla;

        options=shuffle(item.slice(1));

        correctAnswer=item[1];

        explanation=
            `"${correctAnswer}" এখানে সঠিক Noun, কারণ বাক্যে একজন ব্যক্তি বা একটি বস্তু/প্রাণীর নাম প্রয়োজন।`;

        rule=
            "বাক্যের অর্থ ও grammatical position দেখে বুঝতে হবে সেখানে কোন ধরনের word প্রয়োজন।";
    }


    return {
        question,
        bangla,
        options,
        correctAnswer,
        explanation,
        rule
    };
}


/* =========================================================
   APP STATE
========================================================= */

let currentQuestionNumber=1;

let correctCount=0;
let wrongCount=0;

let answered=false;

let currentQuestion=null;

const questionHistory=[];


/* =========================================================
   DOM
========================================================= */

const questionElement=
    document.getElementById("question");

const questionBanglaElement=
    document.getElementById("questionBangla");

const optionsElement=
    document.getElementById("options");

const explanationElement=
    document.getElementById("explanation");

const explanationText=
    document.getElementById("explanationText");

const ruleBox=
    document.getElementById("ruleBox");

const questionNumber=
    document.getElementById("questionNumber");

const questionCount=
    document.getElementById("questionCount");

const correctCountElement=
    document.getElementById("correctCount");

const wrongCountElement=
    document.getElementById("wrongCount");

const scoreElement=
    document.getElementById("score");

const progressFill=
    document.getElementById("progressFill");

const progressText=
    document.getElementById("progressText");

const previousBtn=
    document.getElementById("previousBtn");

const nextBtn=
    document.getElementById("nextBtn");

const quizCard=
    document.getElementById("quizCard");


/* =========================================================
   LOAD QUESTION
========================================================= */

function loadQuestion(question=null){

    if(!question){
        question=generateQuestion();
    }

    currentQuestion=question;

    answered=false;

    questionNumber.textContent=
        `Question ${currentQuestionNumber}`;

    questionCount.textContent=
        currentQuestionNumber;

    progressText.textContent=
        `Question ${currentQuestionNumber}`;

    /*
       Progress continuously moves.
       100 questions পর আবার cycle করবে।
    */

    const progress=
        ((currentQuestionNumber-1)%100)+1;

    progressFill.style.width=
        `${progress}%`;

    questionElement.textContent=
        question.question;

    questionBanglaElement.textContent=
        `(${question.bangla})`;

    optionsElement.innerHTML="";

    explanationElement.classList.remove("show");

    question.options.forEach((option,index)=>{

        const button=
            document.createElement("button");

        button.className="option";

        button.innerHTML=`
            <span class="option-letter">
                ${String.fromCharCode(65+index)}
            </span>

            <span>${option}</span>
        `;

        button.addEventListener(
            "click",
            ()=>selectAnswer(button,option)
        );

        optionsElement.appendChild(button);

    });

    previousBtn.disabled=
        currentQuestionNumber===1;

    previousBtn.style.opacity=
        currentQuestionNumber===1 ? ".5" : "1";

    quizCard.classList.remove("slide-in");

    /*
       Re-trigger animation
    */

    void quizCard.offsetWidth;

    quizCard.classList.add("slide-in");

    updateStats();
}


/* =========================================================
   SELECT ANSWER
========================================================= */

function selectAnswer(button,selected){

    if(answered) return;

    answered=true;

    const allOptions=
        document.querySelectorAll(".option");

    allOptions.forEach(btn=>{
        btn.disabled=true;
    });

    const isCorrect=
        selected===currentQuestion.correctAnswer;

    if(isCorrect){

        button.classList.add("correct");

        correctCount++;

    }else{

        button.classList.add("wrong");

        wrongCount++;

        /*
           Correct option highlight
        */

        allOptions.forEach(btn=>{

            const text=
                btn.querySelector("span:last-child")
                ?.textContent;

            if(text===currentQuestion.correctAnswer){
                btn.classList.add("correct");
            }

        });
    }

    explanationText.textContent=
        currentQuestion.explanation;

    ruleBox.textContent=
        `Rule: ${currentQuestion.rule}`;

    explanationElement.classList.add("show");

    updateStats();
}


/* =========================================================
   STATS
========================================================= */

function updateStats(){

    correctCountElement.textContent=
        correctCount;

    wrongCountElement.textContent=
        wrongCount;

    const total=
        correctCount+wrongCount;

    let score=0;

    if(total>0){
        score=Math.round((correctCount/total)*100);
    }

    scoreElement.textContent=
        `${score}%`;
}


/* =========================================================
   NEXT
========================================================= */

nextBtn.addEventListener("click",()=>{

    /*
       Current question history save
    */

    if(currentQuestion){

        questionHistory[currentQuestionNumber-1]={
            question:currentQuestion,
            answered:answered
        };
    }

    currentQuestionNumber++;

    /*
       Always create new question.
       Therefore practice can continue infinitely.
    */

    loadQuestion(generateQuestion());

});


/* =========================================================
   PREVIOUS
========================================================= */

previousBtn.addEventListener("click",()=>{

    if(currentQuestionNumber<=1) return;

    currentQuestionNumber--;

    const previous=
        questionHistory[currentQuestionNumber-1];

    if(previous){

        loadQuestion(previous.question);

    }else{

        loadQuestion(generateQuestion());

    }

});


/* =========================================================
   KEYBOARD SUPPORT
========================================================= */

document.addEventListener("keydown",(event)=>{

    if(event.key==="ArrowRight"){
        nextBtn.click();
    }

    if(event.key==="ArrowLeft"){
        previousBtn.click();
    }

});


/* =========================================================
   START
========================================================= */

loadQuestion();

</script>
