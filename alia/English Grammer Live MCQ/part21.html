
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PART 21 - Voice | Infinity MCQ</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap');

:root {
  --blue: #4169e1;
  --green: #16865b;
  --red: #d94343;
  --ink: #263248;
  --muted: #64748b;
  --glass: rgba(255,255,255,.82);
  --border: rgba(100,116,139,.16);
}

* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  padding: 24px 15px 40px;
  font-family: "Times New Roman", "Kalpurush", serif;
  font-size: 19px;
  color: var(--ink);
  background:
    radial-gradient(ellipse at 10% 5%, #e3edff 0, transparent 40%),
    radial-gradient(ellipse at 95% 90%, #e3f9ed 0, transparent 38%),
    linear-gradient(135deg, #fbfcff, #f2f5fa);
}

button { font: inherit; }

.app {
  width: 100%;
  max-width: 850px;
  margin: auto;
}

.header {
  text-align: center;
  margin: 12px 0 25px;
  animation: enter .9s cubic-bezier(.16,1,.3,1) both;
}

.eyebrow {
  display: inline-block;
  padding: 7px 15px;
  background: #e7edff;
  color: #3554b4;
  border-radius: 50px;
  font: 600 13px Arial, sans-serif;
  letter-spacing: 1.2px;
}

h1 {
  font-size: clamp(27px, 5vw, 39px);
  margin: 15px 0 8px;
}

.subtitle {
  color: var(--muted);
  font-size: 19px;
}

.panel {
  background: var(--glass);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
  border: 1px solid rgba(255,255,255,.95);
  border-radius: 24px;
  padding: clamp(18px, 4vw, 32px);
  box-shadow: 0 18px 55px rgba(37,56,91,.09);
}

.stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
  margin-bottom: 22px;
}

.stat {
  text-align: center;
  padding: 13px 5px;
  border-radius: 15px;
  background: rgba(240,244,255,.85);
  border: 1px solid var(--border);
}

.stat small {
  display: block;
  font: 12px Arial, sans-serif;
  color: var(--muted);
  margin-bottom: 7px;
}

.stat strong { font-size: 22px; }

.progress-track {
  height: 7px;
  border-radius: 20px;
  overflow: hidden;
  background: #e5eaf2;
  margin-bottom: 25px;
}

#progressBar {
  width: 0%;
  height: 100%;
  border-radius: inherit;
  background: linear-gradient(90deg, #4169e1, #42c8a4);
  transition: width .65s cubic-bezier(.22,1,.36,1);
}

.question-meta {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 17px;
  font: 12px Arial, sans-serif;
  color: var(--muted);
}

.tag {
  padding: 7px 11px;
  border-radius: 20px;
  background: #edf2ff;
  color: #3b58b5;
  font-weight: bold;
}

#questionStage {
  transform-origin: center;
}

#questionStage.animate {
  animation: questionIn .8s cubic-bezier(.16,1,.3,1) both;
}

.question {
  font-size: clamp(20px, 3vw, 25px);
  line-height: 1.5;
  font-weight: bold;
  margin: 0 0 7px;
}

.question-bn {
  color: #58677e;
  font-family: "Kalpurush", "Hind Siliguri", sans-serif;
  font-size: 19px;
  line-height: 1.65;
  margin: 0 0 24px;
}

.options {
  display: grid;
  gap: 12px;
}

.option {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 13px;
  text-align: left;
  padding: 15px 16px;
  border: 1px solid #e0e6ef;
  border-radius: 15px;
  color: var(--ink);
  background: rgba(255,255,255,.76);
  cursor: pointer;
  transition: background .25s ease, border-color .25s ease,
              transform .25s ease, box-shadow .25s ease;
  animation: optionIn .55s cubic-bezier(.16,1,.3,1) both;
  animation-delay: var(--delay, 0ms);
}

.option:hover:not(:disabled) {
  border-color: #91a9f6;
  background: #f3f6ff;
  transform: translateY(-2px);
  box-shadow: 0 7px 18px #4169e114;
}

.option:focus-visible, .nav-btn:focus-visible {
  outline: 3px solid #91a9f6;
  outline-offset: 3px;
}

.option:disabled { cursor: default; }

.letter {
  flex: 0 0 34px;
  height: 34px;
  display: grid;
  place-items: center;
  border-radius: 10px;
  background: #edf1f8;
  font: bold 14px Arial, sans-serif;
}

.option.correct {
  background: #e9f8f0;
  border-color: #3aaf7d;
  color: #116b48;
}

.option.correct .letter {
  background: #16865b;
  color: white;
}

.option.wrong {
  background: #fff0f0;
  border-color: #e36a6a;
  color: #a52c2c;
}

.option.wrong .letter {
  background: #d94343;
  color: white;
}

#feedback {
  display: none;
  margin-top: 23px;
  padding: 19px;
  border-radius: 17px;
  background: #f0f5ff;
  border: 1px solid #dce6ff;
  animation: enter .5s ease both;
}

#feedback.show { display: block; }

#feedback h3 {
  margin: 0 0 12px;
  font-size: 21px;
}

#feedback p {
  margin: 8px 0;
  font-family: "Kalpurush", "Hind Siliguri", sans-serif;
  font-size: 18px;
  line-height: 1.8;
}

#feedback .answer-line {
  font-family: "Times New Roman", serif;
  font-weight: bold;
  font-size: 19px;
}

.nav {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  margin-top: 25px;
}

.nav-btn {
  flex: 1;
  min-width: 120px;
  padding: 14px 18px;
  border: 0;
  border-radius: 13px;
  cursor: pointer;
  font: 600 15px Arial, sans-serif;
  transition: transform .25s, opacity .25s, box-shadow .25s;
}

.nav-btn:hover:not(:disabled) {
  transform: translateY(-2px);
  box-shadow: 0 8px 20px #23375b15;
}

.nav-btn:disabled {
  opacity: .4;
  cursor: not-allowed;
}

.secondary { background: #e9edf5; color: #34425a; }
.primary { background: linear-gradient(135deg,#4169e1,#5b79ed); color: white; }
.reset { background: #e8f7f0; color: #16734f; }

.footer {
  text-align: center;
  color: #7c8798;
  font: 12px Arial, sans-serif;
  margin-top: 23px;
}

@keyframes enter {
  from { opacity: 0; transform: translateY(15px); }
  to { opacity: 1; transform: translateY(0); }
}

@keyframes questionIn {
  from { opacity: 0; transform: translate3d(18px, 10px, 0) scale(.99); }
  to { opacity: 1; transform: translate3d(0, 0, 0) scale(1); }
}

@keyframes optionIn {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}

@media(max-width:480px) {
  body { padding: 12px 10px 25px; }
  .panel { border-radius: 19px; }
  .stats { gap: 7px; }
  .stat { padding: 12px 3px; }
  .option { padding: 13px 11px; }
  .nav-btn { min-width: 95px; padding: 13px 10px; }
}

@media(prefers-reduced-motion:reduce) {
  *, *::before, *::after {
    animation-duration: .01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: .01ms !important;
  }
}
</style>
</head>

<body>
<main class="app">
  <header class="header">
    <span class="eyebrow">INFINITY MCQ PRACTICE</span>
    <h1>PART 21 — Voice</h1>
    <div class="subtitle">Active Voice &amp; Passive Voice</div>
  </header>

  <section class="panel">
    <div class="stats">
      <div class="stat">
        <small>QUESTION</small>
        <strong id="questionCount">1</strong>
      </div>
      <div class="stat">
        <small>SCORE</small>
        <strong id="score">0</strong>
      </div>
      <div class="stat">
        <small>ACCURACY</small>
        <strong id="accuracy">—</strong>
      </div>
    </div>

    <div class="progress-track">
      <div id="progressBar"></div>
    </div>

    <div id="questionStage">
      <div class="question-meta">
        <span class="tag">VOICE CHANGE</span>
        <span id="attemptLabel">Not answered</span>
      </div>

      <h2 class="question" id="question"></h2>
      <p class="question-bn" id="questionBn"></p>
      <div class="options" id="options"></div>
      <div id="feedback" aria-live="polite"></div>
    </div>

    <div class="nav">
      <button class="nav-btn secondary" id="prevBtn">← Previous</button>
      <button class="nav-btn primary" id="nextBtn">Next →</button>
      <button class="nav-btn reset" id="resetBtn">Restart</button>
    </div>
  </section>

  <footer class="footer">
    PART 21 • ENGLISH GRAMMAR • LEARN · PRACTICE · IMPROVE
  </footer>
</main>

<script>
"use strict";

/*
  PART 21 — ACTIVE & PASSIVE VOICE
  New questions are generated locally.
  No page reload or external API is required.
*/

const $ = id => document.getElementById(id);

const people = [
  "Firoz", "Fatiha", "Fatema", "Jui", "Ema", "Rupa",
  "Moksed", "Ferjousi", "Jannati", "Mini", "Miraz",
  "Mujahid", "Milon", "Hannan", "Joba", "Tanzila",
  "Rina", "Tania", "Taslima"
];

const verbs = [
  {base:"write", past:"wrote", pp:"written", obj:"a letter"},
  {base:"make", past:"made", pp:"made", obj:"a cake"},
  {base:"complete", past:"completed", pp:"completed", obj:"the task"},
  {base:"clean", past:"cleaned", pp:"cleaned", obj:"the room"},
  {base:"read", past:"read", pp:"read", obj:"the book"},
  {base:"open", past:"opened", pp:"opened", obj:"the door"},
  {base:"prepare", past:"prepared", pp:"prepared", obj:"the lesson"},
  {base:"solve", past:"solved", pp:"solved", obj:"the problem"},
  {base:"buy", past:"bought", pp:"bought", obj:"a pen"},
  {base:"teach", past:"taught", pp:"taught", obj:"English"}
];

const structures = [
  {
    id:"present",
    make:(s,v)=>`${s} ${v.base}s ${v.obj}.`,
    passive:(v)=>`${cap(v.obj)} is ${v.pp} by`,
    be:"is",
    tense:"Simple Present",
    bn:"Present Indefinite: am/is/are + past participle"
  },
  {
    id:"past",
    make:(s,v)=>`${s} ${v.past} ${v.obj}.`,
    passive:(v)=>`${cap(v.obj)} was ${v.pp} by`,
    be:"was",
    tense:"Simple Past",
    bn:"Past Indefinite: was/were + past participle"
  },
  {
    id:"future",
    make:(s,v)=>`${s} will ${v.base} ${v.obj}.`,
    passive:(v)=>`${cap(v.obj)} will be ${v.pp} by`,
    be:"will be",
    tense:"Simple Future",
    bn:"Future Indefinite: will be + past participle"
  },
  {
    id:"continuous",
    make:(s,v)=>`${s} is ${v.base==="write"?"writing":v.base+"ing"} ${v.obj}.`,
    passive:(v)=>`${cap(v.obj)} is being ${v.pp} by`,
    be:"is being",
    tense:"Present Continuous",
    bn:"Present Continuous: am/is/are being + past participle"
  },
  {
    id:"presentPerfect",
    make:(s,v)=>`${s} has ${v.pp} ${v.obj}.`,
    passive:(v)=>`${cap(v.obj)} has been ${v.pp} by`,
    be:"has been",
    tense:"Present Perfect",
    bn:"Present Perfect: has/have been + past participle"
  }
];

function cap(s) {
  return s.charAt(0).toUpperCase()+s.slice(1);
}

function shuffle(arr) {
  const a = [...arr];
  for (let i=a.length-1;i>0;i--) {
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function pick(arr) {
  return arr[Math.floor(Math.random()*arr.length)];
}

function passiveSubject(person, structure) {
  // Subject agreement in passive voice
  if (structure.id==="past") return "was";
  if (structure.id==="future") return "will be";
  if (structure.id==="continuous") return "is being";
  if (structure.id==="presentPerfect") return "has been";
  return "is";
}

function buildQuestion() {
  const s=pick(people);
  const v=pick(verbs);
  const st=pick(structures);
  const correct=st.passive(v)+" "+s+".";
  const active=st.make(s,v);

  const wrongTenses = shuffle(structures.filter(x=>x.id!==st.id))
    .slice(0,3)
    .map(x=>x.passive(v)+" "+s+".");

  const wrongActive = active;
  const choices=shuffle([correct, ...wrongTenses.slice(0,2), wrongActive]);

  return {
    question:`Change the voice: "${active}"`,
    bn:`বাক্যটির Voice পরিবর্তন করে সঠিক Passive Voice নির্বাচন করুন। Tense: ${st.tense}.`,
    choices,
    answer:choices.indexOf(correct),
    explanation:
      `এটি ${st.tense} Tense-এর বাক্য। Active Voice-এ Subject কাজটি করে, আর Passive Voice-এ Object-কে গুরুত্ব দেওয়া হয়।\n\n`+
      `নিয়ম: Object + ${st.bn} + by + Subject.\n\n`+
      `এখানে "${v.obj}" হলো Object। তাই এটিকে বাক্যের শুরুতে বসাতে হবে। মূল Subject "${s}"-কে "by ${s}" হিসেবে বসানো হয়েছে। Verb-এর Past Participle (V3) ব্যবহার করতে হবে।`,
    tense:st.tense
  };
}

let questions=[];
let index=0;
let score=0;
let answered=0;
let records=[];

function makeNewQuestion() {
  let q;
  let tries=0;
  do {
    q=buildQuestion();
    tries++;
  } while (
    tries<15 &&
    questions.slice(-8).some(old=>old.question===q.question)
  );
  questions.push(q);
}

function ensureQuestion(i) {
  while(questions.length<=i) makeNewQuestion();
}

function render() {
  ensureQuestion(index);
  const q=questions[index];

  $("questionCount").textContent=index+1;
  $("score").textContent=score;
  $("accuracy").textContent=answered
    ? Math.round(score/answered*100)+"%"
    : "—";

  // Progress is a visual indicator, not a finite quiz limit.
  $("progressBar").style.width=(index%20+1)/20*100+"%";
  $("attemptLabel").textContent=records[index]
    ? "Answered"
    : "Not answered";

  $("question").textContent=q.question;
  $("questionBn").textContent="("+q.bn+")";

  const options=$("options");
  options.replaceChildren();

  const letters=["A","B","C","D"];

  q.choices.forEach((choice,i)=>{
    const button=document.createElement("button");
    button.className="option";
    button.style.setProperty("--delay",`${i*90}ms`);

    const letter=document.createElement("span");
    letter.className="letter";
    letter.textContent=letters[i];

    const text=document.createElement("span");
    text.textContent=choice;

    button.append(letter,text);
    button.addEventListener("click",()=>selectAnswer(i));
    options.appendChild(button);
  });

  $("feedback").className="";
  $("feedback").replaceChildren();

  if(records[index]) showFeedback(records[index].selected);
  $("prevBtn").disabled=index===0;
  $("nextBtn").textContent="Next →";

  const stage=$("questionStage");
  stage.classList.remove("animate");
  void stage.offsetWidth;
  stage.classList.add("animate");
}

function selectAnswer(selected) {
  if(records[index]) return;

  const q=questions[index];
  const correct=selected===q.answer;

  records[index]={selected, correct};
  answered++;
  if(correct) score++;

  showFeedback(selected);
  updateStats();
}

function updateStats() {
  $("score").textContent=score;
  $("accuracy").textContent=answered
    ? Math.round(score/answered*100)+"%"
    : "—";
  $("attemptLabel").textContent="Answered";
}

function showFeedback(selected) {
  const q=questions[index];
  const record=records[index];
  const correct=record ? record.correct : selected===q.answer;

  [...$("options").children].forEach((button,i)=>{
    button.disabled=true;
    if(i===q.answer) button.classList.add("correct");
    else if(i===selected) button.classList.add("wrong");
  });

  const box=$("feedback");
  box.replaceChildren();
  box.className="show";

  const heading=document.createElement("h3");
  heading.textContent=correct ? "✓ Correct Answer!" : "✗ Incorrect Answer";
  heading.style.color=correct ? "#16865b" : "#c23737";
  box.appendChild(heading);

  const answer=document.createElement("p");
  answer.className="answer-line";
  answer.textContent="Correct Answer: "+q.choices[q.answer];
  box.appendChild(answer);

  const explanation=document.createElement("p");
  explanation.style.whiteSpace="pre-line";
  explanation.textContent="ব্যাখ্যা: "+q.explanation;
  box.appendChild(explanation);

  const rule=document.createElement("p");
  rule.textContent="মনে রাখুন: Passive Voice-এ সাধারণত Object + appropriate form of be + V3 + (by + Subject) ব্যবহৃত হয়।";
  box.appendChild(rule);
}

$("nextBtn").addEventListener("click",()=>{
  index++;
  ensureQuestion(index);
  render();
  window.scrollTo({top:0,behavior:"smooth"});
});

$("prevBtn").addEventListener("click",()=>{
  if(index>0) {
    index--;
    render();
    window.scrollTo({top:0,behavior:"smooth"});
  }
});

$("resetBtn").addEventListener("click",()=>{
  if(!confirm("Restart practice and reset your score?")) return;
  questions=[];
  records=[];
  index=0;
  score=0;
  answered=0;
  makeNewQuestion();
  render();
});

makeNewQuestion();
render();
</script>
</body>
</html>
