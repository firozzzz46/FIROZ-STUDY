/* ============================================================
   QUESTION STATE
============================================================ */

let currentQuestion = 1;
let score = 0;
let answered = 0;

let history = [];
let currentQuestionData = null;


/* ============================================================
   DOM
============================================================ */

const questionContent =
    document.getElementById("questionContent");

const questionElement =
    document.getElementById("question");

const questionBangla =
    document.getElementById("questionBangla");

const optionsElement =
    document.getElementById("options");

const explanationElement =
    document.getElementById("explanation");

const questionNumberElement =
    document.getElementById("questionNumber");

const questionBadge =
    document.getElementById("questionBadge");

    document.getElementById("score");

    document.getElementById("accuracy");

/* ============================================================
   RANDOM HELPERS
============================================================ */

function randomItem(array) {
    return array[
        Math.floor(Math.random() * array.length)
    ];
}


function shuffle(array) {

    const copy = [...array];

    for (
        let i = copy.length - 1;
        i > 0;
        i--
    ) {

        const j =
            Math.floor(Math.random() * (i + 1));

        [copy[i], copy[j]] =
            [copy[j], copy[i]];
    }

    return copy;
}


/* ============================================================
   GET RANDOM NAME
============================================================ */

function randomName() {
    return randomItem(names);
}


/* ============================================================
   GET WRONG INTERJECTIONS
============================================================ */

function getWrongWords(correctWord, count = 3) {

    return shuffle(
        interjections
            .filter(item =>
                item.word !== correctWord
            )
            .map(item => item.word)
    ).slice(0, count);
}


/* ============================================================
   QUESTION GENERATOR
============================================================ */

function generateQuestion() {

    const types = [
        generateMeaningQuestion,
        generateFillBlankQuestion,
        generateIdentificationQuestion,
        generateSituationQuestion,
        generateTypeQuestion,
        generateUsageQuestion,
        generatePunctuationQuestion
    ];

    return randomItem(types)();
}


/* ============================================================
   TYPE 1 — MEANING
============================================================ */

function generateMeaningQuestion() {

    const item = randomItem(interjections);

    const options = shuffle([
        item.type,
        ...shuffle(
            interjections
                .filter(x =>
                    x.type !== item.type
                )
                .map(x => x.type)
        ).slice(0, 3)
    ]);

    return {

        question:
            `What does "${item.word}" express?`,

        bangla:
            `("${item.word}" সাধারণত কী ধরনের অনুভূতি প্রকাশ করে?)`,

        options,

        answer:
            item.type,

        explanation:
            `<strong>${item.word}</strong> একটি Interjection। এটি <strong>${item.type}</strong> প্রকাশ করে।<br><br>
             তাই সঠিক উত্তর হলো <strong>${item.type}</strong>।`
    };
}


/* ============================================================
   TYPE 2 — FILL IN THE BLANK
============================================================ */

function generateFillBlankQuestion() {

    const item = randomItem(interjections);

    let sentence = "";

    if (item.type === "Joy") {

        sentence =
            `${randomName()} won the competition. ______!`;

    } else if (item.type === "Sorrow") {

        sentence =
            `${randomName()} heard the sad news. ______!`;

    } else if (item.type === "Pain") {

        sentence =
            `${randomName()} hurt a finger. ______!`;

    } else if (item.type === "Praise") {

        sentence =
            `${randomName()} performed very well. ______!`;

    } else if (item.type === "Silence") {

        sentence =
            `______! The baby is sleeping.`;

    } else if (item.type === "Wonder") {

        sentence =
            `${randomName()} saw a beautiful rainbow. ______!`;

    } else if (item.type === "Calling") {

        sentence =
            `______! ${randomName()}, please come here.`;

    } else {

        sentence =
            `${randomName()} suddenly felt something unusual. ______!`;
    }

    const options = shuffle([
        item.word,
        ...getWrongWords(item.word)
    ]);

    return {

        question:
            `Choose the correct interjection: ${sentence}`,

        bangla:
            `(বাক্যের শূন্যস্থানে সঠিক Interjection বসাও।)`,

        options,

        answer:
            item.word,

        explanation:
            `<strong>${item.word}</strong> এখানে ব্যবহার করা হয়েছে কারণ এটি <strong>${item.type}</strong> প্রকাশ করে।<br><br>
             বাক্যের পরিস্থিতির সঙ্গে এই অনুভূতিটিই সবচেয়ে উপযুক্ত।`
    };
}


/* ============================================================
   TYPE 3 — IDENTIFICATION
============================================================ */

function generateIdentificationQuestion() {

    const item = randomItem(interjections);
    const name = randomName();

    let sentence;

    if (item.type === "Joy") {

        sentence =
            `${item.word} ${name} has won the prize!`;

    } else if (item.type === "Sorrow") {

        sentence =
            `${item.word} ${name} lost the match.`;

    } else if (item.type === "Praise") {

        sentence =
            `${item.word} ${name}! You performed excellently.`;

    } else if (item.type === "Pain") {

        sentence =
            `${item.word} That was painful!`;

    } else if (item.type === "Silence") {

        sentence =
            `${item.word} Everyone, please be quiet.`;

    } else {

        sentence =
            `${item.word} ${name} saw something unexpected.`;
    }

    const options = shuffle([
        "Noun",
        "Verb",
        "Adjective",
        "Interjection"
    ]);

    return {

        question:
            `What part of speech is "${item.word}" in this sentence: "${sentence}"?`,

        bangla:
            `("${item.word}" এখানে কোন Parts of Speech?)`,

        options,

        answer:
            "Interjection",

        explanation:
            `<strong>${item.word}</strong> এখানে কোনো ব্যক্তি, বস্তু বা কাজের নাম প্রকাশ করছে না। এটি সরাসরি একটি অনুভূতি বা আবেগ প্রকাশ করছে।<br><br>
             তাই এটি একটি <strong>Interjection</strong>।`
    };
}


/* ============================================================
   TYPE 4 — SITUATION
============================================================ */

function generateSituationQuestion() {

    const situations = [

        {
            situation:
                `${randomName()} has just won a difficult competition.`,

            correct: "Hurrah!"
        },

        {
            situation:
                `${randomName()} received very sad news.`,

            correct: "Alas!"
        },

        {
            situation:
                `${randomName()} saw an amazing scene.`,

            correct: "Wow!"
        },

        {
            situation:
                `${randomName()} suddenly felt severe pain.`,

            correct: "Ouch!"
        },

        {
            situation:
                `${randomName()} did an excellent job.`,

            correct: "Bravo!"
        },

        {
            situation:
                `People are making too much noise and should remain silent.`,

            correct: "Hush!"
        },

        {
            situation:
                `${randomName()} wants to call someone.`,

            correct: "Hey!"
        }

    ];

    const situation =
        randomItem(situations);

    const options = shuffle([
        situation.correct,
        ...getWrongWords(
            situation.correct
        )
    ]);

    return {

        question:
            `Which interjection is most appropriate? ${situation.situation}`,

        bangla:
            `(উল্লিখিত পরিস্থিতির জন্য কোন Interjection সবচেয়ে উপযুক্ত?)`,

        options,

        answer:
            situation.correct,

        explanation:
            `এই পরিস্থিতিতে <strong>${situation.correct}</strong> ব্যবহার করা সবচেয়ে উপযুক্ত।<br><br>
             কারণ <strong>${situation.correct}</strong> এই ধরনের অনুভূতি বা পরিস্থিতি প্রকাশ করার জন্য ব্যবহৃত হয়।`
    };
}


/* ============================================================
   TYPE 5 — TYPE OF INTERJECTION
============================================================ */

function generateTypeQuestion() {

    const item = randomItem(interjections);

    const types = [
        "Joy",
        "Sorrow",
        "Wonder",
        "Pain",
        "Praise",
        "Silence",
        "Calling",
        "Disapproval",
        "Contempt",
        "Surprise"
    ];

    const options = shuffle([
        item.type,
        ...shuffle(
            types.filter(
                type => type !== item.type
            )
        ).slice(0, 3)
    ]);

    return {

        question:
            `What type of interjection is "${item.word}"?`,

        bangla:
            `("${item.word}" কোন ধরনের Interjection?)`,

        options,

        answer:
            item.type,

        explanation:
            `<strong>${item.word}</strong> হলো <strong>${item.type}</strong>-এর Interjection।<br><br>
             এই শব্দটি মূলত ${item.meaning}`
    };
}


/* ============================================================
   TYPE 6 — USAGE
============================================================ */

function generateUsageQuestion() {

    const item = randomItem(interjections);

    const correctSentence =
        createCorrectSentence(item);

    const wrongSentences = [
        `${randomName()} is a teacher ${item.word}.`,
        `${randomName()} reads ${item.word} a book.`,
        `${randomName()} ${item.word} went to school.`
    ];

    const options = shuffle([
        correctSentence,
        ...wrongSentences
    ]);

    return {

        question:
            `Which sentence uses "${item.word}" correctly?`,

        bangla:
            `("${item.word}" কোন বাক্যে সঠিকভাবে ব্যবহৃত হয়েছে?)`,

        options,

        answer:
            correctSentence,

        explanation:
            `<strong>${item.word}</strong> একটি Interjection। এটি বাক্যের শুরুতে বা প্রয়োজনীয় স্থানে অনুভূতি প্রকাশ করতে ব্যবহৃত হয়েছে।<br><br>
             তাই সঠিক বাক্যটি হলো: <strong>${correctSentence}</strong>`
    };
}


/* ============================================================
   CREATE CORRECT SENTENCE
============================================================ */

function createCorrectSentence(item) {

    const name = randomName();

    switch (item.word) {

        case "Hurrah!":
            return `Hurrah! ${name} has won the prize.`;

        case "Alas!":
            return `Alas! ${name} missed the opportunity.`;

        case "Wow!":
            return `Wow! ${name} has done something amazing.`;

        case "Oh!":
            return `Oh! I did not expect that.`;

        case "Ah!":
            return `Ah! Now I understand the lesson.`;

        case "Bravo!":
            return `Bravo! ${name} performed excellently.`;

        case "Hush!":
            return `Hush! The baby is sleeping.`;

        case "Fie!":
            return `Fie! Such behavior is shameful.`;

        case "Pooh!":
            return `Pooh! I do not care about that.`;

        case "Ouch!":
            return `Ouch! That really hurts.`;

        case "Hey!":
            return `Hey! ${name}, wait for me.`;

        case "Well!":
            return `Well! That is an interesting idea.`;

        case "Dear!":
            return `Dear! What has happened here?`;

        case "Congratulations!":
            return `Congratulations! ${name} has succeeded.`;

        default:
            return `${item.word} What a surprise!`;
    }
}


/* ============================================================
   TYPE 7 — PUNCTUATION
============================================================ */

function generatePunctuationQuestion() {

    const item = randomItem(interjections);

    const name = randomName();

    const correct =
        `${item.word} ${name}, that was wonderful!`;

    const options = shuffle([
        correct,
        `${item.word} ${name} that was wonderful.`,
        `${item.word}, ${name} that was wonderful`,
        `${item.word} ${name}; that was wonderful`
    ]);

    return {

        question:
            `Which sentence has the correct punctuation?`,

        bangla:
            `(কোন বাক্যে Interjection-এর সঠিক punctuation ব্যবহৃত হয়েছে?)`,

        options,

        answer:
            correct,

        explanation:
            `<strong>${item.word}</strong> একটি Interjection। Interjection-এর পরে সাধারণত আবেগকে স্পষ্টভাবে প্রকাশ করতে <strong>exclamation mark (!)</strong> ব্যবহার করা হয়।<br><br>
             তাই সঠিক বাক্যটি হলো: <strong>${correct}</strong>`
    };
}


/* ============================================================
   RENDER QUESTION
============================================================ */

function renderQuestion(data, animate = true) {

    currentQuestionData = data;

    if (animate) {

        questionContent.classList.remove("enter");

        questionContent.classList.add("exit");

        setTimeout(() => {

            updateQuestionHTML(data);

            questionContent.classList.remove("exit");

            void questionContent.offsetWidth;

            questionContent.classList.add("enter");

        }, 450);

    } else {

        updateQuestionHTML(data);
    }
}


/* ============================================================
   UPDATE HTML
============================================================ */

function updateQuestionHTML(data) {

    questionNumberElement.textContent =
        currentQuestion;

    questionBadge.textContent =
        `Question ${currentQuestion}`;

    questionElement.textContent =
        data.question;

    questionBangla.textContent =
        data.bangla;

    optionsElement.innerHTML = "";

    explanationElement.innerHTML = "";
    explanationElement.classList.remove("show");

    const letters = [
        "A",
        "B",
        "C",
        "D"
    ];

    data.options.forEach(
        (optionText, index) => {

            const button =
                document.createElement("button");

            button.className = "option";

            button.innerHTML = `
                <span class="option-letter">
                    ${letters[index]}
                </span>

                <span>
                    ${optionText}
                </span>
            `;

            button.addEventListener(
                "click",
                () => selectAnswer(
                    optionText,
                    button
                )
            );

            optionsElement.appendChild(button);
        }
    );

    updateProgress();
}


/* ============================================================
   SELECT ANSWER
============================================================ */

function selectAnswer(
    selected,
    clickedButton
) {

    const allOptions =
        document.querySelectorAll(".option");

    if (
        allOptions[0]?.classList.contains("disabled")
    ) {
        return;
    }

    allOptions.forEach(
        button =>
            button.classList.add("disabled")
    );

    answered++;

    const correct =
        currentQuestionData.answer;

    const isCorrect =
        selected === correct;

    if (isCorrect) {

        score++;

        clickedButton.classList.add(
            "correct"
        );

    } else {

        clickedButton.classList.add(
            "wrong"
        );

        allOptions.forEach(
            button => {

                const text =
                    button
                        .querySelector(
                            "span:last-child"
                        )
                        .textContent
                        .trim();

                if (text === correct) {

                    button.classList.add(
                        "correct"
                    );
                }
            }
        );
    }

    explanationElement.innerHTML =
        `
        <strong>
            ${isCorrect
                ? "✓ Correct Answer"
                : "✗ Incorrect Answer"
            }
        </strong>
        <br><br>

        ${currentQuestionData.explanation}
        `;

    explanationElement.classList.add(
        "show"
    );

    updateScore();
}


/* ============================================================
   NEXT
============================================================ */

nextButton.addEventListener(
    "click",
    () => {

        history.push({
            question: currentQuestionData,
            number: currentQuestion
        });

        currentQuestion++;

        const newQuestion =
            generateQuestion();

        renderQuestion(
            newQuestion,
            true
        );

        updateScore();
    }
);


/* ============================================================
   PREVIOUS
============================================================ */

previousButton.addEventListener(
    "click",
    () => {

        if (history.length === 0) {
            return;
        }

        const previous =
            history.pop();

        currentQuestion =
            previous.number;

        renderQuestion(
            previous.question,
            true
        );
    }
);


/* ============================================================
   UPDATE SCORE
============================================================ */

function updateScore() {

    scoreElement.textContent =
        score;

    questionNumberElement.textContent =
        currentQuestion;

    const accuracy =
        answered === 0
            ? 0
            : Math.round(
                (score / answered) * 100
            );

    accuracyElement.textContent =
        `${accuracy}%`;
}


/* ============================================================
   PROGRESS
============================================================ */

function updateProgress() {

    /*
       Infinite system:
       Progress represents the current practice position
       within a visual 20-question cycle.
    */

    const cycle =
        ((currentQuestion - 1) % 20) + 1;

    const percentage =
        (cycle / 20) * 100;

    progressFill.style.width =
        `${percentage}%`;
}


/* ============================================================
   RESTART
============================================================ */

restartButton.addEventListener(
    "click",
    () => {

        currentQuestion = 1;
        score = 0;
        answered = 0;
        history = [];

        const firstQuestion =
            generateQuestion();

        renderQuestion(
            firstQuestion,
            true
        );

        updateScore();
    }
);


/* ============================================================
   INITIAL LOAD
============================================================ */

const firstQuestion =
    generateQuestion();

renderQuestion(
    firstQuestion,
    false
);

updateScore();

</script>
