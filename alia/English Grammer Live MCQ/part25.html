
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PART 25 - WH-Questions & Tag Questions</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap');

:root {
  --blue: #4361ee;
  --purple: #7657e8;
  --green: #15803d;
  --red: #dc2626;
  --text: #202b40;
  --muted: #68758a;
  --glass: rgba(255,255,255,.86);
  --border: rgba(100,116,139,.15);
}

* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  color: var(--text);
  font-family: "Times New Roman", "Hind Siliguri", serif;
  font-size: 18px;
  background:
    radial-gradient(ellipse at 5% 5%, #e5edff 0%, transparent 38%),
    radial-gradient(ellipse at 95% 95%, #f0e9ff 0%, transparent 40%),
    linear-gradient(135deg, #fbfdff, #f5f7fc, #ffffff);
  background-attachment: fixed;
}

button { font: inherit; }

.app {
  width: min(920px, 94%);
  margin: auto;
  padding: 28px 0 42px;
}

.hero {
  text-align: center;
  padding: 24px 12px 28px;
  animation: heroIn 1s cubic-bezier(.22,1,.36,1) both;
}

.eyebrow {
  display: inline-block;
  padding: 7px 14px;
  border: 1px solid #dbe4ff;
  border-radius: 50px;
  background: rgba(255,255,255,.75);
  color: var(--blue);
  font: 700 13px "Times New Roman", serif;
  letter-spacing: 1.5px;
}

h1 {
  font-size: clamp(27px, 5vw, 42px);
  margin: 17px 0 10px;
  line-height: 1.2;
}

.subtitle {
  color: var(--muted);
  line-height: 1.6;
  margin: 0;
}

.glass {
  background: var(--glass);
  border: 1px solid rgba(255,255,255,.95);
  box-shadow: 0 15px 45px rgba(39,57,94,.09),
              0 2px 8px rgba(39,57,94,.04);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
  border-radius: 24px;
}

.stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 13px;
  margin-bottom: 20px;
}

.stat {
  padding: 17px 12px;
  text-align: center;
}

.stat-label {
  font-size: 14px;
  color: var(--muted);
  letter-spacing: .5px;
}

.stat-value {
  font-size: 25px;
  font-weight: bold;
  margin-top: 8px;
  overflow-wrap: anywhere;
}

.progress-track {
  height: 8px;
  background: #e8edf6;
  border-radius: 20px;
  overflow: hidden;
  margin-top: 17px;
}

.progress-fill {
  width: 0;
  height: 100%;
  background: linear-gradient(90deg, #4361ee, #9b6bfa);
  border-radius: inherit;
  transition: width .7s cubic-bezier(.22,1,.36,1);
}

.quiz-card {
  padding: clamp(19px, 4vw, 35px);
  overflow: hidden;
}

.question-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
  margin-bottom: 23px;
}

.pill {
  padding: 8px 13px;
  border-radius: 50px;
  font-size: 14px;
  font-weight: bold;
  background: #edf1ff;
  color: #4057ca;
}

.pill.secondary {
  background: #f1eaff;
  color: #7046c7;
}

.question-number {
  color: var(--muted);
  font-size: 15px;
}

.question-stage {
  opacity: 1;
  transform: translateY(0);
}

.question-stage.enter {
  animation: questionIn .85s cubic-bezier(.16,1,.3,1) both;
}

.question-stage.exit {
  opacity: 0;
  transform: translateY(10px);
  transition: opacity .16s ease, transform .16s ease;
}

.question {
  font-size: clamp(21px, 3.5vw, 27px);
  line-height: 1.55;
  font-weight: bold;
  overflow-wrap: anywhere;
}

.meaning {
  font-family: "Kalpurush", "Hind Siliguri", sans-serif;
  font-size: 19px;
  font-weight: 400;
  line-height: 1.8;
  color: #58677e;
  margin-top: 10px;
}

.options {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 13px;
  margin-top: 27px;
}

.option {
  min-height: 62px;
  display: flex;
  align-items: center;
  gap: 12px;
  text-align: left;
  padding: 14px 16px;
  color: var(--text);
  background: rgba(255,255,255,.8);
  border: 1px solid #e0e6f0;
  border-radius: 15px;
  cursor: pointer;
  transition: transform .25s ease, border-color .25s ease,
              background .25s ease, box-shadow .25s ease;
  overflow-wrap: anywhere;
  min-width: 0;
}

.option:hover:not(:disabled) {
  transform: translateY(-3px);
  border-color: #9aabff;
  box-shadow: 0 8px 22px rgba(67,97,238,.09);
}

.option:focus-visible, .btn:focus-visible {
  outline: 3px solid #a5b4fc;
  outline-offset: 3px;
}

.option:disabled { cursor: default; }

.letter {
  flex: 0 0 31px;
  height: 31px;
  display: grid;
  place-items: center;
  border-radius: 9px;
  background: #eef2f8;
  color: #53627a;
  font-size: 15px;
  font-weight: bold;
}

.option.correct {
  background: #eaf8ef;
  border-color: #58bb7a;
}

.option.correct .letter {
  background: #16803d;
  color: white;
}

.option.wrong {
  background: #fff0f0;
  border-color: #ed8585;
}

.option.wrong .letter {
  background: #dc2626;
  color: white;
}

.explanation {
  display: none;
  margin-top: 22px;
  padding: 19px;
  border-radius: 17px;
  line-height: 1.85;
  font-family: "Kalpurush", "Hind Siliguri", sans-serif;
  font-size: 18px;
  animation: explanationIn .5s ease both;
}

.explanation.show { display: block; }

.explanation.good {
  background: #effaf2;
  border: 1px solid #c8ecd2;
}

.explanation.bad {
  background: #fff5f2;
  border: 1px solid #f5d5ca;
}

.explanation strong {
  display: block;
  margin-bottom: 8px;
  font-size: 20px;
}

.english-answer {
  font-family: "Times New Roman", serif;
  font-weight: bold;
  color: #2459b9;
  overflow-wrap: anywhere;
}

.controls {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  margin-top: 26px;
  flex-wrap: wrap;
}

.btn {
  border: 0;
  padding: 13px 21px;
  border-radius: 13px;
  font-weight: bold;
  cursor: pointer;
  transition: transform .2s ease, opacity .2s ease,
              box-shadow .2s ease;
}

.btn:hover:not(:disabled) {
  transform: translateY(-2px);
  box-shadow: 0 7px 18px rgba(35,48,80,.1);
}

.btn:disabled {
  opacity: .4;
  cursor: not-allowed;
}

.btn-primary {
  color: white;
  background: linear-gradient(120deg, #4361ee, #7957e8);
}

.btn-light {
  color: #35445b;
  background: #edf1f7;
}

.mode-row {
  display: flex;
  justify-content: center;
  gap: 10px;
  flex-wrap: wrap;
  margin: 0 0 20px;
}

.mode-btn {
  border: 1px solid #dce3ef;
  background: rgba(255,255,255,.8);
  border-radius: 50px;
  padding: 10px 16px;
  cursor: pointer;
  color: #44516a;
  font-weight: bold;
  transition: .25s ease;
}

.mode-btn.active {
  color: white;
  background: linear-gradient(120deg, #4361ee, #7957e8);
  border-color: transparent;
}

.footer {
  text-align: center;
  color: #7c8799;
  font-size: 14px;
  margin-top: 25px;
  line-height: 1.7;
}

kbd {
  font: inherit;
  font-weight: bold;
}

@keyframes heroIn {
  from { opacity: 0; transform: translateY(-18px); }
  to { opacity: 1; transform: translateY(0); }
}

@keyframes questionIn {
  from { opacity: 0; transform: translateY(24px) scale(.99); filter: blur(2px); }
  to { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
}

@keyframes explanationIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

@media (max-width: 560px) {
  .app { width: 94%; padding-top: 12px; }
  .hero { padding: 20px 5px 23px; }
  .stats { gap: 8px; }
  .stat { padding: 13px 5px; border-radius: 17px; }
  .stat-label { font-size: 12px; }
  .stat-value { font-size: 22px; }
  .options { grid-template-columns: 1fr; gap: 10px; margin-top: 21px; }
  .option { min-height: 56px; padding: 12px; }
  .quiz-card { border-radius: 20px; }
  .controls { display: grid; grid-template-columns: 1fr 1fr; }
  .btn { padding: 13px 10px; }
  .meaning { font-size: 18px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .01ms !important;
    transition-duration: .01ms !important;
    scroll-behavior: auto !important;
  }
}
</style>
</head>

<body>
<main class="app">

  <header class="hero">
    <span class="eyebrow">ENGLISH GRAMMAR • PART 25</span>
    <h1>WH-Questions &amp; Tag Questions</h1>
    <p class="subtitle">Infinity MCQ Practice System</p>
  </header>

  <section class="stats" aria-label="Quiz statistics">
    <div class="stat glass">
      <div class="stat-label">SCORE</div>
      <div class="stat-value" id="score">0</div>
    </div>
    <div class="stat glass">
      <div class="stat-label">STREAK</div>
      <div class="stat-value" id="streak">0</div>
    </div>
    <div class="stat glass">
      <div class="stat-label">ACCURACY</div>
      <div class="stat-value" id="accuracy">0%</div>
    </div>
  </section>

  <div class="mode-row" aria-label="Question mode">
    <button class="mode-btn active" data-mode="all">All Questions</button>
    <button class="mode-btn" data-mode="wh">WH-Questions</button>
    <button class="mode-btn" data-mode="tag">Tag Questions</button>
  </div>

  <section class="glass quiz-card">
    <div class="question-top">
      <span class="pill" id="topicBadge">WH-QUESTIONS</span>
      <span class="question-number" id="questionNumber">Question 1</span>
    </div>

    <div class="progress-track" aria-label="Session progress">
      <div class="progress-fill" id="progressFill"></div>
    </div>

    <div class="question-stage enter" id="questionStage" aria-live="polite">
      <div class="question" id="question"></div>
      <div class="meaning" id="meaning"></div>
      <div class="options" id="options"></div>
      <div class="explanation" id="explanation" aria-live="polite"></div>
    </div>

    <div class="controls">
      <button class="btn btn-light" id="prevBtn" disabled>← Previous</button>
      <button class="btn btn-primary" id="nextBtn">Next →</button>
    </div>
  </section>

  <div class="footer">
    Practice • Learn • Improve<br>
    Questions are generated continuously from grammar patterns.
  </div>
</main>

<script>
"use strict";

/* ==========================================================
   PART 25: WH-QUESTIONS & TAG QUESTIONS
   Self-contained question generator. No page reload required.
   ========================================================== */

const $ = id => document.getElementById(id);

const names = [
  "Firoz", "Fatiha", "Fatema", "Jui", "Ema", "Rupa",
  "Moksed", "Ferjousi", "Jannati", "Mini", "Miraz",
  "Mujahid", "Milon", "Hannan", "Joba", "Tanzila",
  "Rina", "Tania", "Taslima"
];

const nameMeanings = {
  Firoz:"ফিরোজ", Fatiha:"ফাতিহা", Fatema:"ফাতেমা",
  Jui:"জুঁই", Ema:"ইমা", Rupa:"রূপা", Moksed:"মকসেদ",
  Ferjousi:"ফেরদৌসী", Jannati:"জান্নাতি", Mini:"মিনি",
  Miraz:"মিরাজ", Mujahid:"মুজাহিদ", Milon:"মিলন",
  Hannan:"হান্নান", Joba:"জবা", Tanzila:"তানজিলা",
  Rina:"রিনা", Tania:"তানিয়া", Taslima:"তাসলিমা"
};

const whWords = [
  {word:"Who", meaning:"কে", use:"ব্যক্তি কাজটি করলে Who ব্যবহার হয়।"},
  {word:"Whom", meaning:"কাকে", use:"ব্যক্তি কাজের লক্ষ্য বা কর্ম হলে Whom ব্যবহার হতে পারে।"},
  {word:"Whose", meaning:"কার", use:"মালিকানা জানতে Whose ব্যবহার হয়।"},
  {word:"What", meaning:"কী", use:"কোনো বস্তু, কাজ বা বিষয় জানতে What ব্যবহার হয়।"},
  {word:"Which", meaning:"কোনটি", use:"সীমিত কয়েকটি বিকল্প থেকে জানতে Which ব্যবহার হয়।"},
  {word:"When", meaning:"কখন", use:"সময় জানতে When ব্যবহার হয়।"},
  {word:"Where", meaning:"কোথায়", use:"স্থান জানতে Where ব্যবহার হয়।"},
  {word:"Why", meaning:"কেন", use:"কারণ জানতে Why ব্যবহার হয়।"},
  {word:"How", meaning:"কীভাবে", use:"পদ্ধতি বা অবস্থা জানতে How ব্যবহার হয়।"},
  {word:"How often", meaning:"কত ঘন ঘন", use:"কোনো কাজ কতবার বা কত ঘন ঘন হয় তা জানতে How often ব্যবহার হয়।"},
  {word:"How many", meaning:"কতগুলো", use:"গণনা করা যায় এমন বহুবচন বস্তু বা ব্যক্তির সংখ্যা জানতে How many ব্যবহার হয়।"},
  {word:"How much", meaning:"কতটুকু / কত দাম", use:"অগণনীয় পরিমাণ বা দাম জানতে How much ব্যবহার হয়।"},
  {word:"How long", meaning:"কতক্ষণ / কত দীর্ঘ", use:"সময়কাল বা দৈর্ঘ্য জানতে How long ব্যবহার হয়।"}
];

const actions = [
  {v:"reads a book", obj:"a book", objBangla:"একটি বই", verb:"read", form:"reads", place:"at home", placeBangla:"বাড়িতে", time:"every evening", timeBangla:"প্রতি সন্ধ্যায়", reason:"to learn English", reasonBangla:"ইংরেজি শেখার জন্য"},
  {v:"writes a letter", obj:"a letter", objBangla:"একটি চিঠি", verb:"write", form:"writes", place:"at school", placeBangla:"স্কুলে", time:"every morning", timeBangla:"প্রতিদিন সকালে", reason:"to help a friend", reasonBangla:"একজন বন্ধুকে সাহায্য করার জন্য"},
  {v:"plays football", obj:"football", objBangla:"ফুটবল", verb:"play", form:"plays", place:"in the field", placeBangla:"মাঠে", time:"every afternoon", timeBangla:"প্রতি বিকেলে", reason:"to stay active", reasonBangla:"সক্রিয় থাকার জন্য"},
  {v:"cooks rice", obj:"rice", objBangla:"ভাত", verb:"cook", form:"cooks", place:"in the kitchen", placeBangla:"রান্নাঘরে", time:"at noon", timeBangla:"দুপুরে", reason:"for the family", reasonBangla:"পরিবারের জন্য"},
  {v:"studies English", obj:"English", objBangla:"ইংরেজি", verb:"study", form:"studies", place:"in the library", placeBangla:"লাইব্রেরিতে", time:"every day", timeBangla:"প্রতিদিন", reason:"to improve grammar", reasonBangla:"ব্যাকরণ উন্নত করার জন্য"},
  {v:"visits the market", obj:"the market", objBangla:"বাজার", verb:"visit", form:"visits", place:"near the village", placeBangla:"গ্রামের কাছে", time:"on Fridays", timeBangla:"শুক্রবারে", reason:"to buy food", reasonBangla:"খাবার কেনার জন্য"}
];

const whPatterns = [
  {
    make() {
      const n = pick(names), a = pick(actions);
      return {
        q:`Where does ${n} ${a.verb === "study" ? "study" : a.verb === "play" ? "play" : a.verb === "read" ? "read" : a.verb === "write" ? "write" : a.verb === "cook" ? "cook" : "visit"}?`,
        meaning:`${nameMeanings[n]} কোথায় ${a.verb === "study" ? "পড়াশোনা করে" : a.verb === "play" ? "খেলে" : a.verb === "read" ? "পড়ে" : a.verb === "write" ? "লেখে" : a.verb === "cook" ? "রান্না করে" : "যায়"}?`,
        correct:a.place,
        wrong:unique([a.time,a.reason,a.obj,"yesterday"]),
        explanation:`স্থান জানতে Where ব্যবহার হয়। প্রশ্নে does আছে, তাই মূল verb-এর base form ব্যবহৃত হয়েছে। এখানে সঠিক উত্তর <b>${a.place}</b>, কারণ এটি স্থান নির্দেশ করে।`
      };
    }
  },
  {
    make() {
      const n = pick(names), a = pick(actions);
      return {
        q:`When does ${n} ${a.verb}?`,
        meaning:`${nameMeanings[n]} কখন ${a.verb === "study" ? "পড়াশোনা করে" : a.verb === "play" ? "খেলে" : a.verb === "read" ? "পড়ে" : a.verb === "write" ? "লেখে" : a.verb === "cook" ? "রান্না করে" : "বাজারে যায়"}?`,
        correct:a.time,
        wrong:unique([a.place,a.reason,a.obj,"very carefully"]),
        explanation:`সময় জানতে When ব্যবহার হয়। <b>${a.time}</b> একটি সময় নির্দেশক উত্তর। Present Simple প্রশ্নে does-এর পরে verb-এর মূল রূপ বসে।`
      };
    }
  },
  {
    make() {
      const n = pick(names), a = pick(actions);
      return {
        q:`Why does ${n} ${a.verb}?`,
        meaning:`${nameMeanings[n]} কেন ${a.verb === "study" ? "পড়াশোনা করে" : a.verb === "play" ? "খেলে" : a.verb === "read" ? "পড়ে" : a.verb === "write" ? "লেখে" : a.verb === "cook" ? "রান্না করে" : "বাজারে যায়"}?`,
        correct:a.reason,
        wrong:unique([a.time,a.place,a.obj,"twice a week"]),
        explanation:`কারণ জানতে Why ব্যবহার হয়। <b>${a.reason}</b> কারণ বোঝায়। মনে রাখবে: Why = কেন, When = কখন, Where = কোথায়।`
      };
    }
  },
  {
    make() {
      const n = pick(names), a = pick(actions);
      return {
        q:`What does ${n} ${a.verb}?`,
        meaning:`${nameMeanings[n]} কী ${a.verb === "study" ? "পড়াশোনা করে" : a.verb === "play" ? "খেলে" : a.verb === "read" ? "পড়ে" : a.verb === "write" ? "লেখে" : a.verb === "cook" ? "রান্না করে" : "করে"}?`,
        correct:a.obj,
        wrong:unique([a.time,a.place,a.reason,"at night"]),
        explanation:`কাজ বা বস্তু সম্পর্কে জানতে What ব্যবহার হয়। <b>${a.obj}</b> এখানে কাজের বিষয় বা বস্তু। Does-এর পরে verb-এর base form ব্যবহৃত হয়েছে।`
      };
    }
  },
  {
    make() {
      const n = pick(names), a = pick(actions);
      return {
        q:`Who ${a.form} ${a.obj}?`,
        meaning:`কে ${a.objBangla} ${a.verb === "study" ? "পড়ে" : a.verb === "play" ? "খেলে" : a.verb === "read" ? "পড়ে" : a.verb === "write" ? "লেখে" : a.verb === "cook" ? "রান্না করে" : "বাজারে যায়"}?`,

let score = 0;
let streak = 0;
let attempted = 0;
let correctCount = 0;
let mode = "all";
let current = null;
let history = [];
let historyIndex = -1;
let busy = false;
let lastKeys = new Set();

function pick(arr) {
  return arr[Math.floor(Math.random() * arr.length)];
}

function unique(arr) {
  return [...new Set(arr)];
}

function shuffle(arr) {
  const copy = [...arr];
  for (let i = copy.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [copy[i], copy[j]] = [copy[j], copy[i]];
  }
  return copy;
}

function escapeHTML(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    "&":"&amp;", "<":"&lt;", ">":"&gt;",
    '"':"&quot;", "'":"&#39;"
  })[c]);
}

function makeWH() {
  const pattern = pick(whPatterns);
  const item = pattern.make();
  return buildQuestion("wh", item);
}

function makeTag() {
  const t = pick(tagPatterns);
  const right = t.tag;
  const options = makeTagOptions(right);

  return buildQuestion("tag", {
    q:`${t.s}, ______`,
    meaning:`${t.bn} — বাক্যটির শেষে সঠিক question tag বসাও।`,
    correct:right,
    wrong:options.filter(x => x !== right).slice(0,3),
    explanation:`<b>নিয়ম:</b> ${t.why}<br><br><b>মনে রাখবে:</b> সাধারণত affirmative statement-এর পরে negative tag এবং negative statement-এর পরে affirmative tag বসে। Subject-এর উপযুক্ত pronoun ব্যবহার করতে হয়।`
  });
}

function makeTagOptions(right) {
  const common = [
    "is he?", "isn't he?", "does he?", "doesn't he?",
    "did he?", "didn't he?", "is she?", "isn't she?",
    "does she?", "doesn't she?", "did she?", "didn't she?",
    "are they?", "aren't they?", "were they?", "weren't they?",
    "can he?", "can't he?", "will he?", "won't he?",
    "has she?", "hasn't she?", "have you?", "haven't you?",
    "was she?", "wasn't she?", "shall we?", "will you?",
    "aren't I?", "isn't it?", "isn't there?", "hadn't she?",
    "shouldn't we?", "mustn't he?", "can you?", "did they?"
  ];
  return shuffle(unique([right, ...shuffle(common.filter(x => x !== right)).slice(0,3)]));
}

function buildQuestion(type, item) {
  let options = shuffle(unique([item.correct, ...item.wrong]));
  while (options.length < 4) {
    const extra = type === "tag"
      ? pick(["isn't he?", "does she?", "didn't they?", "aren't you?"])
      : pick(["in the morning", "at school", "because it is useful", "a new book"]);
    if (!options.includes(extra) && extra !== item.correct) options.push(extra);
  }
  options = shuffle(options.slice(0,4));

  const key = type + "|" + item.q + "|" + item.correct;
  return {
    type,
    q:item.q,
    meaning:item.meaning,
    correct:item.correct,
    options,
    explanation:item.explanation,
    key,
    chosen:null,
    answered:false
  };
}

function generateQuestion() {
  let q, tries = 0;
  do {
    q = (mode === "wh") ? makeWH()
      : (mode === "tag") ? makeTag()
      : (Math.random() < .5 ? makeWH() : makeTag());
    tries++;
  } while (lastKeys.has(q.key) && tries < 15);

  lastKeys.add(q.key);
  if (lastKeys.size > 30) lastKeys.delete(lastKeys.values().next().value);
  return q;
}

function renderQuestion(q, animate = true) {
  current = q;
  busy = false;

  $("topicBadge").textContent =
    q.type === "wh" ? "WH-QUESTIONS" : "TAG QUESTIONS";

  $("questionNumber").textContent =
    `Question ${Math.max(1, historyIndex + 1)}`;

  $("question").innerHTML = escapeHTML(q.q);
  $("meaning").textContent = `(বাংলা অর্থ: ${q.meaning})`;

  const optionsBox = $("options");
  optionsBox.innerHTML = "";

  q.options.forEach((opt, i) => {
    const button = document.createElement("button");
    button.className = "option";
    button.type = "button";
    button.innerHTML =
      `<span class="letter">${"ABCD"[i]}</span>` +
      `<span>${escapeHTML(opt)}</span>`;
    button.disabled = q.answered;
    button.addEventListener("click", () => chooseAnswer(opt, button));
    optionsBox.appendChild(button);
  });

  const exp = $("explanation");
  exp.className = "explanation";
  exp.innerHTML = "";

  if (q.answered) {
    showAnsweredState(q);
  }

  $("prevBtn").disabled = historyIndex <= 0 || busy;
  $("nextBtn").textContent = "Next →";
  updateStats();

  const stage = $("questionStage");
  stage.classList.remove("enter", "exit");
  if (animate) {
    void stage.offsetWidth;
    stage.classList.add("enter");
  }
}

function showAnsweredState(q) {
  const buttons = [...$("options").querySelectorAll(".option")];
  buttons.forEach(btn => {
    const text = btn.querySelector("span:last-child").textContent;
    btn.disabled = true;
    if (text === q.correct) btn.classList.add("correct");
    if (text === q.chosen && q.chosen !== q.correct) {
      btn.classList.add("wrong");
    }
  });

  const exp = $("explanation");
  exp.className = "explanation show " +
    (q.chosen === q.correct ? "good" : "bad");

  exp.innerHTML =
    `<strong>${q.chosen === q.correct ? "Correct Answer ✓" : "Incorrect Answer ✗"}</strong>` +
    `<div>সঠিক উত্তর: <span class="english-answer">${escapeHTML(q.correct)}</span></div>` +
    `<div style="margin-top:8px">${q.explanation}</div>`;
}

function chooseAnswer(answer) {
  if (!current || current.answered) return;

  current.answered = true;
  current.chosen = answer;
  attempted++;

  if (answer === current.correct) {
    score += 10;
    streak++;
    correctCount++;
  } else {
    streak = 0;
  }

  showAnsweredState(current);
  updateStats();
}

function updateStats() {
  $("score").textContent = score;
  $("streak").textContent = streak;
  $("accuracy").textContent =
    attempted ? Math.round(correctCount / attempted * 100) + "%" : "0%";

  // Session indicator: advances as the user explores new questions.
  $("progressFill").style.width =
    (historyIndex < 0 ? 0 : ((historyIndex % 20) + 1) * 5) + "%";
}

function nextQuestion() {
  if (busy) return;

  if (historyIndex < history.length - 1) {
    historyIndex++;
    renderQuestion(history[historyIndex]);
    return;
  }

  const stage = $("questionStage");
  busy = true;
  stage.classList.add("exit");

  // Only the question panel transitions; the page never reloads.
  window.setTimeout(() => {
    const q = generateQuestion();
    history.push(q);
    historyIndex = history.length - 1;
    renderQuestion(q);
  }, 180);
}

function previousQuestion() {
  if (busy || historyIndex <= 0) return;
  historyIndex--;
  renderQuestion(history[historyIndex]);
}

$("nextBtn").addEventListener("click", nextQuestion);
$("prevBtn").addEventListener("click", previousQuestion);

document.querySelectorAll(".mode-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    const newMode = btn.dataset.mode;
    if (newMode === mode) return;

    mode = newMode;
    document.querySelectorAll(".mode-btn").forEach(b =>
      b.classList.toggle("active", b === btn)
    );

    history = [];
    historyIndex = -1;
    lastKeys.clear();
    nextQuestion();
  });
});

document.addEventListener("keydown", e => {
  if (e.altKey || e.ctrlKey || e.metaKey) return;
  if (e.key === "ArrowRight") nextQuestion();
  if (e.key === "ArrowLeft") previousQuestion();

  if (/^[1-4]$/.test(e.key) && current && !current.answered) {
    const btn = $("options").querySelectorAll(".option")[Number(e.key)-1];
    if (btn) btn.click();
  }
});

// Start the practice system.
history.push(generateQuestion());
historyIndex = 0;
renderQuestion(history[0], false);
</script>
</body>
</html>
