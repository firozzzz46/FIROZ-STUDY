/* =========================================================

/* ---------------------------------------------------------
   RANDOM HELPERS

function randomItem(array){
    return array[Math.floor(Math.random() * array.length)];
}

function shuffle(array){
    return [...array].sort(() => Math.random() - 0.5);
}


/* ---------------------------------------------------------
   QUESTION GENERATORS
--------------------------------------------------------- */


/* 1. Present Simple */
function presentSimple(){

    const v = randomItem(verbs);
    const name = randomItem(names);

    const positive = Math.random() > .5;

    let sentence;
    let answer;
    let explanation;

    if(positive){

        sentence = `${name} ___ English every day.`;
        answer = v.s;

        explanation =
        `এখানে “every day” আছে, যা নিয়মিত কাজ বোঝায়। ` +
        `তাই এটি Simple Present Tense-এর বাক্য। ` +
        `Subject “${name}” একবচন হওয়ায় verb-এর সঙ্গে s/es যুক্ত হবে। ` +
        `সুতরাং সঠিক উত্তর হলো “${v.s}”।`;

    }else{

        sentence = `${name} does not ___ English every day.`;
        answer = v.base;

        explanation =
        `এখানে “does not” ব্যবহৃত হয়েছে। ` +
        `Simple Present-এর negative বাক্যে “does not” থাকলে মূল verb-এর সঙ্গে s/es বসে না। ` +
        `তাই এখানে base form “${v.base}” হবে।`;
    }

    return makeQuestion(
        sentence,
        "নামটি নিয়মিতভাবে কাজটি করে—সঠিক verb form নির্বাচন করুন।",
        answer,
        explanation,
        "Simple Present: singular subject + V1+s/es; কিন্তু does/do-এর পরে V1।"
    );
}


/* 2. Past Simple */
function pastSimple(){

    const v = randomItem(verbs);
    const name = randomItem(names);

    return makeQuestion(
        `${name} ___ the book yesterday.`,
        "গতকাল কাজটি সম্পন্ন হয়েছে—সঠিক verb form নির্বাচন করুন।",
        v.past,
        `“yesterday” অতীত সময় নির্দেশ করে। তাই এখানে Simple Past Tense ব্যবহার হবে। ` +
        `Simple Past-এর affirmative বাক্যে verb-এর past form ব্যবহৃত হয়। ` +
        `তাই “${v.past}” সঠিক।`,
        "Simple Past: Subject + V2 + Object."
    );
}


/* 3. After modal */
function modal(){

    const v = randomItem(verbs);

    return makeQuestion(

        `তাই এখানে “${v.base}” হবে, “${v.s}” বা অন্য কোনো form নয়।`,
        "Modal + V1: can go, can read, can write."
    );
}


/* 4. After to */
function infinitive(){

    const v = randomItem(verbs);
    const name = randomItem(names);

    return makeQuestion(
        `${name} wants to ___.`,
        "“to”-এর পরে সঠিক verb form নির্বাচন করুন।",

        `তাই “to ${v.base}” সঠিক।`,

    );
}


/* 5. Preposition + ing */
function prepositionIng(){

}

        `Past Continuous structure হলো was/were + V-ing। ` +
        `তাই এখানে “${v.ing}” সঠিক।`,
        "Past Continuous: was/were + V-ing."
    );
}


/* 7. Have/has + PP */
function perfect(){

/* 9. After let */

function makeQuestion(
    sentence,
    bangla,
    answer,
    explanation,
    rule
){

    const wrongPool = [];

    const v = verbs.find(x =>
        Object.values(x).includes(answer)
    );

    if(v){

        wrongPool.push(
            v.base,
            v.past,
            v.pp,
            v.ing,
            v.s
        );

    }

    wrongPool.push(
        "going",
        "went",
        "gone",
        "goes",
        "go"
    );

    let options = [...new Set(
        wrongPool.filter(x => x !== answer)
    )];

    options = shuffle(options).slice(0,3);

    options.push(answer);

    options = shuffle(options);

    return {
        sentence,
        bangla,
        answer,
        options,
        explanation,
        rule
    };
}


/* ---------------------------------------------------------
   GENERATOR ENGINE
--------------------------------------------------------- */

const generators = [

    presentSimple,
    pastSimple,
    modal,
    infinitive,
    prepositionIng,
    whileIng,
    perfect,
    pastPerfect,
    causativeLet,
    causativeMake,
    didRule,
    usedTo,
    avoidIng,
    enjoyIng,
    lookForward

];


function generateQuestion(){

    const generator = randomItem(generators);

    return generator();
}


/* ---------------------------------------------------------
   APP STATE
--------------------------------------------------------- */

let currentQuestion = null;
let questionNumber = 1;

let score = 0;
let attempted = 0;

let history = [];
let historyIndex = -1;


/* ---------------------------------------------------------
   DOM
--------------------------------------------------------- */

const questionArea =
    document.getElementById("questionArea");

const scoreEl =
    document.getElementById("score");

const progressText =
    document.getElementById("progressText");

const accuracyText =
    document.getElementById("accuracyText");

const progressBar =
    document.getElementById("progressBar");

const prevBtn =
    document.getElementById("prevBtn");

const nextBtn =
    document.getElementById("nextBtn");

const newBtn =
    document.getElementById("newBtn");


/* ---------------------------------------------------------
   RENDER QUESTION
--------------------------------------------------------- */

function renderQuestion(question){

    currentQuestion = question;

    const letters = ["A","B","C","D"];

    questionArea.innerHTML = "";

    const card = document.createElement("div");

    card.className = "question-card";

    card.innerHTML = `

        <div class="question-number">
            Question ${questionNumber}
        </div>

        <div class="question">
            ${question.sentence}
        </div>

        <div class="question-bn">
            (${question.bangla})
        </div>

        <div class="options">

            ${question.options.map((option,index)=>`

                <button
                    class="option"
                    data-value="${option}"
                >
                    ${letters[index]}. ${option}
                </button>

            `).join("")}

        </div>

    `;

    questionArea.appendChild(card);

    document
        .querySelectorAll(".option")
        .forEach(button=>{

            button.addEventListener(
                "click",
                ()=>selectAnswer(button)
            );

        });

    updateUI();

}


/* ---------------------------------------------------------
   ANSWER
--------------------------------------------------------- */

function selectAnswer(button){

    if(
        questionArea.querySelector(".explanation")
    ){
        return;
    }

    const selected =
        button.dataset.value;

    const allOptions =
        document.querySelectorAll(".option");

    allOptions.forEach(btn=>{
        btn.disabled = true;

        if(
            btn.dataset.value ===
            currentQuestion.answer
        ){
            btn.classList.add("correct");
        }
    });


    if(selected === currentQuestion.answer){

        score++;

        button.classList.add("correct");

    }else{

        button.classList.add("wrong");

    }


    attempted++;


    const explanation =
        document.createElement("div");

    explanation.className =
        "explanation";

    explanation.innerHTML = `

        <div class="explanation-title">
            Explanation
        </div>

        <div class="explanation-text">
            ${currentQuestion.explanation}
        </div>

        <div class="rule">
            <strong>Rule:</strong>
            ${currentQuestion.rule}
        </div>

    `;

    questionArea
        .querySelector(".question-card")
        .appendChild(explanation);


    scoreEl.textContent = score;

    updateAccuracy();

    nextBtn.disabled = false;

}


/* ---------------------------------------------------------
   NEXT
--------------------------------------------------------- */

function nextQuestion(){

    if(
        !questionArea.querySelector(".explanation")
    ){
        return;
    }

    const newQuestion =
        generateQuestion();

    history =
        history.slice(0,historyIndex+1);

    history.push({
        question:newQuestion,
        number:questionNumber + 1
    });

    historyIndex++;

    questionNumber++;

    renderQuestion(newQuestion);
}


/* ---------------------------------------------------------
   NEW QUESTION
--------------------------------------------------------- */

function createNewQuestion(){

    const newQuestion =
        generateQuestion();

    history =
        history.slice(0,historyIndex+1);

    history.push({
        question:newQuestion,
        number:questionNumber
    });

    historyIndex++;

    renderQuestion(newQuestion);

}


/* ---------------------------------------------------------
   PREVIOUS
--------------------------------------------------------- */

function previousQuestion(){

    if(historyIndex <= 0){
        return;
    }

    historyIndex--;

    const item =
        history[historyIndex];

    questionNumber =
        item.number;

    renderQuestion(item.question);

}


/* ---------------------------------------------------------
   UI
--------------------------------------------------------- */

function updateUI(){

    progressText.textContent =
        `Question ${questionNumber}`;

    progressBar.style.width =
        `${Math.min(100,questionNumber % 100)}%`;

    prevBtn.disabled =
        historyIndex <= 0;

    nextBtn.disabled = true;

    updateAccuracy();
}


function updateAccuracy(){

    const accuracy =
        attempted === 0
        ? 0
        : Math.round(
            (score / attempted) * 100
        );

    accuracyText.textContent =
        `Accuracy: ${accuracy}%`;
}


/* ---------------------------------------------------------
   EVENTS
--------------------------------------------------------- */

nextBtn.addEventListener(
    "click",
    nextQuestion
);

prevBtn.addEventListener(
    "click",
    previousQuestion
);

newBtn.addEventListener(
    "click",
    createNewQuestion
);


/* ---------------------------------------------------------
   START
--------------------------------------------------------- */

const firstQuestion =
    generateQuestion();

history.push({
    question:firstQuestion,
    number:1
});

historyIndex = 0;

renderQuestion(firstQuestion);

</script>

</html>
