        radial-gradient(circle at 10% 10%, rgba(220,235,255,.65), transparent 30%),
        radial-gradient(circle at 90% 20%, rgba(245,225,255,.55), transparent 30%),

}

}

.header {
    text-align: center;
    padding: 28px 18px;

    backdrop-filter: blur(18px);

    border: 1px solid rgba(255,255,255,.8);
    border-radius: 26px;
    box-shadow: var(--shadow);

    animation: headerIn 1.2s cubic-bezier(.16,1,.3,1);
}

.header h1 {
    font-size: clamp(28px, 5vw, 44px);
    line-height: 1.15;
    margin-bottom: 10px;
}

.header p {
    font-size: 20px;
    color: var(--muted);
}

/* ---------- TOP BAR ---------- */

.topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
    flex-wrap: wrap;

    margin-bottom: 18px;
}

.badge,
.score-box,
.progress-box {
    padding: 11px 17px;
    border-radius: 14px;

    background: rgba(255,255,255,.72);
    backdrop-filter: blur(12px);

    border: 1px solid var(--border);
    box-shadow: 0 8px 25px rgba(0,0,0,.06);

    font-size: 18px;
}

/* ---------- PROGRESS ---------- */

.progress-wrapper {
    width: 100%;
    height: 9px;
    overflow: hidden;
    border-radius: 20px;

    background: rgba(0,0,0,.07);
    margin-bottom: 22px;
}

.progress-bar {
    height: 100%;
    width: 0%;
    border-radius: inherit;

    background: linear-gradient(90deg, #5b8def, #8b5cf6);

}

/* ---------- QUESTION CARD ---------- */

.question-card {
    background: var(--card);

    -webkit-backdrop-filter: blur(22px);

    border: 1px solid rgba(255,255,255,.9);

    box-shadow: var(--shadow);

    padding: clamp(22px, 4vw, 38px);

    min-height: 500px;

    transform: translateY(0);
}

/*
   Animation classes
*/

.question-card.enter-next {
    animation: nextIn 900ms cubic-bezier(.16,1,.3,1);
}

.question-card.enter-prev {
    animation: prevIn 900ms cubic-bezier(.16,1,.3,1);
}

@keyframes nextIn {
    0% {
        opacity: 0;
        transform: translateX(80px) scale(.985);
        filter: blur(5px);
    }
    55% {
        opacity: .8;
        filter: blur(1px);
    }
    100% {
        opacity: 1;
        transform: translateX(0) scale(1);
        filter: blur(0);
    }
}

@keyframes prevIn {
    0% {
        opacity: 0;
        transform: translateX(-80px) scale(.985);
        filter: blur(5px);
    }
    55% {
        opacity: .8;
        filter: blur(1px);
    }
    100% {
        opacity: 1;
        transform: translateX(0) scale(1);
        filter: blur(0);
    }
}

@keyframes headerIn {
    from {
        opacity: 0;
        transform: translateY(-30px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

/* ---------- QUESTION ---------- */

.question-number {

    border: 1px solid rgba(0,0,0,.09);

    font-size: 20px;

    cursor: pointer;

}

.option:hover:not(:disabled) {
    transform: translateX(7px);

}

}

}

.option.wrong {

.option .letter {

    height: 32px;

    border-radius: 50%;

}

.explanation.show {

}

.explanation-title {

}

}

@keyframes explanationIn {

/* ---------- CONTROLS ---------- */

.nav-btn {

}

.nav-btn:hover:not(:disabled) {

/* ---------- RESULT ---------- */

.result {
    display: none;

    margin-top: 22px;
    padding: 30px;

    border-radius: 25px;

    background: rgba(255,255,255,.75);

}

.result.show {

}

.result h2 {

}

}

<script>

/* =========================================================
   PART 19
   PRONOUN REFERENCE & AGREEMENT
   INFINITY QUESTION GENERATOR
   ========================================================= */

/*
   Allowed example names only.
*/

const names = [
    "Firoz",
    "Fatiha",
    "Fatema",
    "Jui",
    "Ema",
    "Rupa",
    "Moksed",
    "Ferjousi",
    "Jannati",
    "Mini",
    "Miraz",
    "Mujahid",
    "Milon",
    "Hannan",
    "Joba",
    "Tanzila",
    "Rina",
    "Tania",
    "Taslima"
];


/* =========================================================
   QUESTION BANK
   =========================================================
   These are grammar patterns.
   The generator randomly combines subjects,
   pronouns and sentence structures.
   ========================================================= */

const patterns = [

    /* ---------- SUBJECT-PRONOUN AGREEMENT ---------- */

    {
        type: "subject",
        make() {

            const n = random(names);

            return {
                q: `${n} is one of the students who always do their homework on time.`,
                bn: `সঠিক বাক্যটি বেছে নিন। এখানে "who"-এর পরের verb এবং pronoun-এর agreement লক্ষ্য করুন।`,
                options: [
                    `${n} is one of the students who always do their homework on time.`,
                    `${n} is one of the students who always does their homework on time.`,
                    `${n} is one of the students who always doing their homework on time.`,
                    `${n} is one of the students who always has do their homework on time.`
                ],
                answer: 0,
                explanation:
                    `"one of the students who" দ্বারা একাধিক students বোঝানো হয়েছে। তাই relative pronoun "who"-এর antecedent এখানে "students"; এজন্য plural verb "do" হবে। "their"–ও plural "students"-এর সঙ্গে agreement করে।`
            };

        }
    },

    {
        type: "subject",
        make() {

            const n = random(names);

            return {
                q: `Every student in the class must bring his or her own book. Which pronoun agrees correctly with "Every student"?`,
                bn: `"Every student"-এর সঙ্গে কোন pronoun-এর agreement সঠিক?`,
                options: [
                    "his or her",
                    "their",
                    "our",
                    "your"
                ],
                answer: 0,
                explanation:
                    `"Every student" grammaticalভাবে singular। তাই traditional formal grammar-এ তার সঙ্গে singular pronoun "his or her" ব্যবহার করা হয়। "their" আধুনিক English-এ singular they হিসেবে ব্যবহৃত হতে পারে, তবে এই পরীক্ষামুখী rule-এ "his or her" প্রত্যাশিত।`
            };

        }
    },

    /* ---------- CLEAR REFERENCE ---------- */

    {
        type: "reference",
        make() {

            const n = random(names);

            return {
                q: `When ${n} spoke to ${randomOther(n)}, he was very polite. Who does "he" refer to?`,
                bn: `"he" কোন ব্যক্তিকে বোঝাচ্ছে—reference পরিষ্কার কি না তা লক্ষ্য করুন।`,
                options: [
                    `${n}`,
                    "It is unclear from the sentence.",
                    "Both people",
                    "Nobody"
                ],
                answer: 1,
                explanation:
                    `এখানে "he" পুরুষবাচক pronoun হলেও বাক্যে দুইজন ব্যক্তির মধ্যে কে পুরুষ এবং কে pronoun-এর antecedent—তা পরিষ্কারভাবে নির্ধারিত নয়। তাই reference ambiguous বা অস্পষ্ট। ভালো বাক্যে antecedent স্পষ্ট করা উচিত।`
            };

        }
    },

    {
        type: "reference",
        make() {

            const n1 = random(names);
            let n2 = randomOther(n1);

            return {
                q: `${n1} told ${n2} that the teacher wanted to speak to her. Who does "her" refer to?`,
                bn: `"her" কোন ব্যক্তিকে বোঝাচ্ছে? বাক্যে reference পরিষ্কার কি না বিবেচনা করুন।`,
                options: [
                    n1,
                    n2,
                    "The teacher",
                    "The reference is unclear"
                ],
                answer: 3,
                explanation:
                    `বাক্যে ${n1} এবং ${n2}—দুজনের মধ্যে কে female এবং "her" কার দিকে নির্দেশ করছে তা sentence structure থেকে নিশ্চিতভাবে বোঝা যায় না। তাই pronoun reference unclear।`
            };

        }
    },

    /* ---------- EACH / EVERY ---------- */

    {
        type: "each",
        make() {

            return {
                q: `Each of the players must bring _____ own notebook.`,
                bn: `"Each" singular হওয়ায় কোন pronoun ব্যবহার করা উচিত?`,
                options: [
                    "his or her",
                    "their",
                    "our",
                    "your"
                ],
                answer: 0,
                explanation:
                    `"Each" একাধিক ব্যক্তির মধ্য থেকে প্রত্যেককে আলাদাভাবে বোঝায় এবং grammaticalভাবে singular। তাই traditional formal agreement অনুযায়ী "his or her" ব্যবহার করা হয়।`
            };

        }
    },

    {
        type: "each",
        make() {

            return {
                q: `Every student should submit _____ assignment before the deadline.`,
                bn: `"Every student" singular হওয়ায় সঠিক possessive pronoun কোনটি?`,
                options: [
                    "his or her",
                    "their",
                    "our",
                    "its"
                ],
                answer: 0,
                explanation:
                    `"Every student" singular noun phrase। তাই formal পরীক্ষামূলক grammar-এ "his or her assignment" হবে। "its" মানুষ বোঝাতে ব্যবহার করা ঠিক নয়।`
            };

        }
    },

    /* ---------- NEITHER / EITHER ---------- */

    {
        type: "neither",
        make() {

            return {
                q: `Neither Firoz nor Fatiha brought _____ book to the class.`,
                bn: `"Neither...nor" structure-এ ব্যক্তি বোঝালে উপযুক্ত pronoun কোনটি?`,
                options: [
                    "his or her",
                    "their",
                    "its",
                    "our"
                ],
                answer: 0,
                explanation:
                    `"Neither Firoz nor Fatiha" দুইজনকে individually বোঝালেও প্রত্যেকের ক্ষেত্রে singular possessive pronoun প্রয়োজন। পরীক্ষামুখী formal English-এ "his or her book" সবচেয়ে নিরাপদ উত্তর।`
            };

        }
    },

    /* ---------- COLLECTIVE NOUN ---------- */

    {
        type: "collective",
        make() {

            return {
                q: `The committee has reached its decision. Which pronoun correctly refers to "committee"?`,
                bn: `"committee" একটি collective noun। এখানে কোন pronoun সঠিক?`,
                options: [
                    "its",
                    "their",
                    "our",
                    "his"
                ],
                answer: 0,
                explanation:
                    `"Committee" এখানে একটি একক দল বা unit হিসেবে কাজ করছে এবং "has reached its decision" বলা হয়েছে। তাই singular pronoun "its" ব্যবহার করা হয়েছে।`
            };

        }
    },

    /* ---------- INDEFINITE PRONOUN ---------- */

    {
        type: "indefinite",
        make() {

            return {
                q: `Everyone should complete _____ work before leaving the room.`,
                bn: `"Everyone" singular হওয়ায় formal agreement অনুযায়ী কোনটি সঠিক?`,
                options: [
                    "his or her",
                    "their",
                    "our",
                    "its"
                ],
                answer: 0,
                explanation:
                    `"Everyone" দেখতে অনেক মানুষকে বোঝালেও grammaticalভাবে singular indefinite pronoun। তাই traditional formal agreement-এ "his or her work" ব্যবহার করা হয়।`
            };

        }
    },

    {
        type: "indefinite",
        make() {

            return {
                q: `Someone left _____ umbrella in the classroom.`,
                bn: `"Someone" singular হওয়ায় formal grammar অনুযায়ী সঠিক possessive form কোনটি?`,
                options: [
                    "his or her",
                    "their",
                    "our",
                    "its"
                ],
                answer: 0,
                explanation:
                    `"Someone" একটি singular indefinite pronoun। Formal পরীক্ষামূলক English-এ এর সঙ্গে "his or her" ব্যবহার করা হয়। "Its" জড়বস্তু বা প্রাণী বোঝাতে ব্যবহৃত হয়, মানুষ বোঝাতে নয়।`
            };

        }
    },

    /* ---------- REFLEXIVE PRONOUN ---------- */

    {
        type: "reflexive",
        make() {

            const n = random(names);

            return {
                q: `${n} completed the entire project by _____.`,
                bn: `বাক্যে subject নিজেই কাজটি করেছে। তাই কোন reflexive pronoun প্রয়োজন?`,
                options: [
                    "himself",
                    "herself",
                    "themselves",
                    "itself"
                ],
                answer: randomGenderAnswer(n),
                explanation:
                    `Reflexive pronoun-এর antecedent এবং reflexive pronoun একই ব্যক্তি। তাই subject-এর gender অনুযায়ী "himself" বা "herself" হবে।`
            };

        }
    },

    /* ---------- POSSESSIVE AGREEMENT ---------- */

    {
        type: "possessive",
        make() {

            const n = random(names);

            return {
                q: `${n} forgot to bring _____ notebook.`,
                bn: `নামের gender অনুযায়ী সঠিক possessive pronoun নির্বাচন করুন।`,
                options: [
                    "his",
                    "her",
                    "their",
                    "its"
                ],
                answer: randomGenderAnswerSimple(n),
                explanation:
                    `Possessive pronoun অবশ্যই antecedent-এর সঙ্গে number এবং gender অনুযায়ী মিলবে। এখানে ব্যক্তির gender অনুযায়ী "his" বা "her" ব্যবহার করতে হবে।`
            };

        }
    },

    /* ---------- RELATIVE PRONOUN ---------- */

    {
        type: "relative",
        make() {

            const n = random(names);

            return {
                q: `${n} is the student who always completes _____ work on time.`,
                bn: `Relative clause-এ student-এর সঙ্গে কোন possessive pronoun সঠিক?`,
                options: [
                    "his or her",
                    "their",
                    "its",
                    "our"
                ],
                answer: 0,
                explanation:
                    `"student" এখানে singular। তাই formal agreement অনুযায়ী "his or her work" হবে। "its" মানুষ বোঝাতে ব্যবহার করা যাবে না।`
            };

        }
    },

    /* ---------- PRONOUN AGREEMENT ---------- */

    {
        type: "agreement",
        make() {

            return {
                q: `The boys finished _____ homework before the teacher arrived.`,
                bn: `"boys" plural হওয়ায় কোন pronoun সঠিক?`,
                options: [
                    "their",
                    "his",
                    "her",
                    "its"
                ],
                answer: 0,
                explanation:
                    `"Boys" plural noun। তাই এর সঙ্গে plural possessive pronoun "their" ব্যবহার করতে হবে। "his" এবং "her" singular।`
            };

        }
    },

    {
        type: "agreement",
        make() {

            return {
                q: `The girl finished _____ homework before dinner.`,
                bn: `"girl" singular এবং female হওয়ায় কোন pronoun সঠিক?`,
                options: [
                    "her",
                    "his",
                    "their",
                    "its"
                ],
                answer: 0,
                explanation:
                    `"Girl" singular female noun। তাই এর সঙ্গে possessive pronoun "her" হবে।`
            };

        }
    },

    /* ---------- AMBIGUOUS REFERENCE ---------- */

    {
        type: "ambiguous",
        make() {

            return {
                q: `Firoz told Milon that he had won the competition. Why is this sentence potentially unclear?`,
                bn: `বাক্যটি কেন ambiguous বা দ্ব্যর্থক হতে পারে?`,
                options: [
                    "The pronoun 'he' may refer to either person.",
                    "The verb 'told' is incorrect.",
                    "The word 'competition' is incorrect.",
                    "There is no pronoun in the sentence."
                ],
                answer: 0,
                explanation:
                    `"Firoz told Milon that he had won..." বাক্যে "he" Firoz-কে নাকি Milon-কে বোঝাচ্ছে—তা পরিষ্কার নয়। একই sentence-এ দুইজন সম্ভাব্য male antecedent থাকায় pronoun reference ambiguous হয়েছে।`
            };

        }
    },

    /* ---------- SINGULAR / PLURAL ---------- */

    {
        type: "plural",
        make() {

            return {
                q: `The students should bring _____ books to class.`,
                bn: `"students" plural হওয়ায় সঠিক possessive pronoun কোনটি?`,
                options: [
                    "their",
                    "his",
                    "her",
                    "its"
                ],
                answer: 0,
                explanation:
                    `"Students" plural noun। Plural noun-এর সঙ্গে "their" ব্যবহার করতে হয়।`
            };

        }
    },

    {
        type: "singular",
        make() {

            return {
                q: `The student should bring _____ book to class.`,
                bn: `"student" singular হওয়ায় formal agreement অনুযায়ী কোনটি উপযুক্ত?`,
                options: [
                    "his or her",
                    "their",
                    "our",
                    "its"
                ],
                answer: 0,
                explanation:
                    `"Student" singular। Gender নির্দিষ্ট না থাকলে formal পরীক্ষামুখী grammar-এ "his or her" ব্যবহার করা হয়।`
            };

        }
    }

];


/* =========================================================
   STATE
   ========================================================= */

let questionNumber = 1;
let score = 0;

let currentQuestion = null;
let answered = false;


/* =========================================================
   RANDOM HELPERS
   ========================================================= */

function random(array) {
    return array[Math.floor(Math.random() * array.length)];
}


function randomOther(name) {

    const filtered = names.filter(n => n !== name);

    return random(filtered);
}


/*
   Since the name list does not explicitly store gender,
   use a controlled set for grammar generation.
*/

const femaleNames = [
    "Fatiha",
    "Fatema",
    "Jui",
    "Ema",
    "Rupa",
    "Ferjousi",
    "Jannati",
    "Mini",
    "Joba",
    "Tanzila",
    "Rina",
    "Tania",
    "Taslima"
];

const maleNames = [
    "Firoz",
    "Moksed",
    "Miraz",
    "Mujahid",
    "Milon",
    "Hannan"
];


function isFemale(name) {
    return femaleNames.includes(name);
}


function randomGenderAnswer(name) {

    return isFemale(name) ? 1 : 0;
}


function randomGenderAnswerSimple(name) {

    return isFemale(name) ? 1 : 0;
}


/* =========================================================
   SHUFFLE
   ========================================================= */

function shuffle(array) {

    const copy = [...array];

    for (let i = copy.length - 1; i > 0; i--) {

        const j = Math.floor(Math.random() * (i + 1));

        [copy[i], copy[j]] = [copy[j], copy[i]];
    }

    return copy;
}


/* =========================================================
   QUESTION GENERATOR
   ========================================================= */

function generateQuestion() {

    const pattern = random(patterns);

    const generated = pattern.make();

    /*
       Shuffle options while preserving correct answer.
    */

    const correctText = generated.options[generated.answer];

    const shuffled = shuffle(generated.options);

    const newAnswer = shuffled.indexOf(correctText);

    return {
        ...generated,
        options: shuffled,
        answer: newAnswer
    };
}


/* =========================================================
   RENDER QUESTION
   ========================================================= */

function renderQuestion(direction = "next") {

    currentQuestion = generateQuestion();

    answered = false;

    const card = document.getElementById("questionCard");

    /*
       Restart animation cleanly.
    */

    card.classList.remove("enter-next", "enter-prev");

    void card.offsetWidth;

    card.classList.add(
        direction === "prev"
            ? "enter-prev"
            : "enter-next"
    );


    document.getElementById("questionNumber").textContent =
        `Question ${questionNumber}`;

    document.getElementById("questionCount").textContent =
        questionNumber;

    document.getElementById("question").textContent =
        currentQuestion.q;

    document.getElementById("questionBangla").textContent =
        `(${currentQuestion.bn})`;

    const optionsContainer =
        document.getElementById("options");

    optionsContainer.innerHTML = "";

    currentQuestion.options.forEach((option, index) => {

        const button = document.createElement("button");

        button.className = "option";

        const letter = document.createElement("span");

        letter.className = "letter";

        letter.textContent =
            String.fromCharCode(65 + index);

        button.appendChild(letter);

        const text = document.createTextNode(option);

        button.appendChild(text);

        button.addEventListener(
            "click",
            () => selectAnswer(index)
        );

        optionsContainer.appendChild(button);
    });


    document.getElementById("explanation")
        .classList.remove("show");

    document.getElementById("explanationText")
        .textContent = "";


    updateProgress();

    document.getElementById("previousBtn").disabled =
        questionNumber <= 1;

    document.getElementById("nextBtn").textContent =
        "Next";

    /*
       Hide result.
    */

    document.getElementById("result")
        .classList.remove("show");
}


/* =========================================================
   ANSWER
   ========================================================= */

function selectAnswer(selectedIndex) {

    if (answered) return;

    answered = true;

    const buttons =
        document.querySelectorAll(".option");

    buttons.forEach((button, index) => {

        button.disabled = true;

        if (index === currentQuestion.answer) {

            button.classList.add("correct");

        }

        if (
            index === selectedIndex &&
            selectedIndex !== currentQuestion.answer
        ) {

            button.classList.add("wrong");

        }

    });


    if (selectedIndex === currentQuestion.answer) {

        score++;

        document.getElementById("score")
            .textContent = score;
    }


    /*
       Explanation always appears.
    */

    document.getElementById("explanationText")
        .textContent =
        currentQuestion.explanation;

    document.getElementById("explanation")
        .classList.add("show");

    document.getElementById("nextBtn")
        .textContent = "Next";
}


/* =========================================================
   NEXT
   ========================================================= */

function nextQuestion() {

    questionNumber++;

    renderQuestion("next");

    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });
}


/* =========================================================
   PREVIOUS
   ========================================================= */

function previousQuestion() {

    /*
       This system uses generated questions.
       Previous therefore generates another valid
       question rather than attempting to store
       an infinite history.
    */

    if (questionNumber <= 1) return;

    questionNumber--;

    renderQuestion("prev");

    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });
}


/* =========================================================
   PROGRESS
   ========================================================= */

function updateProgress() {

    /*
       Infinite mode uses a visual cycle instead
       of a fixed total-question percentage.
    */

    const percentage =
        ((questionNumber - 1) % 20 + 1) * 5;

    document.getElementById("progressBar")
        .style.width = `${percentage}%`;
}


/* =========================================================
   KEYBOARD CONTROL
   ========================================================= */

document.addEventListener("keydown", function(event) {

    if (event.key === "ArrowRight") {
        nextQuestion();
    }

    if (event.key === "ArrowLeft") {
        previousQuestion();
    }

});


/* =========================================================
   START
   ========================================================= */

renderQuestion("next");

</script>
