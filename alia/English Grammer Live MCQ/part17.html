<style>
/* =========================================================
   PART 17 — ARTICLES & DETERMINERS
   SINGLE FILE MCQ SYSTEM
========================================================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    min-height: 100vh;
    font-family: "Times New Roman", "Kalpurush", serif;

    background:
        radial-gradient(circle at 10% 10%, rgba(220, 235, 255, .75), transparent 35%),
        radial-gradient(circle at 90% 20%, rgba(240, 225, 255, .65), transparent 35%),
        radial-gradient(circle at 50% 100%, rgba(220, 245, 235, .65), transparent 40%),
        linear-gradient(135deg, #ffffff, #f7f9fc);

    color: #202733;
    padding: 25px 15px 45px;
}

/* ---------- MAIN CONTAINER ---------- */

.container {
    width: min(100%, 1050px);
    margin: auto;
}

/* ---------- HEADER ---------- */

.header {
    text-align: center;
    margin-bottom: 25px;
    padding: 25px 20px;

    background: rgba(255, 255, 255, .62);
    border: 1px solid rgba(255, 255, 255, .8);
    border-radius: 25px;

    box-shadow:
        0 20px 55px rgba(30, 50, 80, .10),
        inset 0 1px 0 rgba(255,255,255,.8);

    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);

    animation: headerIn 1.1s cubic-bezier(.16,1,.3,1);
}

.header h1 {
    font-size: clamp(25px, 5vw, 40px);
    letter-spacing: .5px;
    margin-bottom: 8px;
}

.header p {
    font-size: 20px;
    line-height: 1.5;
}

.badge {
    display: inline-block;
    margin-top: 13px;
    padding: 7px 15px;
    border-radius: 999px;

    background: rgba(255,255,255,.75);
    border: 1px solid rgba(0,0,0,.07);

    font-size: 17px;
}

/* ---------- PROGRESS ---------- */

.progress-card {
    padding: 18px 20px;
    margin-bottom: 20px;

    background: rgba(255,255,255,.58);
    border: 1px solid rgba(255,255,255,.8);
    border-radius: 20px;

    box-shadow: 0 15px 40px rgba(30,50,80,.08);

    backdrop-filter: blur(15px);
}

.progress-top {
    display: flex;
    justify-content: space-between;
    gap: 15px;
    flex-wrap: wrap;

    font-size: 19px;
    font-weight: bold;
    margin-bottom: 10px;
}

.progress-track {
    width: 100%;
    height: 10px;
    overflow: hidden;

    background: rgba(0,0,0,.07);
    border-radius: 50px;
}

.progress-bar {
    width: 0%;
    height: 100%;
    border-radius: inherit;

    background: linear-gradient(90deg, #607dff, #8f62ff, #4dc9ff);

    transition: width .8s cubic-bezier(.16,1,.3,1);
}

/* ---------- QUESTION CARD ---------- */

.quiz-card {
    position: relative;
    overflow: hidden;

    padding: clamp(22px, 5vw, 40px);

    background: rgba(255,255,255,.68);
    border: 1px solid rgba(255,255,255,.85);
    border-radius: 28px;

    box-shadow:
        0 25px 70px rgba(30,50,80,.12),
        inset 0 1px 0 rgba(255,255,255,.9);

    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);

    min-height: 430px;
}

/* ---------- QUESTION ANIMATION ---------- */

.question-content {
    animation-duration: 1.05s;
    animation-timing-function: cubic-bezier(.16,1,.3,1);
    animation-fill-mode: both;
}

.slide-next {
    animation-name: slideNext;
}

.slide-prev {
    animation-name: slidePrev;
}

@keyframes slideNext {
    0% {
        opacity: 0;
        transform: translateX(55px) translateY(10px) scale(.985);
        filter: blur(5px);
    }

    55% {
        opacity: .7;
        filter: blur(1.5px);
    }

    100% {
        opacity: 1;
        transform: translateX(0) translateY(0) scale(1);
        filter: blur(0);
    }
}

@keyframes slidePrev {
    0% {
        opacity: 0;
        transform: translateX(-55px) translateY(10px) scale(.985);
        filter: blur(5px);
    }

    55% {
        opacity: .7;
        filter: blur(1.5px);
    }

    100% {
        opacity: 1;
        transform: translateX(0) translateY(0) scale(1);
        filter: blur(0);
    }
}

/* ---------- CATEGORY ---------- */

.category {
    display: inline-block;

    padding: 7px 14px;
    margin-bottom: 18px;

    border-radius: 999px;

    background: rgba(95,125,255,.10);
    border: 1px solid rgba(95,125,255,.18);

    font-size: 17px;
    font-weight: bold;
}

/* ---------- QUESTION ---------- */

.question {
    font-size: clamp(21px, 3vw, 27px);
    line-height: 1.55;
    font-weight: bold;

    margin-bottom: 5px;
}

.question-bangla {
    font-family: "Kalpurush", "Noto Sans Bengali", sans-serif;

    font-size: 18px;
    line-height: 1.7;

    color: #596273;
    margin-bottom: 25px;
}

/* ---------- OPTIONS ---------- */

.options {
    display: grid;
    gap: 13px;
}

.option {
    width: 100%;
    text-align: left;

    padding: 16px 18px;

    border-radius: 17px;
    border: 1px solid rgba(40,55,80,.12);

    background: rgba(255,255,255,.72);

    font-family: "Times New Roman", "Kalpurush", serif;
    font-size: 20px;
    line-height: 1.4;

    cursor: pointer;

    transition:
        transform .35s cubic-bezier(.16,1,.3,1),
        box-shadow .35s ease,
        background .35s ease,
        border-color .35s ease;
}

.option:hover:not(:disabled) {
    transform: translateY(-3px);
    box-shadow: 0 10px 25px rgba(30,50,80,.10);
    border-color: rgba(95,125,255,.35);
}

.option:active:not(:disabled) {
    transform: scale(.985);
}

.option:disabled {
    cursor: default;
}

.option.correct {
    background: rgba(62, 190, 120, .13);
    border-color: rgba(35, 160, 95, .55);
    box-shadow: 0 8px 25px rgba(35,160,95,.12);
}

.option.wrong {
    background: rgba(235, 75, 90, .11);
    border-color: rgba(220,55,75,.5);
    box-shadow: 0 8px 25px rgba(220,55,75,.10);
}

.option.reveal {
    background: rgba(62,190,120,.08);
    border-color: rgba(35,160,95,.35);
}

/* ---------- EXPLANATION ---------- */

.explanation {
    margin-top: 23px;
    padding: 20px;

    border-radius: 19px;

    background: rgba(248,250,255,.9);
    border: 1px solid rgba(90,110,150,.13);

    font-family: "Kalpurush", "Noto Sans Bengali", sans-serif;

    font-size: 18px;
    line-height: 1.8;

    animation: explanationIn .65s cubic-bezier(.16,1,.3,1);
}

@keyframes explanationIn {
    from {
        opacity: 0;
        transform: translateY(15px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.explanation strong {
    font-family: "Times New Roman", "Kalpurush", serif;
}

/* ---------- CONTROLS ---------- */

.controls {
    display: flex;
    justify-content: space-between;
    gap: 14px;

    margin-top: 22px;
}

.control-btn {
    flex: 1;

    padding: 15px 20px;

    border: none;
    border-radius: 17px;

    background: rgba(255,255,255,.78);
    border: 1px solid rgba(0,0,0,.08);

    font-family: "Times New Roman", "Kalpurush", serif;
    font-size: 19px;
    font-weight: bold;

    cursor: pointer;

    box-shadow: 0 10px 25px rgba(30,50,80,.08);

    transition:
        transform .3s cubic-bezier(.16,1,.3,1),
        box-shadow .3s ease,
        opacity .3s ease;
}

.control-btn:hover:not(:disabled) {
    transform: translateY(-3px);
    box-shadow: 0 15px 32px rgba(30,50,80,.13);
}

.control-btn:active:not(:disabled) {
    transform: scale(.97);
}

.control-btn:disabled {
    opacity: .45;
    cursor: not-allowed;
}

.next-btn {
    background: linear-gradient(135deg, #637cff, #815eff);
    color: white;
    border: none;
}

/* ---------- SCORE ---------- */

.score-card {
    margin-top: 22px;
    padding: 20px;

    text-align: center;

    background: rgba(255,255,255,.62);
    border: 1px solid rgba(255,255,255,.8);
    border-radius: 22px;

    box-shadow: 0 15px 40px rgba(30,50,80,.08);

    backdrop-filter: blur(15px);
}

.score-card h2 {
    font-size: 23px;
    margin-bottom: 8px;
}

.score-number {
    font-size: 31px;
    font-weight: bold;
}

/* ---------- FOOTER ---------- */

.footer {
    text-align: center;
    margin-top: 25px;

    font-size: 17px;
    line-height: 1.7;

    color: #697386;
}

/* ---------- RESPONSIVE ---------- */

@media (max-width: 600px) {

    body {
        padding: 12px 9px 30px;
    }

    .header {
        padding: 21px 14px;
        border-radius: 20px;
    }

    .header p {
        font-size: 18px;
    }

    .progress-card {
        padding: 15px;
    }

    .quiz-card {
        padding: 20px 15px;
        border-radius: 22px;
        min-height: 400px;
    }

    .question {
        font-size: 21px;
    }

    .question-bangla {
        font-size: 18px;
    }

    .option {
        font-size: 19px;
        padding: 15px;
    }

    .controls {
        gap: 9px;
    }

    .control-btn {
        padding: 14px 10px;
        font-size: 18px;
    }
}

/* ---------- REDUCED MOTION ---------- */

@media (prefers-reduced-motion: reduce) {

    *,
    *::before,
    *::after {
        animation-duration: .01ms !important;
        transition-duration: .01ms !important;
    }
}
</style>

========================================================= */

function randomName() {

    return names[
        Math.floor(Math.random() * names.length)
    ];

}


/* =========================================================
   5. RANDOM ITEM
========================================================= */

function randomItem(array) {

    return array[
        Math.floor(Math.random() * array.length)
    ];

}


/* =========================================================
   6. SHUFFLE
========================================================= */

function shuffle(array) {

    const result = [...array];

    for (
        let i = result.length - 1;
        i > 0;
        i--
    ) {

        const j =
            Math.floor(Math.random() * (i + 1));

        [
            result[i],
            result[j]
        ] =
        [
            result[j],
            result[i]
        ];
    }

    return result;
}


/* =========================================================
   7. INFINITE GENERATOR
========================================================= */

function generateInfiniteQuestion() {

    const item = randomItem(nouns);
    const name = randomName();

    /* ---------- A / AN ---------- */

    if (Math.random() < .40) {

        let answer;

        if (item.sound === "vowel") {

            answer = "an";

        } else {

            answer = "a";

        }

        const options =
            answer === "a"
                ? ["a", "an", "the", "some"]
                : ["a", "an", "the", "any"];

        return {

            category: "Generated — A / An",

            q:
                `${name} bought ___ ${item.word}.`,

            bn:
                `${name} একটি ${item.bn} কিনেছে।`,

            options: shuffle(options),

            answer: answer,

            explanation:
                `<strong>Correct Answer: ${answer}</strong><br><br>` +

                `${item.word} একটি singular countable noun। ` +

                `এটি সাধারণভাবে ও প্রথমবার উল্লেখ করা হয়েছে। ` +

                (item.sound === "vowel"
                    ?
                    `শব্দটির শুরু vowel sound দিয়ে হওয়ায় <strong>an</strong> হবে।`
                    :
                    `শব্দটির শুরু consonant sound দিয়ে হওয়ায় <strong>a</strong> হবে।`
                )
        };
    }


    /* ---------- THE ---------- */

    if (Math.random() < .50) {

        return {

            category: "Generated — The",

            q:
                `I saw a ${item.word}. ___ ${item.word} was interesting.`,

            bn:
                `আমি একটি ${item.bn} দেখলাম। পরে একই ${item.bn}-এর কথা বলা হচ্ছে।`,

            options:
                shuffle([
                    "A",
                    "An",
                    "The",
                    "Some"
                ]),

            answer: "The",

            explanation:
                "<strong>Correct Answer: The</strong><br><br>" +

                `প্রথমে <strong>a ${item.word}</strong> বলে ${item.bn}-টির কথা বলা হয়েছে। ` +

                `পরের অংশে একই নির্দিষ্ট ${item.bn}-কে আবার বোঝানো হয়েছে। ` +

                `তাই দ্বিতীয়বার <strong>The</strong> ব্যবহার হবে।`
        };
    }


    /* ---------- MANY ---------- */

    if (item.type === "countable") {

        return {

            category: "Generated — Quantifiers",

            q:
                `There are ___ ${item.word}s in the room.`,

            bn:
                `ঘরে অনেকগুলো ${item.bn} আছে।`,

            options:
                shuffle([
                    "many",
                    "much",
                    "little",
                    "a little"
                ]),

            answer: "many",

            explanation:
                "<strong>Correct Answer: many</strong><br><br>" +

                `<strong>${item.word}s</strong> এখানে plural countable noun। ` +

                `Plural countable noun-এর সংখ্যা বা পরিমাণ বোঝাতে <strong>many</strong> ব্যবহৃত হয়।`
        };
    }


    /* ---------- FALLBACK ---------- */

    return {

        category: "Generated — Articles",

        q:
            `${name} saw ___ ${item.word}.`,

        bn:
            `${name} একটি ${item.bn} দেখেছে।`,

        options:
            shuffle([
                item.sound === "vowel" ? "an" : "a",
                item.sound === "vowel" ? "a" : "an",
                "the",
                "some"
            ]),

        answer:
            item.sound === "vowel"
                ? "an"
                : "a",

        explanation:
            "<strong>Article Rule</strong><br><br>" +

            `এখানে ${item.word} একটি singular countable noun। ` +

            `প্রথমবার সাধারণভাবে উল্লেখ করায় indefinite article ব্যবহার হবে। ` +

            (
                item.sound === "vowel"
                    ?
                    "শব্দটি vowel sound দিয়ে শুরু হওয়ায় <strong>an</strong> হবে।"
                    :
                    "শব্দটি consonant sound দিয়ে শুরু হওয়ায় <strong>a</strong> হবে।"
            )
    };
}


/* =========================================================
   8. QUESTION ENGINE
========================================================= */

let questions = [...templates];

let currentIndex = 0;

let score = 0;

let answered = false;

let history = [];


/* =========================================================
   9. DOM
========================================================= */

const questionContent =
    document.getElementById("questionContent");

const category =
    document.getElementById("category");

const question =
    document.getElementById("question");

const questionBangla =
    document.getElementById("questionBangla");

const options =
    document.getElementById("options");

const explanationArea =
    document.getElementById("explanationArea");

const previousBtn =
    document.getElementById("previousBtn");

const nextBtn =
    document.getElementById("nextBtn");

const questionCounter =
    document.getElementById("questionCounter");

const scoreCounter =
    document.getElementById("scoreCounter");

const scoreDisplay =
    document.getElementById("scoreDisplay");

const progressBar =
    document.getElementById("progressBar");


/* =========================================================
   10. ENSURE INFINITE QUESTIONS
========================================================= */

function ensureQuestionExists(index) {

    while (questions.length <= index) {

        questions.push(
            generateInfiniteQuestion()
        );

    }

}


/* =========================================================
   11. LOAD QUESTION
========================================================= */

function loadQuestion(direction = "next") {

    ensureQuestionExists(currentIndex);

    const data =
        questions[currentIndex];


    /* Reset animation */

    questionContent.classList.remove(
        "slide-next",
        "slide-prev"
    );

    void questionContent.offsetWidth;


    questionContent.classList.add(
        direction === "prev"
            ? "slide-prev"
            : "slide-next"
    );


    /* Question */

    category.textContent =
        data.category;

    question.textContent =
        data.q;

    questionBangla.textContent =
        `(${data.bn})`;


    /* Options */

    options.innerHTML = "";

    explanationArea.innerHTML = "";


    answered = false;


    data.options.forEach(optionText => {

        const button =
            document.createElement("button");

        button.className = "option";

        button.textContent =
            optionText;

        button.addEventListener(
            "click",
            () => checkAnswer(
                button,
                optionText,
                data
            )
        );

        options.appendChild(button);

    });


    /* Controls */

    previousBtn.disabled =
        currentIndex === 0;

    nextBtn.textContent =
        "Next →";


    /* Progress */

    questionCounter.textContent =
        `Question ${currentIndex + 1}`;

    scoreCounter.textContent =
        `Score: ${score}`;

    scoreDisplay.textContent =
        `${score} / ${currentIndex + (answered ? 1 : 0)}`;


    /*
       Because the system is infinite,
       progress is visualized within the current
       practice sequence rather than as a fixed total.
    */

    const progress =
        Math.min(
            95,
            ((currentIndex % 20) + 1) * 5
        );

    progressBar.style.width =
        `${progress}%`;

}


/* =========================================================
   12. CHECK ANSWER
========================================================= */

function checkAnswer(
    clickedButton,
    selected,
    data
) {

    if (answered) return;

    answered = true;


    const allButtons =
        document.querySelectorAll(".option");


    allButtons.forEach(button => {

        button.disabled = true;

        if (
            button.textContent === data.answer
        ) {

            button.classList.add(
                "reveal"
            );

        }

    });


    if (selected === data.answer) {

        clickedButton.classList.remove(
            "reveal"
        );

        clickedButton.classList.add(
            "correct"
        );

        score++;

    } else {

        clickedButton.classList.add(
            "wrong"
        );

    }


    /* Save answer history */

    history[currentIndex] = {

        selected: selected,

        correct: data.answer

    };


    /* Explanation */

    explanationArea.innerHTML = `

        <div class="explanation">

            ${data.explanation}

        </div>

    `;


    scoreCounter.textContent =
        `Score: ${score}`;

    scoreDisplay.textContent =
        `${score} / ${currentIndex + 1}`;


    nextBtn.textContent =
        "Next →";
}


/* =========================================================
   13. NEXT
========================================================= */

nextBtn.addEventListener(
    "click",
    () => {

        currentIndex++;

        ensureQuestionExists(
            currentIndex
        );

        loadQuestion("next");

        window.scrollTo({
            top: 0,
            behavior: "smooth"
        });

    }
);


/* =========================================================
   14. PREVIOUS
========================================================= */

previousBtn.addEventListener(
    "click",
    () => {

        if (currentIndex <= 0)
            return;

        currentIndex--;

        loadQuestion("prev");

        window.scrollTo({
            top: 0,
            behavior: "smooth"
        });

    }
);


/* =========================================================
   15. KEYBOARD CONTROL
========================================================= */

document.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "ArrowRight"
        ) {

            nextBtn.click();

        }

        if (
            event.key === "ArrowLeft"
        ) {

            previousBtn.click();

        }

    }
);


/* =========================================================
   16. START
========================================================= */

loadQuestion("next");

</script>
