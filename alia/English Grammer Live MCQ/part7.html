   PART 7 - ADVERB

* {

}

/* =========================================================
   HEADER
========================================================= */

    text-align: center;

    border-radius: 25px;

    box-shadow:

    animation: headerIn 1.2s cubic-bezier(.16,1,.3,1);
}

@keyframes headerIn {
    from {
        opacity: 0;
        transform: translateY(-35px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.header h1 {

/* =========================================================

========================================================= */

.progress-area {

    box-shadow: 0 10px 30px rgba(30,40,60,0.08);
}

.progress-text,
.score {
    font-size: 19px;
    font-weight: bold;
}

.progress-bar {
    flex: 1;
    height: 9px;

    background: #e8edf3;

    border-radius: 20px;
    overflow: hidden;
}

.progress-fill {
    width: 0%;
    height: 100%;

    background: linear-gradient(90deg, #6478ff, #7b61ff);

    border-radius: inherit;

    transition: width 0.8s cubic-bezier(.16,1,.3,1);
}

/* =========================================================
   QUESTION CARD
========================================================= */

.question-card {
    padding: clamp(22px, 5vw, 42px);

    border-radius: 28px;

    background: rgba(255,255,255,0.68);

    border: 1px solid rgba(255,255,255,0.9);

    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);

    box-shadow:
        0 25px 60px rgba(25,40,65,0.10),
        0 5px 18px rgba(25,40,65,0.05);

    overflow: hidden;
}

/* =========================================================
   QUESTION ANIMATION
========================================================= */

.question-content {
    animation: questionIn 1.05s cubic-bezier(.16,1,.3,1);
}

@keyframes questionIn {
    0% {
        opacity: 0;
        transform: translateX(45px) translateY(10px);
        filter: blur(5px);
    }

    45% {
        opacity: 0.5;
    }

    100% {
        opacity: 1;
        transform: translateX(0) translateY(0);
        filter: blur(0);
    }
}

.question-number {
    display: inline-block;

    margin-bottom: 17px;

    padding: 7px 14px;

    border-radius: 50px;

    background: #eef1ff;
    color: #5264d9;

    font-family: Arial, sans-serif;
    font-size: 15px;
    font-weight: bold;
}

.question {
    font-size: clamp(21px, 3vw, 27px);
    line-height: 1.55;

    margin-bottom: 8px;

    font-weight: bold;
}

.question-bangla {
    font-family: "Kalpurush", "Noto Sans Bengali", sans-serif;

    font-size: 18px;
    line-height: 1.7;

    color: #68717c;

    margin-bottom: 28px;
}

/* =========================================================
   OPTIONS
========================================================= */

.options {
    display: grid;
    gap: 14px;
}

.option {
    width: 100%;

    padding: 17px 20px;

    border: 1px solid rgba(160,170,185,0.28);

    border-radius: 17px;

    background: rgba(255,255,255,0.72);

    color: #20242a;

    font-family: "Times New Roman", serif;
    font-size: 21px;

    text-align: left;

    cursor: pointer;

    transition:
        transform 0.35s cubic-bezier(.16,1,.3,1),
        box-shadow 0.35s ease,
        background 0.35s ease,
        border 0.35s ease;
}

.option:hover {
    transform: translateX(7px);

    box-shadow:
        0 10px 25px rgba(35,50,80,0.10);

    background: #ffffff;
}

.option:active {
    transform: scale(0.985);
}

.option.correct {
    background: #e9f9ee;
    border-color: #55b873;

    color: #16713a;

    box-shadow: 0 8px 25px rgba(55,170,95,0.13);
}

.option.wrong {
    background: #fff0f0;
    border-color: #e56b6b;

    color: #a52b2b;

    box-shadow: 0 8px 25px rgba(220,70,70,0.12);
}

.option.disabled {
    cursor: default;
}

.option.disabled:hover {
    transform: none;
}

/* =========================================================
   EXPLANATION
========================================================= */

.explanation {
    display: none;

    margin-top: 25px;
    padding: 23px;

    border-radius: 20px;

    background:
        linear-gradient(
            135deg,
            rgba(245,247,255,0.95),
            rgba(250,252,255,0.9)

    border-left: 5px solid #6878e8;

    animation: explanationIn 0.75s cubic-bezier(.16,1,.3,1);
}

.explanation.show {
    display: block;
}

@keyframes explanationIn {
    from {
        opacity: 0;
        transform: translateY(18px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.explanation-title {
    font-family: Arial, sans-serif;

    font-size: 20px;
    font-weight: bold;

    margin-bottom: 10px;
}

.explanation-text {
    font-family: "Kalpurush", "Noto Sans Bengali", sans-serif;

    line-height: 1.9;

/* =========================================================
   RESULT / CONTROL
========================================================= */

.controls {
    display: flex;
    justify-content: space-between;

.control-btn {

.control-btn:hover {

    box-shadow:

}

.next-btn {
    color: white;

    background:
        linear-gradient(135deg, #6478ff, #765cf5);
}

.previous-btn {
    color: #46505d;
}

.control-btn:disabled {
    opacity: 0.45;
    cursor: not-allowed;
    transform: none;

/* =========================================================
   FOOTER
========================================================= */

.footer {

/* =========================================================

========================================================= */

@media (max-width: 650px) {

<script>

/* =========================================================

const names = [

/* ---------------------------------------------------------

const adverbs = {

        },

        },
        {

        {

        },

        },
        {
            word: "quite",

        },
        {
            word: "almost",

        },

        }

/* ---------------------------------------------------------
   Utility Functions
--------------------------------------------------------- */

function randomItem(array) {
    return array[Math.floor(Math.random() * array.length)];
}


function shuffle(array) {
    return [...array].sort(() => Math.random() - 0.5);
}


function randomName() {
    return randomItem(names);
}


/* ---------------------------------------------------------
   Question Generator
--------------------------------------------------------- */

function generateQuestion() {

    const generators = [
        generateMannerQuestion,
        generateFrequencyQuestion,
        generateTimeQuestion,
        generatePlaceQuestion,
        generateDegreeQuestion,
        generateIdentifyQuestion,
        generatePositionQuestion
    ];

    return randomItem(generators)();
}


/* =========================================================
   MANNER QUESTIONS
========================================================= */

function generateMannerQuestion() {

    const name = randomName();

    const data = randomItem(adverbs.manner);

    const sentences = {

        carefully:
            `${name} completed the work ______.`,

        quickly:
            `${name} finished the task ______.`,

        slowly:
            `${name} walked ______.`,

        beautifully:
            `${name} sings ______.`,

        quietly:
            `${name} entered the room ______.`,

        carelessly:
            `${name} did the work ______.`,

        politely:
            `${name} answered the teacher ______.`,

        honestly:
            `${name} spoke ______.`
    };

    const question = sentences[data.word];

    const wrongs = shuffle(
        adverbs.manner
            .filter(x => x.word !== data.word)
            .map(x => x.word)
    ).slice(0, 3);

    const options = shuffle([
        data.word,
        ...wrongs
    ]);

    return {

        type: "Adverb of Manner",

        question: question,

        bangla:
            "(সঠিকভাবে বাক্যটি সম্পূর্ণ করার জন্য উপযুক্ত Adverb নির্বাচন করুন।)",

        options: options,

        answer: data.word,

        explanation:
            `<b>${data.word}</b> হলো Adverb of Manner। এটি কাজটি <b>কীভাবে</b> হয়েছে তা প্রকাশ করে। এখানে "${data.word}" দ্বারা কাজটির ধরন বা পদ্ধতি বোঝানো হয়েছে। তাই এটিই সঠিক উত্তর।`
    };
}


/* =========================================================
   FREQUENCY QUESTIONS
========================================================= */

function generateFrequencyQuestion() {

    const name = randomName();

    const data = randomItem(adverbs.frequency);

    const templates = {

        always:
            `${name} ______ follows the rules.`,

        often:
            `${name} ______ reads English books.`,

        usually:
            `${name} ______ comes to class on time.`,

        sometimes:
            `${name} ______ visits the library.`,

        rarely:
            `${name} ______ misses the class.`,

        never:
            `${name} ______ tells a lie.`
    };

    const question = templates[data.word];

    const wrongs = shuffle(
        adverbs.frequency
            .filter(x => x.word !== data.word)
            .map(x => x.word)
    ).slice(0, 3);

    return {

        type: "Adverb of Frequency",

        question: question,

        bangla:
            "(বাক্যে কাজটি কত ঘনঘন ঘটে—তা বোঝানোর জন্য সঠিক Adverb নির্বাচন করুন।)",

        options: shuffle([
            data.word,
            ...wrongs
        ]),

        answer: data.word,

        explanation:
            `<b>${data.word}</b> হলো Adverb of Frequency। এটি কোনো কাজ <b>কতবার বা কত ঘনঘন</b> ঘটে তা প্রকাশ করে। তাই বাক্যের অর্থ অনুযায়ী "${data.word}" সঠিক।`
    };
}


/* =========================================================
   TIME QUESTIONS
========================================================= */

    const data = randomItem(adverbs.time);

    const templates = {

        yesterday:

        answer: data.word,

        explanation:
            `<b>${data.word}</b> এখানে Degree বোঝাচ্ছে। Adverb of Degree কোনো গুণ, অবস্থা বা কাজের <b>মাত্রা বা পরিমাণ</b> প্রকাশ করে। তাই বাক্যের অর্থ অনুযায়ী এটি সঠিক।`
    };
}


/* =========================================================
   IDENTIFY ADVERB
========================================================= */

function generateIdentifyQuestion() {

    const questions = [

        {
            sentence:
                "Firoz speaks politely.",

            answer:
                "politely",

            bangla:
                "(বাক্যে কোন শব্দটি Adverb?)",

            explanation:
                "<b>politely</b> হলো Adverb। এটি 'speaks' কাজটি কীভাবে করা হচ্ছে তা প্রকাশ করছে। তাই এটি Adverb of Manner।"
        },

        {
            sentence:
                "Fatiha always studies carefully.",

            answer:
                "always",

            bangla:
                "(বাক্যে Frequency বোঝানো Adverb কোনটি?)",

            explanation:
                "<b>always</b> হলো Adverb of Frequency। এটি Fatiha কত ঘনঘন পড়াশোনা করে তা প্রকাশ করছে।"
        },

        {
            sentence:
                "Jui is waiting outside.",

            answer:
                "outside",

            bangla:
                "(বাক্যে Place বোঝানো Adverb কোনটি?)",

            explanation:
                "<b>outside</b> হলো Adverb of Place। এটি Jui কোথায় অপেক্ষা করছে তা প্রকাশ করছে।"
        },

        {
            sentence:
                "Ema is very happy.",

            answer:
                "very",

            bangla:
                "(বাক্যে Degree বোঝানো Adverb কোনটি?)",

            explanation:
                "<b>very</b> হলো Adverb of Degree। এটি Ema কতটা happy তা প্রকাশ করছে।"
        },

        {
            sentence:
                "Rupa arrived yesterday.",

            answer:
                "yesterday",

            bangla:
                "(বাক্যে Time বোঝানো Adverb কোনটি?)",

            explanation:
                "<b>yesterday</b> হলো Adverb of Time। এটি Rupa কখন arrived করেছে তা প্রকাশ করছে।"
        }
    ];

    const q = randomItem(questions);

    const allWords = q.sentence
        .replace(/[.]/g, "")
        .split(" ")
        .filter(word => word.length > 2);

    const wrongs = shuffle(
        allWords.filter(word =>
            word.toLowerCase() !== q.answer.toLowerCase()
        )
    ).slice(0, 3);

    return {

        type: "Identify the Adverb",

        question: q.sentence,

        bangla: q.bangla,

        options: shuffle([
            q.answer,
            ...wrongs
        ]),

        answer: q.answer,

        explanation: q.explanation
    };
}

/* =========================================================
   STATE
========================================================= */

let currentQuestion = null;

let questionNumber = 0;

let score = 0;

let answered = false;

let history = [];

let currentHistoryIndex = -1;


/* =========================================================
   LOAD NEW QUESTION
========================================================= */

function loadQuestion(question = null) {

    answered = false;

    currentQuestion = question || generateQuestion();

    questionNumber++;

    document.getElementById("questionNo").textContent =
        questionNumber;

    document.getElementById("score").textContent =
        score;

    document.getElementById("questionType").textContent =
        currentQuestion.type;

    document.getElementById("questionText").textContent =
        currentQuestion.question;

    document.getElementById("questionBangla").textContent =
        currentQuestion.bangla;

    const optionsContainer =
        document.getElementById("options");

    optionsContainer.innerHTML = "";

    const explanation =
        document.getElementById("explanation");

    explanation.classList.remove("show");

    document.getElementById("explanationText").innerHTML =
        "";

    currentQuestion.options.forEach(option => {

        const button =
            document.createElement("button");

        button.className = "option";

        button.textContent = option;

        button.onclick = () => checkAnswer(button, option);

        optionsContainer.appendChild(button);
    });

    updateProgress();

    animateQuestion();

    document.getElementById("previousBtn").disabled =
        history.length <= 1;
}


/* =========================================================
   ANSWER CHECK
========================================================= */

function checkAnswer(button, selected) {

    if (answered) return;

    answered = true;

    const allOptions =
        document.querySelectorAll(".option");

    allOptions.forEach(option => {
        option.classList.add("disabled");
    });

    if (
        selected.toLowerCase() ===
        currentQuestion.answer.toLowerCase()
    ) {

        button.classList.add("correct");

        score++;

        document.getElementById("score").textContent =
            score;

    } else {

        button.classList.add("wrong");

        allOptions.forEach(option => {

            if (
                option.textContent.toLowerCase() ===
                currentQuestion.answer.toLowerCase()
            ) {
                option.classList.add("correct");
            }

        });
    }

    document.getElementById("explanationText").innerHTML =
        currentQuestion.explanation;

    document.getElementById("explanation")
        .classList.add("show");
}


/* =========================================================
   NEXT QUESTION
========================================================= */

function nextQuestion() {

    const newQuestion = generateQuestion();

    history.push(newQuestion);

    currentHistoryIndex = history.length - 1;

    loadQuestion(newQuestion);
}


/* =========================================================
   PREVIOUS QUESTION
========================================================= */

function previousQuestion() {

    if (history.length < 2) return;

    if (currentHistoryIndex <= 0) return;

    currentHistoryIndex--;

    questionNumber--;

    loadQuestion(history[currentHistoryIndex]);

    document.getElementById("questionNo").textContent =
        questionNumber;
}


/* =========================================================
   PROGRESS
========================================================= */

function updateProgress() {

    /*
       Infinity system:
       Progress is visual only.
       It loops smoothly after every 20 questions.
    */

    let progress =
        ((questionNumber - 1) % 20 + 1) / 20 * 100;

    document.getElementById("progressFill").style.width =
        progress + "%";
}


/* =========================================================
   QUESTION ANIMATION RESTART
========================================================= */

function animateQuestion() {

    const content =
        document.getElementById("questionContent");

    content.classList.remove("question-content");

    void content.offsetWidth;

    content.classList.add("question-content");
}


/* =========================================================
   INITIAL QUESTION
========================================================= */

const firstQuestion = generateQuestion();

history.push(firstQuestion);

currentHistoryIndex = 0;

loadQuestion(firstQuestion);


/* =========================================================
   KEYBOARD CONTROL
========================================================= */

document.addEventListener("keydown", function(event) {

    if (event.key === "ArrowRight") {

        nextQuestion();

    }

    if (event.key === "ArrowLeft") {

        previousQuestion();

    }

});
