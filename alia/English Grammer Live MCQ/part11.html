<head>

<title>Part 11 - Subject, Person & Number | Infinity MCQ</title>

<style>
/* =========================================================
   PART 11 — SUBJECT, PERSON & NUMBER
   Single File HTML + CSS + JavaScript
========================================================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    min-height: 100vh;
    padding: 25px 15px;
    font-family: "Times New Roman", "Kalpurush", serif;

    background:
        radial-gradient(circle at 10% 10%, rgba(210, 225, 255, 0.55), transparent 30%),
        radial-gradient(circle at 90% 15%, rgba(230, 220, 255, 0.50), transparent 30%),
        radial-gradient(circle at 50% 100%, rgba(220, 240, 235, 0.45), transparent 35%),
        linear-gradient(135deg, #ffffff, #f7f9fc, #ffffff);

    color: #1f2937;
}

/* =========================
   MAIN CONTAINER
========================= */

.container {
    width: 100%;
    max-width: 1050px;
    margin: auto;
}

/* =========================
   HEADER
========================= */

.header {
    text-align: center;
    padding: 25px 20px;
    margin-bottom: 20px;

    background: rgba(255, 255, 255, 0.68);
    border: 1px solid rgba(255, 255, 255, 0.85);
    border-radius: 25px;

    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);

    box-shadow:
        0 15px 40px rgba(40, 60, 90, 0.10),
        inset 0 1px 0 rgba(255,255,255,0.8);
}

.header h1 {
    font-size: clamp(28px, 5vw, 42px);
    line-height: 1.25;
    color: #172033;
    margin-bottom: 8px;
}

.header p {
    font-size: 20px;
    color: #526070;
}

/* =========================
   SCORE BAR
========================= */

.status-bar {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin-bottom: 20px;
}

.status-card {
    padding: 15px;
    text-align: center;

    background: rgba(255,255,255,0.65);
    border: 1px solid rgba(255,255,255,0.9);
    border-radius: 18px;

    backdrop-filter: blur(15px);
    -webkit-backdrop-filter: blur(15px);

    box-shadow: 0 10px 30px rgba(40,60,90,0.08);
}

.status-label {
    display: block;
    font-size: 17px;
    color: #64748b;
    margin-bottom: 4px;
}

.status-value {
    display: block;
    font-size: 25px;
    font-weight: bold;
    color: #182338;
}

/* =========================
   PROGRESS
========================= */

.progress-wrapper {
    margin-bottom: 20px;
}

.progress-track {
    width: 100%;
    height: 9px;
    overflow: hidden;

    background: rgba(210,220,235,0.65);
    border-radius: 50px;
}

.progress-bar {
    height: 100%;
    width: 0%;
    border-radius: 50px;

    background: linear-gradient(90deg, #667eea, #764ba2);

    transition: width 0.7s cubic-bezier(0.22, 1, 0.36, 1);
}

/* =========================
   QUESTION CARD
========================= */

.question-card {
    position: relative;
    overflow: hidden;

    padding: clamp(22px, 5vw, 42px);
    border-radius: 28px;

    background: rgba(255,255,255,0.70);
    border: 1px solid rgba(255,255,255,0.9);

    backdrop-filter: blur(22px);
    -webkit-backdrop-filter: blur(22px);

    box-shadow:
        0 25px 60px rgba(45,55,80,0.12),
        inset 0 1px 0 rgba(255,255,255,0.85);
}

/* Decorative glow */

.question-card::before {
    content: "";
    position: absolute;
    width: 180px;
    height: 180px;
    border-radius: 50%;

    background: rgba(120,140,255,0.10);

    top: -90px;
    right: -70px;

    pointer-events: none;
}

/* =========================
   QUESTION ANIMATION
========================= */

.question-content {
    opacity: 1;
    transform: translateY(0) scale(1);
}

.question-content.exit {
    animation: questionExit 0.42s cubic-bezier(0.65, 0, 0.35, 1) forwards;
}

.question-content.enter {
    animation: questionEnter 0.95s cubic-bezier(0.22, 1, 0.36, 1) forwards;
}

@keyframes questionExit {
    0% {
        opacity: 1;
        transform: translateY(0) scale(1);
    }

    100% {
        opacity: 0;
        transform: translateY(-28px) scale(0.985);
    }
}

@keyframes questionEnter {
    0% {
        opacity: 0;
        transform: translateY(35px) scale(0.985);
        filter: blur(4px);
    }

    55% {
        opacity: 0.75;
        filter: blur(1px);
    }

    100% {
        opacity: 1;
        transform: translateY(0) scale(1);
        filter: blur(0);
    }
}

/* =========================
   QUESTION NUMBER
========================= */

.question-number {
    display: inline-block;
    margin-bottom: 18px;
    padding: 8px 16px;

    border-radius: 50px;

    background: rgba(105,120,230,0.10);
    color: #5967b8;

    font-size: 18px;
    font-weight: bold;
}

/* =========================
   QUESTION
========================= */

.question {
    font-size: clamp(21px, 3vw, 27px);
    line-height: 1.5;
    font-weight: bold;
    color: #182033;

    margin-bottom: 7px;
}

.question-bangla {
    font-family: "Kalpurush", "Noto Sans Bengali", sans-serif;
    font-size: 19px;
    line-height: 1.65;
    color: #657080;

    margin-bottom: 25px;
}

/* =========================
   OPTIONS
========================= */

.options {
    display: grid;
    gap: 13px;
}

.option {
    width: 100%;
    padding: 17px 19px;

    display: flex;
    align-items: center;
    gap: 13px;

    text-align: left;

    border: 1px solid rgba(170,180,200,0.35);
    border-radius: 17px;

    background: rgba(255,255,255,0.65);

    font-family: "Times New Roman", serif;
    font-size: 20px;
    line-height: 1.4;

    color: #263247;

    cursor: pointer;

    transition:
        transform 0.35s cubic-bezier(0.22, 1, 0.36, 1),
        box-shadow 0.35s ease,
        background 0.35s ease,
        border-color 0.35s ease;
}

.option:hover:not(:disabled) {
    transform: translateX(7px);
    background: rgba(255,255,255,0.95);

    box-shadow: 0 9px 25px rgba(50,65,95,0.10);
}

.option-letter {
    min-width: 35px;
    height: 35px;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 50%;

    background: rgba(105,120,230,0.11);
    color: #5362ad;

    font-weight: bold;
}

/* Correct */

.option.correct {
    background: rgba(220,252,231,0.90);
    border-color: rgba(34,197,94,0.55);

    box-shadow: 0 10px 28px rgba(34,197,94,0.12);
}

.option.correct .option-letter {
    background: #22c55e;
    color: white;
}

/* Wrong */

.option.wrong {
    background: rgba(254,226,226,0.90);
    border-color: rgba(239,68,68,0.50);

    box-shadow: 0 10px 28px rgba(239,68,68,0.10);
}

.option.wrong .option-letter {
    background: #ef4444;
    color: white;
}

.option:disabled {
    cursor: default;
}

/* =========================
   EXPLANATION
========================= */

.explanation {
    display: none;
    margin-top: 25px;

    padding: 20px;

    border-radius: 18px;

    background: rgba(245,247,255,0.82);
    border: 1px solid rgba(130,145,210,0.18);

    animation: explanationEnter 0.7s cubic-bezier(0.22,1,0.36,1);
}

.explanation.show {
    display: block;
}

@keyframes explanationEnter {
    from {
        opacity: 0;
        transform: translateY(18px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.explanation-title {
    font-family: "Kalpurush", "Noto Sans Bengali", sans-serif;
    font-size: 22px;
    font-weight: bold;
    margin-bottom: 10px;
    color: #4d5cad;
}

.explanation-text {
    font-family: "Kalpurush", "Noto Sans Bengali", sans-serif;
    font-size: 20px;
    line-height: 1.8;
    color: #364152;
}

/* =========================
   CONTROL BUTTONS
========================= */

.controls {
    display: flex;
    justify-content: space-between;
    gap: 12px;

    margin-top: 25px;
}

.control-btn {
    min-width: 145px;

    padding: 14px 20px;

    border: none;
    border-radius: 15px;

    background: rgba(255,255,255,0.78);

    color: #27334a;

    font-family: "Times New Roman", serif;
    font-size: 19px;
    font-weight: bold;

    cursor: pointer;

    box-shadow: 0 8px 25px rgba(40,50,80,0.09);

    transition:
        transform 0.3s cubic-bezier(0.22,1,0.36,1),
        box-shadow 0.3s ease;
}

.control-btn:hover {
    transform: translateY(-3px);
    box-shadow: 0 13px 30px rgba(40,50,80,0.13);
}

.control-btn:active {
    transform: scale(0.97);
}

.control-btn:disabled {
    opacity: 0.45;
    cursor: not-allowed;
    transform: none;
}

.next-btn {
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: white;
}

/* =========================
   RESULT
========================= */

.result {
    display: none;

    margin-top: 25px;
    padding: 30px;

    text-align: center;

    border-radius: 23px;

    background: rgba(255,255,255,0.75);
    box-shadow: 0 20px 50px rgba(40,50,80,0.10);

    animation: resultEnter 0.8s cubic-bezier(0.22,1,0.36,1);
}

.result.show {
    display: block;
}

@keyframes resultEnter {
    from {
        opacity: 0;
        transform: translateY(30px) scale(0.97);
    }

    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}

.result h2 {
    font-size: 30px;
    margin-bottom: 10px;
}

.result p {
    font-size: 20px;
    line-height: 1.6;
}

/* =========================
   FOOTER
========================= */

.footer {
    text-align: center;
    margin-top: 20px;
    padding: 15px;

    color: #718096;
    font-size: 17px;
}

/* =========================
   RESPONSIVE
========================= */

@media (max-width: 700px) {

    body {
        padding: 12px 9px;
    }

    .header {
        padding: 20px 14px;

    .header p {
        font-size: 18px;
    }

    .status-bar {

    .status-card {

    }

    .status-label {

    .status-value {
        font-size: 21px;
    }

    .question-card {
        padding: 20px 15px;
        border-radius: 21px;
    }

    .question {
        font-size: 21px;
    }

    .question-bangla {
        font-size: 18px;
    }

    .option {
        padding: 14px 12px;
        font-size: 19px;

    }

    .control-btn {
        width: 100%;
    }

    .explanation-text {
        font-size: 19px;
    }
}

<script>

/* =========================================================
   PART 11
   SUBJECT, PERSON & NUMBER
   INFINITE QUESTION GENERATOR
========================================================= */


/* =========================================================
   BASIC DATA
========================================================= */

const names = [
    "Firoz",
    "Fatiha",
    "Fatema",
    "Jui",
    "Ema",
    "Rupa",
    "Moksed",
    "Ferjousi",
    "Jannati",
    "Mini",
    "Miraz",
    "Mujahid",
    "Milon",
    "Hannan",
    "Joba",
    "Tanzila",
    "Rina",
    "Tania",
    "Taslima"
];

const pronouns = [
    "I",
    "we",
    "you",
    "he",
    "she",
    "it",
    "they"
];


/* =========================================================
   STATE
========================================================= */

let currentQuestion = null;

let questionNumber = 1;

let score = 0;

let attempted = 0;

let questionHistory = [];

let isTransitioning = false;


/* =========================================================
   RANDOM HELPERS
========================================================= */

function randomItem(array) {
    return array[Math.floor(Math.random() * array.length)];
}

function randomNumber(min, max) {
    return Math.floor(Math.random() * (max - min + 1)) + min;
}

function shuffle(array) {
    const arr = [...array];

    for (let i = arr.length - 1; i > 0; i--) {

        const j = Math.floor(Math.random() * (i + 1));

        [arr[i], arr[j]] = [arr[j], arr[i]];
    }

    return arr;
}


/* =========================================================
   PERSON INFORMATION
=========================================================

1st Person:
I / We

2nd Person:
You

3rd Person:
He / She / It / They
or any name/noun other than the speaker and listener
========================================================= */

function getPerson(subject) {

    const s = subject.toLowerCase();

    if (s === "i" || s === "we") {
        return "First Person";
    }

    if (s === "you") {
        return "Second Person";
    }

    return "Third Person";
}


/* =========================================================
   NUMBER INFORMATION
========================================================= */

function getNumber(subject) {

    const s = subject.toLowerCase();

    if (
        s === "we" ||
        s === "they"
    ) {
        return "Plural";
    }

    if (s === "i" || s === "you") {
        return s === "you" ? "Plural/Plural-form" : "Singular";
    }

    return "Singular";
}


/* =========================================================
   SUBJECT INFORMATION
========================================================= */

function subjectInfo(subject) {

    return {
        subject: subject,
        person: getPerson(subject),
        number: getNumber(subject)
    };
}


/* =========================================================
   PERSON QUESTIONS
========================================================= */

function generatePersonQuestion() {

    const subject = randomItem(pronouns);

    const correct = getPerson(subject);

    const options = shuffle([
        correct,
        "First Person",
        "Second Person",
        "Third Person"
    ]).filter((value, index, arr) => arr.indexOf(value) === index);

    while (options.length < 3) {
        const extra = randomItem([
            "First Person",
            "Second Person",
            "Third Person"
        ]);

        if (!options.includes(extra)) {
            options.push(extra);
        }
    }

    return {
        question: `What person is the subject "${subject}"?`,
        bangla: `("${subject}" কোন Person বা পুরুষ?)`,
        options: options.slice(0, 3),
        answer: correct,

        explanation:
            `"${subject}" হলো ${correct}। ` +
            `যে ব্যক্তি নিজে কথা বলে তাকে First Person বলা হয়; ` +
            `যার সঙ্গে কথা বলা হয় তাকে Second Person বলা হয়; ` +
            `আর যার সম্পর্কে কথা বলা হয় তাকে Third Person বলা হয়। ` +
            `"${subject}"-এর ক্ষেত্রে এই নিয়ম অনুযায়ী সঠিক উত্তর হলো ${correct}।`
    };
}


/* =========================================================
   NUMBER QUESTIONS
========================================================= */

function generateNumberQuestion() {

    const subjects = [
        "I",
        "we",
        "you",
        "he",
        "she",
        "it",
        "they"
    ];

    const subject = randomItem(subjects);

    let correct;

    if (subject === "I") {
        correct = "Singular";
    }
    else if (subject === "you") {
        correct = "Plural-form";
    }
    else if (
        subject === "we" ||
        subject === "they"
    ) {
        correct = "Plural";
    }
    else {
        correct = "Singular";
    }

    const options = shuffle([
        "Singular",
        "Plural",
        "Plural-form"
    ]);

    return {
        question: `What is the number of the subject "${subject}"?`,
        bangla: `("${subject}" Singular না Plural?)`,
        options: options,
        answer: correct,

        explanation:
            `"${subject}"-এর Number হলো ${correct}। ` +
            `I এবং সাধারণ Third Person singular pronoun যেমন he, she, it — Singular হিসেবে ব্যবহৃত হয়। ` +
            `We এবং they — Plural। ` +
            `You-এর verb form সাধারণত plural-এর মতো হয়, যদিও এটি একজন বা একাধিক ব্যক্তিকে বোঝাতে পারে।`
    };
}


/* =========================================================
   SUBJECT IDENTIFICATION
========================================================= */

function generateSubjectQuestion() {

    const name = randomItem(names);

    const sentenceData = [
        {
            sentence: `${name} reads English every day.`,
            answer: name,
            bangla: `${name} প্রতিদিন ইংরেজি পড়ে।`
        },

        {
            sentence: `${name} helps Firoz.`,
            answer: name,
            bangla: `${name} ফিরোজকে সাহায্য করে।`
        },

        {
            sentence: `${name} writes a letter.`,
            answer: name,
            bangla: `${name} একটি চিঠি লেখে।`
        },

        {
            sentence: `${name} plays football.`,
            answer: name,
            bangla: `${name} ফুটবল খেলে।`
        },

        {
            sentence: `${name} learns grammar.`,
            answer: name,
            bangla: `${name} Grammar শেখে।`
        }
    ];

    const data = randomItem(sentenceData);

    const distractors = shuffle(
        names.filter(n => n !== name)
    ).slice(0, 3);

    const options = shuffle([
        data.answer,
        ...distractors
    ]);

    return {
        question: `Who is the subject in the sentence: "${data.sentence}"?`,
        bangla: `("${data.bangla}" বাক্যে Subject কে?)`,
        options: options,
        answer: data.answer,

        explanation:
            `"${data.sentence}" বাক্যে "${data.answer}" হলো Subject। ` +
            `কারণ কাজটি কে করছে—এই প্রশ্ন করলে উত্তর পাওয়া যায় "${data.answer}"। ` +
            `Subject সাধারণত বাক্যে কাজের কর্তা বা যার সম্পর্কে কিছু বলা হচ্ছে তাকে বোঝায়।`
    };
}


/* =========================================================
   PRONOUN SUBJECT QUESTION
========================================================= */

function generatePronounSubjectQuestion() {

    const data = randomItem([
        {
            sentence: "I read English.",
            answer: "I",
            bangla: "আমি ইংরেজি পড়ি।"
        },
        {
            sentence: "We learn grammar.",
            answer: "We",
            bangla: "আমরা Grammar শিখি।"
        },
        {
            sentence: "You speak English.",
            answer: "You",
            bangla: "তুমি/আপনি ইংরেজি বলো/বলেন।"
        },
        {
            sentence: "He reads a book.",
            answer: "He",
            bangla: "সে একটি বই পড়ে।"
        },
        {
            sentence: "She writes a letter.",
            answer: "She",
            bangla: "সে একটি চিঠি লেখে।"
        },
        {
            sentence: "They play football.",
            answer: "They",
            bangla: "তারা ফুটবল খেলে।"
        },
        {
            sentence: "It looks beautiful.",
            answer: "It",
            bangla: "এটি সুন্দর দেখায়।"
        }
    ]);

    const options = shuffle([
        data.answer,
        ...pronouns.filter(p => p !== data.answer).slice(0, 3)
    ]);

    return {
        question: `Which word is the subject in: "${data.sentence}"?`,
        bangla: `("${data.bangla}" বাক্যে Subject কোন শব্দটি?)`,
        options: options,
        answer: data.answer,

        explanation:
            `"${data.sentence}" বাক্যে "${data.answer}" Subject। ` +
            `কারণ "${data.answer}"-ই বাক্যের কাজটি করছে অথবা বাক্যের মূল কর্তা হিসেবে ব্যবহৃত হয়েছে।`
    };
}


/* =========================================================
   SUBJECT PERSON + NUMBER
========================================================= */

function generatePersonNumberQuestion() {

    const subject = randomItem([
        "I",
        "we",
        "you",
        "he",
        "she",
        "it",
        "they"
    ]);

    const person = getPerson(subject);

    let number;

    if (subject === "I") {
        number = "Singular";
    }
    else if (subject === "you") {
        number = "Plural-form";
    }
    else if (subject === "we" || subject === "they") {
        number = "Plural";
    }
    else {
        number = "Singular";
    }

    const correct = `${person} — ${number}`;

    const all = [
        "First Person — Singular",
        "First Person — Plural",
        "Second Person — Plural-form",
        "Third Person — Singular",
        "Third Person — Plural"
    ];

    const options = shuffle([
        correct,
        ...all.filter(x => x !== correct)
    ]).slice(0, 4);

    return {
        question: `What are the Person and Number of "${subject}"?`,
        bangla: `("${subject}" কোন Person এবং Number?)`,
        options: options,
        answer: correct,

        explanation:
            `"${subject}" হলো ${person} এবং এর Number হলো ${number}। ` +
            `First Person হলো বক্তা, Second Person হলো যাকে উদ্দেশ্য করে কথা বলা হয়, ` +
            `আর Third Person হলো যার সম্পর্কে কথা বলা হয়। ` +
            `Number দিয়ে Singular বা Plural বোঝানো হয়।`
    };
}


/* =========================================================
   NAME PERSON QUESTION
========================================================= */

function generateNamePersonQuestion() {

    const name = randomItem(names);

    return {
        question: `What person is "${name}" in a sentence when "${name}" is being talked about?`,
        bangla: `যখন "${name}" সম্পর্কে কথা বলা হয়, তখন "${name}" কোন Person?`,
        options: shuffle([
            "First Person",
            "Second Person",
            "Third Person"
        ]),
        answer: "Third Person",

        explanation:
            `"${name}" একটি ব্যক্তির নাম। যখন "${name}" নিজের হয়ে কথা বলছে না এবং তার সম্পর্কে কথা বলা হচ্ছে, তখন "${name}" Third Person। ` +
            `নাম সাধারণত Third Person হিসেবে ব্যবহৃত হয়।`
    };
}


/* =========================================================
   PERSON RULE QUESTION
========================================================= */

function generateRuleQuestion() {

    const rules = [
        {
            question: "Which person is used for the speaker?",
            bangla: "যে ব্যক্তি নিজে কথা বলে, তার জন্য কোন Person ব্যবহৃত হয়?",
            answer: "First Person",
            explanation:
                "যে ব্যক্তি নিজে কথা বলে, তাকে First Person বলা হয়। I এবং We হলো First Person-এর প্রধান pronoun।"
        },

        {
            question: "Which person is used for the listener?",
            bangla: "যার সঙ্গে কথা বলা হয়, তার জন্য কোন Person ব্যবহৃত হয়?",
            answer: "Second Person",
            explanation:
                "যাকে উদ্দেশ্য করে কথা বলা হয়, সে Second Person। You হলো Second Person-এর প্রধান pronoun।"
        },

        {
            question: "Which person is used for a person or thing being talked about?",
            bangla: "যার বা যে জিনিসের সম্পর্কে কথা বলা হয়, তার জন্য কোন Person ব্যবহৃত হয়?",
            answer: "Third Person",
            explanation:
                "যার সম্পর্কে কথা বলা হয়, সে Third Person। He, She, It এবং They Third Person-এর pronoun।"
        }
    ];

    const data = randomItem(rules);

    return {
        question: data.question,
        bangla: `(${data.bangla})`,
        options: shuffle([
            data.answer,
            "First Person",
            "Second Person",
            "Third Person"
        ]).filter((v, i, a) => a.indexOf(v) === i),
        answer: data.answer,
        explanation: data.explanation
    };
}


/* =========================================================
   MIXED SENTENCE PERSON QUESTION
========================================================= */

function generateSentencePersonQuestion() {

    const data = randomItem([
        {
            sentence: "I study English.",
            subject: "I",
            person: "First Person",
            bangla: "আমি ইংরেজি পড়ি।"
        },

        {
            sentence: "We study grammar.",
            subject: "We",
            person: "First Person",
            bangla: "আমরা Grammar পড়ি।"
        },

        {
            sentence: "You read the book.",
            subject: "You",
            person: "Second Person",
            bangla: "তুমি/আপনি বইটি পড়ো/পড়েন।"
        },

        {
            sentence: "Firoz studies English.",
            subject: "Firoz",
            person: "Third Person",
            bangla: "ফিরোজ ইংরেজি পড়ে।"
        },

        {
            sentence: "They play football.",
            subject: "They",
            person: "Third Person",
            bangla: "তারা ফুটবল খেলে।"
        }
    ]);

    return {
        question: `What person is the subject in "${data.sentence}"?`,
        bangla: `("${data.bangla}" বাক্যের Subject কোন Person?)`,
        options: shuffle([
            "First Person",
            "Second Person",
            "Third Person"
        ]),
        answer: data.person,

        explanation:
            `"${data.sentence}" বাক্যে Subject হলো "${data.subject}"। ` +
            `এই Subject ${data.person}। ` +
            `নিজে কথা বললে First Person, শ্রোতা হলে Second Person এবং যার সম্পর্কে কথা বলা হয় সে Third Person।`
    };
}


/* =========================================================
   MASTER QUESTION GENERATOR
========================================================= */

function generateQuestion() {

    const generators = [
        generatePersonQuestion,
        generateNumberQuestion,
        generateSubjectQuestion,
        generatePronounSubjectQuestion,
        generatePersonNumberQuestion,
        generateNamePersonQuestion,
        generateRuleQuestion,
        generateSentencePersonQuestion
    ];

    const generator = randomItem(generators);

    return generator();
}


/* =========================================================
   DISPLAY QUESTION
========================================================= */

function displayQuestion(question, direction = "next") {

    currentQuestion = question;

    const content = document.getElementById("questionContent");

    content.classList.remove("enter", "exit");

    void content.offsetWidth;

    content.classList.add("enter");

    document.getElementById("questionNumber").textContent =
        `Question ${questionNumber}`;

    document.getElementById("questionText").textContent =
        question.question;

    document.getElementById("questionBangla").textContent =
        question.bangla;

    const optionsContainer =
        document.getElementById("optionsContainer");

    optionsContainer.innerHTML = "";

    question.options.forEach((option, index) => {

        const button = document.createElement("button");

        button.className = "option";

        button.dataset.value = option;

        const letter = document.createElement("span");

        letter.className = "option-letter";

        letter.textContent =
            String.fromCharCode(65 + index);

        const text = document.createElement("span");

        text.textContent = option;

        button.appendChild(letter);
        button.appendChild(text);

        button.addEventListener(
            "click",
            () => selectAnswer(button, option)
        );

        optionsContainer.appendChild(button);
    });

    document.getElementById("explanation").classList.remove("show");

    document.getElementById("explanationText").textContent = "";

    updateStatus();

    document.getElementById("previousBtn").disabled =
        questionHistory.length === 0;
}


/* =========================================================
   ANSWER CHECK
========================================================= */

function selectAnswer(button, selected) {

    if (isTransitioning) return;

    const allOptions =
        document.querySelectorAll(".option");

    allOptions.forEach(option => {
        option.disabled = true;
    });

    attempted++;

    const isCorrect =
        selected === currentQuestion.answer;

    if (isCorrect) {

        score++;

        button.classList.add("correct");

    } else {

        button.classList.add("wrong");

        allOptions.forEach(option => {

            if (
                option.dataset.value ===
                currentQuestion.answer
            ) {
                option.classList.add("correct");
            }

        });
    }

    document.getElementById("explanationText").textContent =
        currentQuestion.explanation;

    document.getElementById("explanation")
        .classList.add("show");

    updateStatus();
}


/* =========================================================
   NEXT QUESTION
========================================================= */

function nextQuestion() {

    if (isTransitioning) return;

    isTransitioning = true;

    const content =
        document.getElementById("questionContent");

    content.classList.remove("enter");

    content.classList.add("exit");

    setTimeout(() => {

        questionHistory.push(currentQuestion);

        questionNumber++;

        const newQuestion =
            generateQuestion();

        displayQuestion(newQuestion, "next");

        updateProgress();

        setTimeout(() => {
            isTransitioning = false;
        }, 850);

    }, 420);
}


/* =========================================================
   PREVIOUS QUESTION
========================================================= */

function previousQuestion() {

    if (isTransitioning) return;

    if (questionHistory.length === 0) return;

    isTransitioning = true;

    const content =
        document.getElementById("questionContent");

    content.classList.remove("enter");

    content.classList.add("exit");

    setTimeout(() => {

        const previous =
            questionHistory.pop();

        questionNumber--;

        displayQuestion(previous, "previous");

        updateProgress();

        setTimeout(() => {
            isTransitioning = false;
        }, 850);

    }, 420);
}


/* =========================================================
   STATUS
========================================================= */

function updateStatus() {

    document.getElementById("questionCounter").textContent =
        questionNumber;

    document.getElementById("scoreCounter").textContent =
        score;

    const accuracy =
        attempted === 0
            ? 0
            : Math.round((score / attempted) * 100);

    document.getElementById("accuracyCounter").textContent =
        `${accuracy}%`;
}


/* =========================================================
   PROGRESS
========================================================= */

function updateProgress() {

    /*
       This is an infinite system.
       The progress bar therefore represents
       the current practice cycle rather than
       a fixed total number of questions.
    */

    const cycleSize = 20;

    const position =
        ((questionNumber - 1) % cycleSize) + 1;

    const percentage =
        (position / cycleSize) * 100;

    document.getElementById("progressBar").style.width =
        `${percentage}%`;
}


/* =========================================================
   RESTART
========================================================= */

function restartPractice() {

    questionNumber = 1;
    score = 0;
    attempted = 0;
    questionHistory = [];

    document.getElementById("resultBox")
        .classList.remove("show");

    displayQuestion(generateQuestion());

    updateProgress();
}


/* =========================================================
   KEYBOARD CONTROL
========================================================= */

document.addEventListener("keydown", function(event) {

    if (event.key === "ArrowRight") {
        nextQuestion();
    }

    if (event.key === "ArrowLeft") {
        previousQuestion();
    }

});


/* =========================================================
   INITIAL LOAD
========================================================= */

displayQuestion(generateQuestion());

updateProgress();

updateStatus();

</script>
