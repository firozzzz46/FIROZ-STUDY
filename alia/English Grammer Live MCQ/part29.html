
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PART 29 - Infinity MCQ Practice</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap');

:root {
  --primary: #5267df;
  --primary-dark: #3949ab;
  --green: #15803d;
  --red: #dc2626;
  --text: #202943;
  --muted: #64748b;
  --border: rgba(148,163,184,.24);
}

* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  padding: 24px 15px 40px;
  color: var(--text);
  font-family: "Times New Roman", "Kalpurush", serif;
  font-size: 19px;
  background:
    radial-gradient(ellipse at 10% 0%, #e7edff 0%, transparent 40%),
    radial-gradient(ellipse at 100% 80%, #e3f6f1 0%, transparent 38%),
    linear-gradient(135deg, #ffffff, #f4f6fb);
}

button { font: inherit; }

.container {
  width: min(850px, 100%);
  margin: auto;
}

.header {
  text-align: center;
  padding: 22px 12px 28px;
  animation: enterDown .8s cubic-bezier(.16,1,.3,1) both;
}

.badge {
  display: inline-block;
  padding: 7px 15px;
  border-radius: 50px;
  color: #3949ab;
  background: #e8edff;
  font: 600 14px Arial, sans-serif;
  letter-spacing: 1px;
}

h1 {
  font-size: clamp(27px, 5vw, 42px);
  margin: 17px 0 8px;
  line-height: 1.2;
}

.subtitle {
  color: var(--muted);
  font-size: 19px;
  margin: 0;
}

.glass {
  background: rgba(255,255,255,.79);
  border: 1px solid rgba(255,255,255,.9);
  box-shadow: 0 15px 45px rgba(42,58,110,.09);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
  border-radius: 24px;
}

.stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
  margin-bottom: 17px;
  animation: enterUp .8s cubic-bezier(.16,1,.3,1) both;
}

.stat {
  padding: 17px 8px;
  text-align: center;
}

.stat-label {
  color: var(--muted);
  font: 13px Arial, sans-serif;
  margin-bottom: 8px;
}

.stat-value {
  font-size: 27px;
  font-weight: bold;
  color: var(--primary-dark);
}

.progress-wrap {
  height: 7px;
  overflow: hidden;
  border-radius: 20px;
  background: #e6eaf2;
  margin-bottom: 20px;
}

.progress-bar {
  height: 100%;
  width: 0;
  border-radius: inherit;
  background: linear-gradient(90deg, #5267df, #8b5cf6);
  transition: width .65s cubic-bezier(.16,1,.3,1);
}

.quiz-card {
  padding: clamp(19px, 4vw, 34px);
  overflow: hidden;
}

.question-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
  margin-bottom: 22px;
}

.question-number, .topic-tag {
  font: 600 13px Arial, sans-serif;
  border-radius: 30px;
  padding: 8px 12px;
  background: #edf0ff;
  color: #4658bf;
}

.topic-tag {
  background: #edf8f1;
  color: #187341;
}

#questionStage {
  opacity: 1;
  transform: translateX(0);
  transition:
    opacity .45s ease,
    transform .65s cubic-bezier(.16,1,.3,1);
}

#questionStage.leaving {
  opacity: 0;
  transform: translateX(-18px);
}

#questionStage.entering {
  animation: questionEnter .85s cubic-bezier(.16,1,.3,1) both;
}

.question {
  font-size: clamp(21px, 3vw, 25px);
  line-height: 1.55;
  font-weight: bold;
  margin: 0 0 10px;
  overflow-wrap: anywhere;
}

.question-hint {
  color: #53627b;
  font-family: "Hind Siliguri", "Kalpurush", sans-serif;
  font-size: 18px;
  line-height: 1.7;
  margin: 0 0 24px;
}

.options {
  display: grid;
  gap: 12px;
}

.option {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 13px;
  text-align: left;
  color: var(--text);
  background: rgba(255,255,255,.83);
  border: 1.5px solid #e0e5ef;
  border-radius: 15px;
  padding: 15px 16px;
  min-height: 60px;
  cursor: pointer;
  transition:
    background .25s ease,
    border-color .25s ease,
    transform .3s cubic-bezier(.16,1,.3,1),
    box-shadow .3s ease;
}

.option:hover:not(:disabled) {
  transform: translateY(-2px);
  border-color: #929ff0;
  box-shadow: 0 7px 20px #5267df12;
}

.option:focus-visible, .btn:focus-visible {
  outline: 3px solid #9aa8ff;
  outline-offset: 3px;
}

.letter {
  width: 34px;
  height: 34px;
  flex: 0 0 34px;
  display: grid;
  place-items: center;
  border-radius: 10px;
  background: #eef1f8;
  color: #4b5871;
  font: bold 15px Arial, sans-serif;
}

.option.correct {
  background: #ecfdf3;
  border-color: #35a568;
  color: #166534;
}

.option.correct .letter {
  background: #15803d;
  color: white;
}

.option.wrong {
  background: #fff1f2;
  border-color: #f87171;
  color: #991b1b;
}

.option.wrong .letter {
  background: #dc2626;
  color: white;
}

.option:disabled { cursor: default; }

.feedback {
  margin-top: 23px;
  padding: 19px;
  border-radius: 16px;
  background: #f0f4ff;
  border: 1px solid #dce4ff;
  animation: enterUp .5s ease both;
}

.feedback[hidden] { display: none; }

.feedback-title {
  font-weight: bold;
  font-size: 21px;
  margin-bottom: 10px;
}

.feedback-title.good { color: var(--green); }
.feedback-title.bad { color: var(--red); }

.explanation {
  font-family: "Hind Siliguri", "Kalpurush", sans-serif;
  font-size: 18px;
  line-height: 1.85;
  white-space: pre-line;
  overflow-wrap: anywhere;
}

.rule-box {
  margin-top: 13px;
  padding: 12px 14px;
  border-left: 4px solid var(--primary);
  border-radius: 8px;
  background: #ffffffbd;
  font-family: "Hind Siliguri", "Kalpurush", sans-serif;
  font-size: 17px;
  line-height: 1.8;
}

.controls {
  display: flex;
  gap: 12px;
  margin-top: 24px;
}

.btn {
  border: 0;
  border-radius: 13px;
  padding: 13px 20px;
  font-weight: bold;
  cursor: pointer;
  transition: transform .25s ease, filter .25s ease;
}

.btn:hover:not(:disabled) {
  transform: translateY(-2px);
  filter: brightness(.97);
}

.btn:disabled {
  opacity: .4;
  cursor: not-allowed;
}

.primary {
  color: white;
  background: linear-gradient(135deg, #5267df, #6d55db);
  box-shadow: 0 6px 18px #5267df30;
}

.secondary {
  color: #3d4c68;
  background: #edf0f6;
}

#nextBtn { margin-left: auto; }

.footer {
  text-align: center;
  margin-top: 24px;
  color: #778198;
  font: 13px Arial, sans-serif;
}

@keyframes enterDown {
  from { opacity: 0; transform: translateY(-22px); }
  to { opacity: 1; transform: translateY(0); }
}

@keyframes enterUp {
  from { opacity: 0; transform: translateY(18px); }
  to { opacity: 1; transform: translateY(0); }
}

@keyframes questionEnter {
  from { opacity: 0; transform: translateY(20px) translateX(8px); }
  to { opacity: 1; transform: translateY(0) translateX(0); }
}

@media (max-width: 520px) {
  body { padding: 12px 10px 25px; }
  .header { padding: 20px 5px 23px; }
  .stats { gap: 7px; }
  .stat { padding: 13px 5px; }
  .stat-value { font-size: 23px; }
  .quiz-card { border-radius: 19px; }
  .option { padding: 12px; gap: 10px; }
  .controls { gap: 8px; }
  .btn { padding: 12px 15px; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .01ms !important;
    transition-duration: .01ms !important;
    scroll-behavior: auto !important;
  }
}
</style>
</head>

<body>
<div class="container">

  <header class="header">
    <span class="badge">INFINITY MCQ SYSTEM</span>
    <h1>PART 29 - Special Uses of Words &amp; Phrases</h1>
    <p class="subtitle">Learn • Practice • Understand • Improve</p>
  </header>

  <section class="stats">
    <div class="glass stat">
      <div class="stat-label">Question</div>
      <div class="stat-value" id="questionCount">1</div>
    </div>
    <div class="glass stat">
      <div class="stat-label">Correct</div>
      <div class="stat-value" id="correctCount">0</div>
    </div>
    <div class="glass stat">
      <div class="stat-label">Accuracy</div>
      <div class="stat-value" id="accuracy">0%</div>
    </div>
  </section>

  <div class="progress-wrap" aria-label="Session progress">
    <div class="progress-bar" id="progressBar"></div>
  </div>

  <main class="glass quiz-card">
    <div id="questionStage">
      <div class="question-top">
        <span class="question-number" id="questionLabel">QUESTION 1</span>
        <span class="topic-tag" id="topicTag">Grammar Practice</span>
      </div>

      <h2 class="question" id="questionText"></h2>
      <p class="question-hint" id="questionHint"></p>

      <div class="options" id="options" aria-label="Answer options"></div>

      <section class="feedback" id="feedback" hidden aria-live="polite">
        <div class="feedback-title" id="feedbackTitle"></div>
        <div class="explanation" id="explanation"></div>
        <div class="rule-box" id="ruleBox"></div>
      </section>
    </div>

    <div class="controls">
      <button class="btn secondary" id="prevBtn" disabled>← Previous</button>
      <button class="btn secondary" id="newBtn">New Question</button>
      <button class="btn primary" id="nextBtn">Next →</button>
    </div>
  </main>

  <footer class="footer">
    PART 29 • INFINITY PRACTICE • Keep Learning
  </footer>
</div>

<script>
"use strict";

/* =========================================
   PART 29: QUESTION GENERATOR ENGINE
   Add more templates to expand the question bank.
========================================= */

const names = [
  "Firoz", "Fatiha", "Fatema", "Jui", "Ema", "Rupa",
  "Moksed", "Ferjousi", "Jannati", "Mini", "Miraz",
  "Mujahid", "Milon", "Hannan", "Joba", "Tanzila",
  "Rina", "Tania", "Taslima"
];

const templates = [

{
 topic: "Used to",
 make(n) {
  return {
   q: `${n} ______ live in this village when he was young.`,
   hint: "(বাক্যটি অতীতের অভ্যাস বোঝাচ্ছে। সঠিক phrase বেছে নিন।)",
   options: ["used to", "is used to", "use to", "was use to"],
   answer: "used to",
   explanation: "সঠিক উত্তর: used to। এখানে অতীতে নিয়মিত গ্রামে বসবাস করার অভ্যাস বোঝানো হয়েছে। সেই অভ্যাস এখন আর আছে কি না, তা বাক্যে বলা হয়নি।\n\nUsed to-এর পরে verb-এর মূল রূপ (V1) বসে। তাই live সঠিক।",
   rule: "Structure: Subject + used to + V1"
  };
 }
},

{
 topic: "Be used to",
 make(n) {
  return {
   q: `${n} is accustomed to ______ early in the morning.`,
   hint: "(এখানে কোনো কাজে অভ্যস্ত হওয়া বোঝানো হয়েছে।)",
   options: ["wake up", "waking up", "woke up", "to wake up"],
   answer: "waking up",
   explanation: "সঠিক উত্তর: waking up। Be used to অর্থ কোনো কাজে অভ্যস্ত হওয়া। এই ব্যবহারে to হলো preposition; তাই এর পরে noun অথবা verb-এর -ing form বসে।\n\nএখানে is accustomed to waking up অর্থ সকালে তাড়াতাড়ি ঘুম থেকে ওঠায় অভ্যস্ত।",
   rule: "Structure: am/is/are + used to + V-ing / noun"
  };
 }
},

{
 topic: "Would rather",
 make(n) {
  return {
   q: `${n} would rather ______ at home than go outside.`,
   hint: "(দুটি কাজের মধ্যে একটি বেশি পছন্দ করা বোঝানো হয়েছে।)",
   options: ["staying", "to stay", "stay", "stayed"],
   answer: "stay",
   explanation: "সঠিক উত্তর: stay। Would rather-এর পরে verb-এর মূল রূপ বসে। এখানে বাড়িতে থাকা এবং বাইরে যাওয়ার মধ্যে বাড়িতে থাকাকে বেশি পছন্দ করার কথা বলা হয়েছে।\n\nThan-এর পরে go-ও মূল রূপে আছে।",
   rule: "Structure: would rather + V1 + than + V1"
  };
 }
},

{
 topic: "Had better",
 make(n) {
  return {
   q: `${n} had better ______ harder for the examination.`,
   hint: "(পরামর্শ দেওয়ার জন্য ব্যবহৃত phrase-এর সঠিক রূপ বেছে নিন।)",
   options: ["studies", "studying", "study", "to study"],
   answer: "study",
   explanation: "সঠিক উত্তর: study। Had better-এর পরে verb-এর মূল রূপ বসে। এটি পরামর্শ বা প্রয়োজনীয় সতর্কতা বোঝাতে ব্যবহৃত হয়।\n\nHad better to study ভুল, কারণ এই গঠনে to বসে না।",
   rule: "Structure: Subject + had better + V1"
  };
 }
},

{
 topic: "No sooner",
 make(n) {
  return {
   q: `No sooner ______ ${n} arrived than the class began.`,
   hint: "(No sooner-এর বাক্যে সঠিক auxiliary verb বেছে নিন।)",
   options: ["did", "has", "had", "was"],
   answer: "had",
   explanation: "সঠিক উত্তর: had। No sooner-এর সঙ্গে past perfect-এর inversion ব্যবহার করা হয়। No sooner বাক্যের শুরুতে থাকায় auxiliary verb subject-এর আগে বসে।\n\nএখানে arrived হলো V3-এর রূপ, তাই had arrived সঠিক।",
   rule: "Structure: No sooner + had + subject + V3 + than + past simple"
  };
 }
},

{
 topic: "Hardly",
 make(n) {
  return {
   q: `Hardly had ${n} reached the station ______ the train left.`,
   hint: "(Hardly-এর সঙ্গে উপযুক্ত conjunction বেছে নিন।)",
   options: ["than", "when", "then", "while"],
   answer: "when",
   explanation: "সঠিক উত্তর: when। Hardly ... when দিয়ে একটি কাজের ঠিক পরপর অন্য কাজ ঘটে যাওয়া বোঝানো হয়।\n\nThan সাধারণত No sooner-এর সঙ্গে ব্যবহৃত হয়।",
   rule: "Structure: Hardly/Scarcely + had + subject + V3 + when/before + past simple"
  };
 }
},

{
 topic: "Too ... to",
 make(n) {
  return {
   q: `The box is too heavy for ${n} ______.`,
   hint: "(Too ... to গঠনটি সম্পূর্ণ করুন।)",
   options: ["lift", "lifting", "lifted", "lifts"],
   answer: "lift",
   explanation: "সঠিক উত্তর: lift। Too ... to গঠন কোনো কাজ করার ক্ষেত্রে অতিরিক্ত মাত্রা বা বাধা বোঝাতে ব্যবহৃত হয়।\n\nঅর্থ: বাক্সটি এত ভারী যে Firoz-এর পক্ষে এটি তোলা সম্ভব নয়। For-এর পরে object থাকলেও to-এর পরে verb-এর মূল রূপ হয়।",
   rule: "Structure: too + adjective + (for + object) + to + V1"
  };
 }
},

{
 topic: "Enough to",
 make(n) {
  return {
   q: `${n} is strong enough ______ the bag.`,
   hint: "(Enough-এর সঙ্গে সঠিক infinitive বেছে নিন।)",
   options: ["carry", "carrying", "to carry", "carried"],
   answer: "to carry",
   explanation: "সঠিক উত্তর: to carry। Enough adjective-এর পরে বসলে তার সঙ্গে to + verb ব্যবহার করে কোনো কাজ করার যথেষ্ট সামর্থ্য বোঝানো যায়।\n\nStrong enough to carry অর্থ ব্যাগটি বহন করার মতো যথেষ্ট শক্তিশালী।",
   rule: "Structure: adjective + enough + to + V1"
  };
 }
},

{
 topic: "So ... that",
 make(n) {
  return {
   q: `${n} was so tired ______ he could not continue working.`,
   hint: "(ফলাফল বোঝানোর conjunction বেছে নিন।)",
   options: ["because", "that", "although", "unless"],
   answer: "that",
   explanation: "সঠিক উত্তর: that। So ... that দিয়ে কোনো অবস্থা বা মাত্রার ফলাফল বোঝানো হয়।\n\nএখানে খুব ক্লান্ত হওয়ার ফল হলো কাজ চালিয়ে যেতে না পারা।",
   rule: "Structure: so + adjective/adverb + that + clause"
  };
 }
},

{
 topic: "Such ... that",
 make(n) {
  return {
   q: `It was such ______ interesting book that ${n} read it twice.`,
   hint: "(Such-এর পরে article ও adjective-এর সঠিক ক্রম বেছে নিন।)",
   options: ["a", "an", "the", "no article"],
   answer: "an",
   explanation: "সঠিক উত্তর: an। Singular countable noun-এর আগে such + a/an + adjective + noun + that গঠন ব্যবহৃত হয়।\n\nInteresting শব্দটি vowel sound দিয়ে শুরু হওয়ায় an বসে।",
   rule: "Structure: such + a/an + adjective + singular countable noun + that"
  };
 }
},

{
 topic: "Lest",
 make(n) {
  return {
   q: `${n} studied carefully lest he ______ make a mistake.`,
   hint: "(Lest-এর পরে প্রচলিত grammar rule অনুযায়ী সঠিক রূপ বেছে নিন।)",
   options: ["should", "will", "has", "is"],
   answer: "should",
   explanation: "সঠিক উত্তর: should। Lest অর্থ পাছে বা যাতে কোনো অনাকাঙ্ক্ষিত ঘটনা না ঘটে। প্রচলিত পরীক্ষামুখী গঠনে lest-এর পরে subject + should + V1 ব্যবহৃত হয়।\n\nShould make এখানে সঠিক।",
   rule: "Common exam structure: lest + subject + should + V1"
  };
 }
},

{
 topic: "As if",
 make(n) {
  return {
   q: `${n} talks as if he ______ everything.`,
   hint: "(অবাস্তব বা কল্পিত ধারণা বোঝানো হয়েছে।)",
   options: ["knows", "knew", "will know", "has know"],
   answer: "knew",

   hint: "(কোনো কাজ চালিয়ে যাওয়া বোঝানোর phrasal verb বেছে নিন।)",
   options: ["away", "on", "out", "over"],
   answer: "on",
   explanation: "সঠিক উত্তর: on। Carry on অর্থ চালিয়ে যাওয়া। Carry on reading অর্থ পড়া চালিয়ে যাওয়া।\n\nএখানে despite the noise বোঝায় শব্দ থাকা সত্ত্বেও সে পড়া বন্ধ করেনি।",
   rule: "Carry on + V-ing = continue"
  };
 }
},

{
 topic: "Take part in",
 make(n) {
  return {
   q: `${n} took part ______ the debate competition.`,
   hint: "(অংশগ্রহণ করা বোঝানোর phrase-এর সঠিক preposition বেছে নিন।)",
   options: ["at", "on", "in", "for"],
   answer: "in",
   explanation: "সঠিক উত্তর: in। Take part in অর্থ কোনো প্রতিযোগিতা, অনুষ্ঠান বা কাজে অংশগ্রহণ করা।\n\nএখানে debate competition-এ অংশ নেওয়া বোঝানো হয়েছে।",
   rule: "Take part in = participate in"
  };
 }
},

{
 topic: "Make up one's mind",
 make(n) {
  return {
   q: `${n} has made up his ______ to study regularly.`,
   hint: "(সিদ্ধান্ত নেওয়া বোঝানোর phrase সম্পূর্ণ করুন।)",
   options: ["thought", "mind", "idea", "brain"],
   answer: "mind",
   explanation: "সঠিক উত্তর: mind। Make up one's mind অর্থ কোনো বিষয়ে সিদ্ধান্ত নেওয়া।\n\nHas made up his mind to study অর্থ সে নিয়মিত পড়াশোনা করার সিদ্ধান্ত নিয়েছে।",
   rule: "Make up one's mind = decide"
  };
 }
},

{
 topic: "At least",
 make(n) {
  return {
   q: `${n} may not win the prize, but he should ______ try.`,
   hint: "(ন্যূনতম বা অন্তত বোঝানোর phrase বেছে নিন।)",
   options: ["at last", "at once", "at least", "at times"],
   answer: "at least",
   explanation: "সঠিক উত্তর: at least। At least অর্থ অন্তত বা ন্যূনতম।\n\nAt last অর্থ অবশেষে, at once অর্থ সঙ্গে সঙ্গে এবং at times অর্থ মাঝে মাঝে।",
   rule: "At least = not less than; anyway, as a minimum"
  };
 }
},

{
 topic: "In case",
 make(n) {
  return {
   q: `${n} took an umbrella in case it ______.`,
   hint: "(সম্ভাব্য ঘটনা থেকে সতর্ক থাকার অর্থে সঠিক form বেছে নিন।)",
   options: ["rains", "rained", "will rain", "rain"],
   answer: "rained",
   explanation: "সঠিক উত্তর: rained। এই বাক্যে অতীতের ঘটনা বর্ণনা করা হয়েছে। তাই past simple rained স্বাভাবিকভাবে ব্যবহৃত হয়েছে।\n\nIn case অর্থ যদি এমন কিছু ঘটে বা ঘটতে পারে, সেই সম্ভাবনার জন্য প্রস্তুতি নেওয়া। বর্তমান বা ভবিষ্যৎ প্রসঙ্গে in case-এর পরে present simple-ও ব্যবহৃত হয়।",
   rule: "In case + suitable tense according to the time and context"
  };
 }
}

];

/* =========================================
   STATE
========================================= */

const $ = id => document.getElementById(id);

let questionNumber = 1;
let correctTotal = 0;
let answeredTotal = 0;
let currentQuestion = null;
let currentTemplateIndex = -1;
let lastTemplateIndex = -1;
let sessionHistory = [];
let busy = false;

const letters = ["A", "B", "C", "D"];

function randomItem(arr) {
  return arr[Math.floor(Math.random() * arr.length)];
}

function shuffle(arr) {
  const result = [...arr];

  for (let i = result.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [result[i], result[j]] = [result[j], result[i]];
  }

  return result;
}

/* Avoid repeating the same template immediately. */
function chooseTemplate() {
  if (templates.length === 1) return 0;

  let index;

  do {
    index = Math.floor(Math.random() * templates.length);
  } while (index === lastTemplateIndex);

  lastTemplateIndex = index;
  return index;
}

function createQuestion() {
  const index = chooseTemplate();
  const template = templates[index];
  const name = randomItem(names);
  const raw = template.make(name);

  return {
    ...raw,
    topic: template.topic,
    name,
    templateIndex: index
  };
}

function updateStats() {
  $("questionCount").textContent = questionNumber;
  $("correctCount").textContent = correctTotal;

  const percent = answeredTotal
    ? Math.round((correctTotal / answeredTotal) * 100)
    : 0;

  $("accuracy").textContent = percent + "%";

  /*
    This is session progress, not a claim that all
    possible generated questions have been completed.
  */
  $("progressBar").style.width =
    (answeredTotal ? Math.min(100, answeredTotal % 20 * 5) : 0) + "%";

  $("questionLabel").textContent =
    "QUESTION " + questionNumber;
}

function renderQuestion(q, animate = true) {
  currentQuestion = q;

  $("questionText").textContent = q.q;
  $("questionHint").textContent = q.hint;
  $("topicTag").textContent = q.topic;
  $("feedback").hidden = true;

  const optionsBox = $("options");
  optionsBox.replaceChildren();

  const shuffledOptions = shuffle(q.options);

  shuffledOptions.forEach((optionText, index) => {
    const button = document.createElement("button");
    button.type = "button";
    button.className = "option";

    const letter = document.createElement("span");
    letter.className = "letter";
    letter.textContent = letters[index];

    const text = document.createElement("span");
    text.textContent = optionText;

    button.append(letter, text);
    button.addEventListener("click", () => selectAnswer(button, optionText));
    optionsBox.appendChild(button);
  });

  $("prevBtn").disabled = sessionHistory.length === 0;
  $("nextBtn").textContent = "Next →";
  $("nextBtn").disabled = false;

  updateStats();

  const stage = $("questionStage");

  if (animate) {
    stage.classList.remove("leaving", "entering");
    void stage.offsetWidth;
    stage.classList.add("entering");
  }
}

function selectAnswer(button, selected) {
  if (busy || $("feedback").hidden === false) return;

  const q = currentQuestion;
  const isCorrect = selected === q.answer;

  answeredTotal++;

  if (isCorrect) {
    correctTotal++;
  }

  const allButtons = [...$("options").querySelectorAll(".option")];

  allButtons.forEach(btn => {
    const optionText = btn.lastElementChild.textContent;
    btn.disabled = true;

    if (optionText === q.answer) {
      btn.classList.add("correct");
    }

    if (btn === button && !isCorrect) {
      btn.classList.add("wrong");
    }
  });

  $("feedbackTitle").textContent = isCorrect
    ? "✓ Correct Answer!"
    : "✗ Incorrect Answer";

  $("feedbackTitle").className =
    "feedback-title " + (isCorrect ? "good" : "bad");

  $("explanation").textContent = q.explanation;
  $("ruleBox").textContent = "Grammar Rule: " + q.rule;
  $("feedback").hidden = false;

  updateStats();

  $("nextBtn").textContent = "Next →";
}

function goNext() {
  if (busy) return;

  busy = true;

  const stage = $("questionStage");
  stage.classList.remove("entering");
  stage.classList.add("leaving");

  window.setTimeout(() => {
    sessionHistory.push(currentQuestion);
    questionNumber++;

    const nextQuestion = createQuestion();
    renderQuestion(nextQuestion, true);

    busy = false;
  }, 420);
}

function goPrevious() {
  if (busy || sessionHistory.length === 0) return;

  busy = true;

  const stage = $("questionStage");
  stage.classList.remove("entering");
  stage.classList.add("leaving");

  window.setTimeout(() => {
    const previousQuestion = sessionHistory.pop();

    questionNumber = Math.max(1, questionNumber - 1);

    /*
      Previous restores the question for review.
      The score is not automatically reversed.
    */
    renderQuestion(previousQuestion, true);
    busy = false;
  }, 420);
}

function newQuestion() {
  if (busy) return;

  busy = true;

  const stage = $("questionStage");
  stage.classList.remove("entering");
  stage.classList.add("leaving");

  window.setTimeout(() => {
    sessionHistory.push(currentQuestion);
    questionNumber++;

    renderQuestion(createQuestion(), true);
    busy = false;
  }, 420);
}

$("nextBtn").addEventListener("click", goNext);
$("prevBtn").addEventListener("click", goPrevious);
$("newBtn").addEventListener("click", newQuestion);

/* Start the practice session. */
renderQuestion(createQuestion(), false);
</script>
