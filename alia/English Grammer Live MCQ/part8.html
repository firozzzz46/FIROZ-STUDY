<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Part 8 - Preposition | Infinity MCQ</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Kalpurush&display=swap');

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

:root{
    --text:#172033;
    --muted:#596579;
    --primary:#4f46e5;
    --success:#16803c;
    --danger:#d92d20;
    --border:rgba(255,255,255,.65);
}

body{
    min-height:100vh;
    font-family:"Times New Roman",serif;
    color:var(--text);
    background:
        radial-gradient(circle at 10% 10%,rgba(99,102,241,.10),transparent 30%),
        radial-gradient(circle at 90% 85%,rgba(14,165,233,.10),transparent 30%),
        linear-gradient(135deg,#ffffff,#f5f7fa,#ffffff);
    padding:24px;
}

.app{
    width:min(100%,1000px);
    margin:auto;
}

.glass{
    background:rgba(255,255,255,.68);
    border:1px solid var(--border);
    box-shadow:
        0 20px 60px rgba(31,41,55,.10),
        inset 0 1px 0 rgba(255,255,255,.9);
    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);
    border-radius:28px;
}

.header{
    padding:28px;
    text-align:center;
    margin-bottom:20px;
}

.header h1{
    font-size:clamp(28px,5vw,42px);
    margin-bottom:8px;
}

.header p{
    font-size:20px;
    color:var(--muted);
}

.stats{
    display:flex;
    justify-content:space-between;
    gap:15px;
    margin-bottom:20px;
}

.stat{
    flex:1;
    text-align:center;
    padding:17px;
}

.stat span{
    display:block;
    font-size:17px;
    color:var(--muted);
    margin-bottom:5px;
}

.stat strong{
    font-size:23px;
}

.progress-wrap{
    height:9px;
    background:rgba(0,0,0,.07);
    border-radius:20px;
    overflow:hidden;
    margin-bottom:22px;
}

.progress{
    height:100%;
    width:0%;
    background:linear-gradient(90deg,#6366f1,#06b6d4);
    border-radius:20px;
    transition:width 1s cubic-bezier(.22,1,.36,1);
}

.quiz-card{
    padding:30px;
    overflow:hidden;
}

.question-area{
    animation-duration:1.1s;
    animation-timing-function:cubic-bezier(.22,1,.36,1);
}

.question-number{
    font-size:18px;
    color:var(--primary);
    font-weight:bold;
    margin-bottom:12px;
}

.question{
    font-size:clamp(21px,3vw,27px);
    line-height:1.5;
    font-weight:bold;
    margin-bottom:5px;
}

.question-bn{
    font-family:"Kalpurush","Noto Sans Bengali",sans-serif;
    font-size:19px;
    color:var(--muted);
    margin-bottom:25px;
}

.options{
    display:grid;
    gap:14px;
}

.option{
    width:100%;
    padding:18px 20px;
    text-align:left;
    font:20px "Times New Roman",serif;
    border:1px solid rgba(79,70,229,.12);
    border-radius:18px;
    background:rgba(255,255,255,.72);
    cursor:pointer;
    transition:
        transform .35s cubic-bezier(.22,1,.36,1),
        box-shadow .35s ease,
        background .35s ease;
}

.option:hover:not(:disabled){
    transform:translateX(7px);
    box-shadow:0 10px 25px rgba(79,70,229,.12);
}

.option.correct{
    background:rgba(34,197,94,.14);
    border-color:rgba(22,128,60,.45);
    color:var(--success);
}

.option.wrong{
    background:rgba(239,68,68,.12);
    border-color:rgba(217,45,32,.4);
    color:var(--danger);
}

.option:disabled{
    cursor:default;
}

.explanation{
    margin-top:23px;
    padding:22px;
    border-radius:20px;
    background:rgba(79,70,229,.055);
    border-left:5px solid var(--primary);
    display:none;
}

.explanation.show{
    display:block;
    animation:explainIn .8s cubic-bezier(.22,1,.36,1);
}

.explanation h3{
    font-size:21px;
    margin-bottom:10px;
}

.explanation p{
    font-family:"Kalpurush","Noto Sans Bengali",sans-serif;
    font-size:19px;
    line-height:1.8;
}

.controls{
    display:flex;
    justify-content:space-between;
    gap:14px;
    margin-top:25px;
}

button.control{
    flex:1;
    padding:16px 20px;
    border:0;
    border-radius:17px;
    font:bold 19px "Times New Roman",serif;
    cursor:pointer;
    background:#fff;
    box-shadow:0 8px 25px rgba(0,0,0,.08);
    transition:.35s cubic-bezier(.22,1,.36,1);
}

button.control:hover{
    transform:translateY(-3px);
}

.next{
    color:white;
    background:linear-gradient(135deg,#4f46e5,#06b6d4)!important;
}

.shake{
    animation:shake .45s ease;
}

.slide-next{
    animation:slideNext 1.05s cubic-bezier(.22,1,.36,1);
}

.slide-prev{
    animation:slidePrev 1.05s cubic-bezier(.22,1,.36,1);
}

@keyframes slideNext{
    0%{opacity:0;transform:translateX(80px) scale(.97)}
    100%{opacity:1;transform:translateX(0) scale(1)}
}

@keyframes slidePrev{
    0%{opacity:0;transform:translateX(-80px) scale(.97)}
    100%{opacity:1;transform:translateX(0) scale(1)}
}

@keyframes explainIn{
    0%{opacity:0;transform:translateY(20px)}
    100%{opacity:1;transform:translateY(0)}
}

@keyframes shake{
    0%,100%{transform:translateX(0)}
    25%{transform:translateX(-7px)}
    75%{transform:translateX(7px)}
}

@media(max-width:600px){
    body{padding:12px}
    .header,.quiz-card{padding:20px}
    .stats{gap:8px}
    .stat{padding:12px 5px}
    .stat span{font-size:15px}
    .stat strong{font-size:19px}
    .option{font-size:19px;padding:16px}
    .controls{flex-direction:column}
}
</style>
</head>

<body>

<div class="app">

    <header class="header glass">
        <h1>PART 8 — PREPOSITION</h1>
        <p>Infinity MCQ Practice System</p>
    </header>

    <div class="stats">
        <div class="stat glass">
            <span>Question</span>
            <strong id="questionNo">1</strong>
        </div>

        <div class="stat glass">
            <span>Score</span>
            <strong id="score">0</strong>
        </div>

        <div class="stat glass">
            <span>Accuracy</span>
            <strong id="accuracy">0%</strong>
        </div>
    </div>

    <div class="progress-wrap">
        <div class="progress" id="progress"></div>
    </div>

    <main class="quiz-card glass">
        <div id="questionArea" class="question-area">

            <div class="question-number" id="questionLabel">
                Question 1
            </div>

            <div class="question" id="question">
                Loading...
            </div>

            <div class="question-bn" id="questionBn"></div>

            <div class="options" id="options"></div>

            <div class="explanation" id="explanation">
                <h3>Explanation</h3>
                <p id="explanationText"></p>
            </div>

        </div>

        <div class="controls">

                Previous
            </button>

            <button class="control next" id="nextBtn">
                Next
            </button>
        </div>
    </main>

</div>

<script>

/* =========================================================
   PART 8 — PREPOSITION
   SMART INFINITE QUESTION GENERATOR
========================================================= */

const names = [
    "Firoz","Fatiha","Fatema","Jui","Ema",
    "Rupa","Moksed","Ferjousi","Jannati","Mini",
    "Miraz","Mujahid","Milon","Hannan","Joba",
    "Tanzila","Rina","Tania","Taslima"
];

let questionNumber = 1;
let score = 0;
let attempted = 0;
let currentQuestion = null;
let history = [];
let historyIndex = -1;


/* ---------------------------------------------------------
   Utility
--------------------------------------------------------- */

function random(arr){
    return arr[Math.floor(Math.random()*arr.length)];
}

function shuffle(arr){
    return [...arr].sort(()=>Math.random()-0.5);
}

function pickName(){
    return random(names);
}

function escapeHTML(text){
    const div=document.createElement("div");
    div.textContent=text;
    return div.innerHTML;
}


/* ---------------------------------------------------------
   PREPOSITION QUESTION GENERATORS
--------------------------------------------------------- */

const generators = [

    /* AT / ON / IN — TIME */

    function(){
        const n=pickName();
        const data=[
            {
                q:`${n} was born ___ 2010.`,
                a:"in",
                e:`এখানে <b>2010</b> একটি বছর। বছর, মাস ও দীর্ঘ সময়ের আগে সাধারণত <b>in</b> বসে। তাই সঠিক উত্তর <b>in</b>।`
            },
            {
                q:`${n} will arrive ___ 8 o'clock.`,
                a:"at",
                e:`<b>8 o'clock</b> নির্দিষ্ট সময়। নির্দিষ্ট ঘড়ির সময়ের আগে <b>at</b> বসে। তাই সঠিক উত্তর <b>at</b>।`
            },
            {
                q:`${n} goes to school ___ Monday.`,
                a:"on",
                e:`<b>Monday</b> একটি নির্দিষ্ট দিন। দিনের নামের আগে <b>on</b> বসে। তাই সঠিক উত্তর <b>on</b>।`
            }
        ];

        return makeFrom(data);
    },

    /* PLACE */

    function(){
        const n=pickName();

        const data=[
            {
                q:`${n} is waiting ___ the bus stop.`,
                a:"at",
                e:`<b>Bus stop</b> একটি নির্দিষ্ট স্থান বা point হিসেবে ধরা হয়েছে। নির্দিষ্ট point/place বোঝাতে <b>at</b> ব্যবহৃত হয়।`
            },
            {
                q:`${n} lives ___ Bangladesh.`,
                a:"in",
                e:`<b>Bangladesh</b> একটি দেশ। বড় এলাকা, দেশ, শহর ইত্যাদির আগে সাধারণত <b>in</b> বসে।`
            },
            {
                q:`The book is ___ the table.`,
                a:"on",
                e:`বইটি টেবিলের উপর অবস্থান করছে। কোনো কিছুর surface বা উপরিভাগ বোঝাতে <b>on</b> ব্যবহৃত হয়।`
            }
        ];

        return makeFrom(data);
    },

    /* FROM / TO */

    function(){
        const n=pickName();

        const data=[
            {
                q:`${n} came ___ Rajshahi.`,
                a:"from",
                e:`কোনো স্থান থেকে আসা বোঝালে <b>from</b> ব্যবহার করা হয়। তাই এখানে <b>from</b> সঠিক।`
            },
            {
                q:`${n} went ___ school.`,
                a:"to",
                e:`কোনো গন্তব্যের দিকে যাওয়া বোঝাতে <b>to</b> ব্যবহৃত হয়। তাই <b>to school</b> সঠিক।`
            }
        ];

        return makeFrom(data);
    },

    /* WITH / BY */

    function(){
        const n=pickName();

        const data=[
            {
                q:`${n} went to school ___ bus.`,
                a:"by",
                e:`যে যানবাহনের মাধ্যমে যাতায়াত করা হয়, তা বোঝাতে সাধারণত <b>by</b> ব্যবহৃত হয়। তাই <b>by bus</b> সঠিক।`
            },
            {
                q:`${n} cut the paper ___ a knife.`,
                a:"with",
                e:`কোনো যন্ত্র বা উপকরণ দিয়ে কাজ করা বোঝালে <b>with</b> ব্যবহৃত হয়। তাই <b>with a knife</b> সঠিক।`
            }
        ];

        return makeFrom(data);
    },

    /* FOR / SINCE */

    function(){
        const n=pickName();

        const data=[
            {
                q:`${n} has lived here ___ 2020.`,
                a:"since",
                e:`এখানে <b>2020</b> একটি নির্দিষ্ট সময়ের শুরু। নির্দিষ্ট starting point বোঝাতে <b>since</b> ব্যবহৃত হয়।`
            },
            {
                q:`${n} has studied ___ three hours.`,
                a:"for",
                e:`<b>Three hours</b> সময়ের পরিমাণ বা duration। সময়ের দৈর্ঘ্য বোঝাতে <b>for</b> ব্যবহৃত হয়।`
            }
        ];

        return makeFrom(data);
    },

    /* BETWEEN / AMONG */

    function(){
        const n1=pickName();
        let n2=pickName();
        while(n2===n1)n2=pickName();

        const data=[
            {
                q:`The teacher divided the work ___ Firoz and ${n1}.`,
                a:"between",
                e:`দুই ব্যক্তি বা দুই পক্ষের মধ্যে বোঝাতে <b>between</b> ব্যবহৃত হয়। এখানে Firoz এবং ${n1}—দুইজন।`
            },
            {
                q:`${n1} was sitting ___ many students.`,
                a:"among",
                e:`অনেক ব্যক্তি বা একাধিক ব্যক্তির দলের মধ্যে বোঝাতে <b>among</b> ব্যবহৃত হয়। তাই <b>among</b> সঠিক।`
            }
        ];

        return makeFrom(data);
    },

    /* VERB + PREPOSITION */

    function(){
        const n=pickName();

        const data=[
            {
                q:`${n} is good ___ English.`,
                a:"at",
                e:`<b>good at</b> একটি প্রচলিত combination। কোনো বিষয়ে দক্ষতা বোঝাতে <b>good at</b> বলা হয়।`
            },
            {
                q:`${n} is interested ___ grammar.`,
                a:"in",
                e:`<b>interested in</b> একটি fixed combination। তাই এখানে <b>in</b> সঠিক।`
            },
            {
                q:`${n} depends ___ his teacher.`,
                a:"on",
                e:`<b>depend on</b> একটি নির্দিষ্ট verb-preposition combination। তাই সঠিক উত্তর <b>on</b>।`
            }
        ];

        return makeFrom(data);
    },

    /* ADJECTIVE + PREPOSITION */

    function(){
        const n=pickName();

        const data=[
            {
                q:`${n} is afraid ___ darkness.`,
                a:"of",
                e:`<b>afraid of</b> একটি প্রচলিত adjective + preposition combination। তাই <b>of</b> সঠিক।`
            },
            {
                q:`${n} is proud ___ his result.`,
                a:"of",
                e:`<b>proud of</b> একটি fixed combination। তাই এখানে <b>of</b> বসবে।`
            },
            {
                q:`${n} is angry ___ his friend.`,
                a:"with",
                e:`কারও ওপর রাগ বোঝাতে সাধারণত <b>angry with</b> ব্যবহৃত হয়। তাই <b>with</b> সঠিক।`
            }
        ];

        return makeFrom(data);
    },

    /* INTO / IN */

    function(){
        const n=pickName();

        const data=[
            {
                q:`${n} went ___ the room.`,
                a:"into",
                e:`বাইরে থেকে ঘরের ভেতরে প্রবেশ করার movement বোঝানো হয়েছে। তাই <b>into</b> ব্যবহার হবে।`
            },
            {
                q:`${n} is ___ the room.`,
                a:"in",
                e:`এখানে শুধু অবস্থান বোঝানো হয়েছে, movement নয়। তাই <b>in</b> সঠিক।`
            }
        ];

        return makeFrom(data);
    },

    /* ON / ONTO */

    function(){
        const n=pickName();

        return makeFrom([
            {
                q:`${n} jumped ___ the table.`,
                a:"onto",
                e:`এক জায়গা থেকে টেবিলের উপর ওঠার movement বোঝানো হয়েছে। তাই <b>onto</b> ব্যবহার হবে।`
            },
            {
                q:`The book is ___ the table.`,
                a:"on",
                e:`বইটি টেবিলের উপর অবস্থান করছে। এখানে movement নেই। তাই <b>on</b> সঠিক।`
            }
        ]);
    },

    /* THROUGH / ACROSS */

    function(){
        const n=pickName();

        return makeFrom([
            {
                q:`${n} walked ___ the tunnel.`,
                a:"through",
                e:`কোনো কিছুর ভেতর দিয়ে এক পাশ থেকে অন্য পাশে যাওয়া বোঝাতে <b>through</b> ব্যবহৃত হয়।`
            },
            {
                q:`${n} walked ___ the road.`,
                a:"across",
                e:`রাস্তার এক পাশ থেকে অন্য পাশে যাওয়াকে <b>across</b> দিয়ে প্রকাশ করা হয়।`
            }
        ]);
    },

    /* BESIDE / BESIDES */

    function(){
        const n=pickName();

        return makeFrom([
            {
                q:`${n} sat ___ Firoz.`,
                a:"beside",
                e:`<b>beside</b> অর্থ পাশে। তাই Firoz-এর পাশে বসা বোঝাতে <b>beside</b> সঠিক।`
            },
            {
                q:`___ English, ${n} studies grammar.`,
                a:"Besides",
                e:`<b>Besides</b> অর্থ ‘এছাড়াও’। English-এর পাশাপাশি grammar পড়ার কথা বলা হয়েছে। তাই <b>Besides</b> সঠিক।`
            }
        ]);
    },

    /* BEFORE / AFTER */

    function(){
        const n=pickName();

        return makeFrom([
            {
                q:`${n} came here ___ me.`,
                a:"before",
                e:`আমার আগে এসেছে—এই অর্থে <b>before</b> ব্যবহৃত হয়।`
            },
            {
                q:`${n} came here ___ me.`,
                a:"after",
                e:`আমার পরে এসেছে—এই অর্থে <b>after</b> ব্যবহৃত হয়।`
            }
        ]);
    }

];


function makeFrom(data){
    const item=random(data);

    const distractors=shuffle([
        "at","in","on","by","with","from","to",
        "for","since","between","among","of",
        "about","into","onto","through","across",
        "beside","besides","before","after"
    ].filter(x=>x.toLowerCase()!==item.a.toLowerCase())).slice(0,3);

    return {
        question:item.q,
        answer:item.a,
        options:shuffle([item.a,...distractors]),
        explanation:item.e
    };
}


/* ---------------------------------------------------------
   QUESTION DISPLAY
--------------------------------------------------------- */

function generateQuestion(){
    const generator=random(generators);
    currentQuestion=generator();

    displayQuestion(currentQuestion,"next");
}

function displayQuestion(q,direction){

    const area=document.getElementById("questionArea");

    area.classList.remove("slide-next","slide-prev");
    void area.offsetWidth;

    area.classList.add(direction==="prev"?"slide-prev":"slide-next");

    document.getElementById("questionLabel").textContent=
        `Question ${questionNumber}`;

    document.getElementById("question").innerHTML=
        escapeHTML(q.question);

    document.getElementById("questionBn").textContent=
        "Choose the correct preposition. (সঠিক Preposition নির্বাচন করুন।)";

    const options=document.getElementById("options");
    options.innerHTML="";

    q.options.forEach(option=>{
        const btn=document.createElement("button");

        btn.className="option";
        btn.textContent=option;

        btn.addEventListener("click",()=>{
            selectAnswer(btn,option,q.answer);
        });

        options.appendChild(btn);
    });

    document.getElementById("explanation").classList.remove("show");
    document.getElementById("explanationText").innerHTML="";

    updateStats();
}


/* ---------------------------------------------------------
   ANSWER SYSTEM
--------------------------------------------------------- */

function selectAnswer(button,selected,correct){

    const buttons=document.querySelectorAll(".option");

    buttons.forEach(btn=>btn.disabled=true);

    attempted++;

    if(selected.toLowerCase()===correct.toLowerCase()){

        button.classList.add("correct");
        score++;

    }else{

        button.classList.add("wrong");

        buttons.forEach(btn=>{
            if(btn.textContent.toLowerCase()===correct.toLowerCase()){
                btn.classList.add("correct");
            }
        });

        button.classList.add("shake");
    }

    document.getElementById("explanationText").innerHTML=
        currentQuestion.explanation;

    document.getElementById("explanation").classList.add("show");

    updateStats();
}


/* ---------------------------------------------------------
   NAVIGATION
--------------------------------------------------------- */

document.getElementById("nextBtn").addEventListener("click",()=>{

    history.push(currentQuestion);

    questionNumber++;

    generateQuestion();
});


document.getElementById("prevBtn").addEventListener("click",()=>{

    if(questionNumber<=1) return;

    questionNumber--;

    if(history.length>0){

        currentQuestion=history.pop();

        displayQuestion(currentQuestion,"prev");

    }else{

        generateQuestion();
    }
});


/* ---------------------------------------------------------
   STATS
--------------------------------------------------------- */

function updateStats(){

    document.getElementById("questionNo").textContent=
        questionNumber;

    document.getElementById("score").textContent=
        score;

    const accuracy=attempted===0
        ?0
        :Math.round((score/attempted)*100);

    document.getElementById("accuracy").textContent=
        accuracy+"%";

    const progress=((questionNumber-1)%20)/20*100;

    document.getElementById("progress").style.width=
        Math.max(5,progress)+"%";
}


/* ---------------------------------------------------------
   START
--------------------------------------------------------- */

generateQuestion();

</script>

</body>
</html>
