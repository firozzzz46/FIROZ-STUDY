<style>
/* =========================================================
   PART 4 - PRONOUN
   INFINITY MCQ PRACTICE SYSTEM
   Single File: HTML + CSS + JavaScript
========================================================= */

@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600;700&display=swap');

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

:root{
    --bg1:#fdfdfd;
    --bg2:#eef3f8;
    --card:rgba(255,255,255,.72);
    --border:rgba(255,255,255,.85);
    --text:#18212b;
    --muted:#66717c;
    --accent:#315bea;
    --accent2:#7048e8;
    --correct:#16834b;
    --wrong:#d93434;
    --shadow:0 18px 55px rgba(38,55,75,.13);
}

html{
    scroll-behavior:smooth;
}

body{
    min-height:100vh;
    color:var(--text);
    background:
        radial-gradient(circle at 10% 10%,rgba(115,145,255,.13),transparent 30%),
        radial-gradient(circle at 90% 20%,rgba(180,130,255,.12),transparent 28%),
        radial-gradient(circle at 50% 100%,rgba(100,180,255,.10),transparent 32%),
        linear-gradient(135deg,var(--bg1),var(--bg2));
    
    font-family:
        "Times New Roman",
        "Noto Sans Bengali",
        Kalpurush,
        serif;

    padding:20px;
}

/* Main container */

.container{
    width:min(1050px,100%);
    margin:auto;
}

/* Header */

.header{
    text-align:center;
    padding:28px 20px;
    margin-bottom:20px;

    background:var(--card);
    border:1px solid var(--border);
    border-radius:26px;

    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);

    box-shadow:var(--shadow);
}

.header h1{
    font-family:"Times New Roman",serif;
    font-size:clamp(30px,5vw,46px);
    letter-spacing:.5px;
    margin-bottom:8px;
}

.header p{
    font-family:
        "Noto Sans Bengali",
        Kalpurush,
        serif;

    font-size:19px;
    color:var(--muted);
}

/* Dashboard */

.dashboard{
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    gap:14px;
    margin-bottom:20px;
}

.stat{
    min-height:75px;
    padding:15px;
    text-align:center;

    background:var(--card);
    border:1px solid var(--border);
    border-radius:20px;

    backdrop-filter:blur(16px);
    -webkit-backdrop-filter:blur(16px);

    box-shadow:0 10px 35px rgba(35,50,70,.08);
}

.stat-title{
    font-family:
        "Noto Sans Bengali",
        Kalpurush,
        serif;

    font-size:16px;
    color:var(--muted);
    margin-bottom:5px;
}

.stat-value{
    font-family:"Times New Roman",serif;
    font-size:24px;
    font-weight:bold;
}

/* Progress */

.progress-area{
    margin-bottom:20px;
}

.progress-top{
    display:flex;
    justify-content:space-between;
    gap:10px;

    font-size:18px;
    margin-bottom:8px;
}

.progress-bar{
    width:100%;
    height:9px;
    overflow:hidden;

    background:rgba(0,0,0,.07);
    border-radius:50px;
}

.progress-fill{
    height:100%;
    width:0%;

    background:linear-gradient(
        90deg,
        var(--accent),
        var(--accent2)
    );

    border-radius:50px;

    transition:width .7s cubic-bezier(.22,1,.36,1);
}

/* Question card */

.question-card{
    position:relative;

    padding:28px;
    min-height:500px;

    background:var(--card);
    border:1px solid var(--border);
    border-radius:28px;

    backdrop-filter:blur(22px);
    -webkit-backdrop-filter:blur(22px);

    box-shadow:var(--shadow);

    overflow:hidden;
}

/* Question transition */

.question-card.transition-out{
    opacity:0;
    transform:translateX(-55px) scale(.985);
}

.question-card.transition-in{
    animation:
        questionIn .85s cubic-bezier(.22,1,.36,1) both;
}

@keyframes questionIn{

    0%{
        opacity:0;
        transform:
            translateX(55px)
            translateY(10px)
            scale(.985);
        filter:blur(4px);
    }

    55%{
        opacity:.8;
        filter:blur(1px);
    }

    100%{
        opacity:1;
        transform:
            translateX(0)
            translateY(0)
            scale(1);
        filter:blur(0);
    }
}

/* Question number */

.question-number{
    display:inline-block;

    padding:7px 14px;
    margin-bottom:17px;

    color:white;
    background:linear-gradient(
        135deg,
        var(--accent),
        var(--accent2)
    );

    border-radius:50px;

    font-size:17px;
}

/* Question */

.question{
    font-family:"Times New Roman",serif;
    font-size:clamp(21px,3vw,28px);
    line-height:1.55;

    margin-bottom:6px;
}

.question-meaning{
    font-family:
        "Noto Sans Bengali",
        Kalpurush,
        serif;

    font-size:19px;
    line-height:1.65;

    color:#59646f;
    margin-bottom:25px;
}

/* Options */

.options{
    display:grid;
    gap:13px;
}

.option{
    width:100%;
    text-align:left;

    padding:17px 18px;

    border:1px solid rgba(30,45,65,.10);
    border-radius:17px;

    background:rgba(255,255,255,.65);

    font-family:"Times New Roman",serif;
    font-size:20px;

    cursor:pointer;

    transition:
        transform .3s cubic-bezier(.22,1,.36,1),
        box-shadow .3s ease,
        background .3s ease,
        border-color .3s ease;
}

.option:hover:not(.disabled){
    transform:translateX(7px);
    box-shadow:0 8px 25px rgba(35,55,80,.10);
    border-color:rgba(49,91,234,.30);
}

.option.correct{
    color:#075d34;
    background:rgba(35,175,100,.13);
    border-color:rgba(22,131,75,.55);
}

.option.wrong{
    color:#8f1d1d;
    background:rgba(220,50,50,.11);
    border-color:rgba(217,52,52,.55);
}

.option.disabled{
    cursor:default;
}

/* Explanation */

.explanation{
    display:none;

    margin-top:24px;
    padding:21px;

    border-left:5px solid var(--accent);
    border-radius:17px;

    background:rgba(245,248,255,.82);

    animation:
        explanationIn .65s cubic-bezier(.22,1,.36,1);
}

.explanation.show{
    display:block;
}

@keyframes explanationIn{
    from{
        opacity:0;
        transform:translateY(18px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}

.explanation-title{
    font-family:
        "Noto Sans Bengali",
        Kalpurush,
        serif;

    font-weight:bold;
    font-size:21px;

    margin-bottom:8px;
}

.explanation-text{
    font-family:
        "Noto Sans Bengali",
        Kalpurush,
        serif;

    font-size:19px;
    line-height:1.8;
}

/* Result message */

.result-message{
    margin-top:15px;

    font-family:
        "Noto Sans Bengali",
        Kalpurush,
        serif;

    font-size:19px;
    font-weight:bold;
}

/* Controls */

.controls{
    display:flex;
    justify-content:space-between;
    gap:15px;

    margin-top:20px;
}

.control-btn{
    flex:1;

    border:none;
    border-radius:17px;

    padding:16px 20px;

    font-family:"Times New Roman",serif;
    font-size:20px;
    font-weight:bold;

    cursor:pointer;

    background:white;
    color:#26313c;

    box-shadow:0 8px 25px rgba(30,45,65,.10);

    transition:
        transform .3s cubic-bezier(.22,1,.36,1),
        box-shadow .3s ease,
        opacity .3s ease;
}

.control-btn:hover:not(:disabled){
    transform:translateY(-4px);
    box-shadow:0 13px 30px rgba(30,45,65,.15);
}

.control-btn.primary{
    color:white;
    background:linear-gradient(
        135deg,
        var(--accent),
        var(--accent2)
    );
}

.control-btn:disabled{
    opacity:.4;
    cursor:not-allowed;
}

/* Restart */

.restart-area{
    text-align:center;
    margin-top:20px;
}

.restart{
    border:none;
    background:transparent;

    color:var(--accent);

    font-family:"Times New Roman",serif;
    font-size:18px;

    cursor:pointer;
}

.restart:hover{
    text-decoration:underline;
}

/* Mobile */

@media(max-width:700px){

    body{
        padding:10px;
    }

    .header{
        padding:23px 15px;
        border-radius:20px;
    }

    .header p{
        font-size:17px;
    }

    .dashboard{
        gap:8px;
    }

    .stat{
        padding:12px 7px;
        border-radius:15px;
    }

    .stat-title{
        font-size:14px;
    }

    .stat-value{
        font-size:21px;
    }

    .question-card{
        padding:20px 16px;
        border-radius:21px;
    }

    .question{
        font-size:22px;
    }

    .question-meaning{
        font-size:18px;
    }

    .option{
        font-size:19px;
        padding:15px;
    }

    .explanation-text{
        font-size:18px;
    }

    .controls{
        flex-direction:column;
    }

    .control-btn{
        width:100%;
    }
}

/* Very small screens */

@media(max-width:400px){

    .dashboard{
        grid-template-columns:1fr;
    }

    .question{
        font-size:21px;
    }

    .option{
        font-size:18px;
    }
}

</style>
</head>

<script>

/* =========================================================
   PART 4 — PRONOUN
   INFINITE QUESTION GENERATOR

/* ---------------------------------------------------------
   Allowed Names
--------------------------------------------------------- */

const names = [
    "Firoz",
    "Fatiha",
    "Fatema",
    "Jui",
    "Ema",
    "Rupa",
    "Moksed",
    "Ferjousi",
    "Jannati",
    "Mini",
    "Miraz",

    "Joba",
    "Tanzila",
    "Rina",
    "Tania",
    "Taslima"
];


/* ---------------------------------------------------------
   Question Generator
--------------------------------------------------------- */

const questionGenerators = [

/* 1 — Subject Pronoun */

function(){

    const n = randomName();

    return createQuestion(
        `${n} and I went to the library. ___ studied English grammar together.`,
        `(${n} এবং আমি লাইব্রেরিতে গিয়েছিলাম। আমরা একসঙ্গে ইংরেজি ব্যাকরণ পড়েছিলাম।)`,

        ["We","Us","Our","Ours"],

        "We",

        "এখানে blank-এর পরে 'studied' একটি verb। যে Pronoun কাজটি করছে, সেটি Subject হবে। ${n} and I = We। তাই সঠিক উত্তর হলো 'We'। 'Us' object form, 'Our' possessive adjective এবং 'Ours' possessive pronoun।"
    );
},


/* 2 — Object Pronoun */

function(){

    const n = randomName();

    return createQuestion(
        `The teacher called ${n} and ___.`,
        `(শিক্ষক ${n} এবং আমাকে ডাকলেন।)`,

        ["I","me","my","mine"],

        "me",

        "এখানে 'called' একটি verb এবং তার পরে যাকে ডাকা হয়েছে, সেটি Object। তাই 'I' নয়, object form 'me' হবে। 'My' possessive adjective এবং 'mine' possessive pronoun।"
    );
},


/* 3 — Possessive Adjective */

function(){

    const n = randomName();

    return createQuestion(
        `${n} forgot ___ book at home.`,
        `(${n} তার বই বাড়িতে রেখে এসেছে।)`,

        ["his","him","he","himself"],

        "his",

        "Book একটি noun। Noun-এর আগে মালিকানা বোঝাতে Possessive Adjective ব্যবহৃত হয়। এখানে ${n}-এর book বোঝানো হয়েছে, তাই 'his' ব্যবহৃত হবে।"
    );
},


/* 4 — Possessive Pronoun */

function(){

    return createQuestion(
        `This pen is ___.`,
        `(এই কলমটি আমার।)`,

        ["my","mine","me","I"],

        "mine",

        "এখানে blank-এর পরে কোনো noun নেই। 'My' হলে noun দরকার—যেমন my pen। কিন্তু এখানে সরাসরি মালিকানা বোঝানো হয়েছে। তাই Possessive Pronoun 'mine' হবে।"
    );
},


/* 5 — Reflexive Pronoun */

function(){

    const n = randomName();

    return createQuestion(
        `${n} prepared the whole assignment ___.`,
        `(${n} নিজেই পুরো অ্যাসাইনমেন্টটি প্রস্তুত করেছে।)`,

        ["him","his","himself","he"],

        "himself",

        "Subject ${n} একজন পুরুষের নাম হিসেবে ব্যবহৃত হয়েছে। Subject নিজেই কাজটি করেছে—এটি জোর দিয়ে বোঝাতে Reflexive Pronoun দরকার। তাই 'himself' সঠিক।"
    );
},


/* 6 — Reflexive */

function(){

    const n = randomFemaleName();

    return createQuestion(
        `${n} looked at ___ in the mirror.`,
        `(${n} আয়নায় নিজের দিকে তাকাল।)`,

        ["her","hers","herself","she"],

        "herself",

        "Subject ${n} নিজেকেই দেখেছে। তাই Subject-এর কাজের প্রভাব Subject-এর ওপর ফিরে এসেছে। এজন্য Reflexive Pronoun 'herself' হবে।"
    );
},


/* 7 — Demonstrative */

function(){

    return createQuestion(
        `___ are my new grammar books.`,
        `(এগুলো আমার নতুন ব্যাকরণের বই।)`,

        ["This","That","These","It"],

        "These",

        "এখানে 'books' plural এবং কাছে থাকা একাধিক জিনিস বোঝানো হয়েছে। তাই plural + near-এর জন্য 'These' ব্যবহার হবে।"
    );
},


/* 8 — Demonstrative Singular */

function(){

    return createQuestion(
        `___ is the book I was looking for.`,
        `(এটাই সেই বই, যেটি আমি খুঁজছিলাম।)`,

        ["These","Those","This","They"],

        "This",

        "এখানে 'book' singular এবং কাছে থাকা একটি জিনিস বোঝানো হয়েছে। তাই 'This' সঠিক।"
    );
},


/* 9 — Interrogative */

function(){

    return createQuestion(
        `___ is knocking at the door?`,
        `(দরজায় কে কড়া নাড়ছে?)`,

        ["Who","Whom","Which","Whose"],

        "Who",

        "যে ব্যক্তি কাজটি করছে—অর্থাৎ knocking-এর Subject—তাকে জানতে 'Who' ব্যবহৃত হয়। তাই এখানে 'Who' সঠিক।"
    );
},


/* 10 — Whom */

function(){

    return createQuestion(
        `___ did you meet yesterday?`,
        `(তুমি গতকাল কার সঙ্গে দেখা করেছিলে?)`,

        ["Who","Whom","Whose","Which"],

        "Whom",

        "এখানে 'you' Subject এবং যাকে meet করা হয়েছে সে Object। Object সম্পর্কে প্রশ্ন করতে traditional grammar অনুযায়ী 'Whom' ব্যবহৃত হয়।"
    );
},


/* 11 — Whose */

function(){

    return createQuestion(
        `___ book is lying on the table?`,
        `(টেবিলের ওপর পড়ে থাকা বইটি কার?)`,

        ["Who","Whom","Whose","Which"],

        "Whose",

        "মালিকানা বা possession জানতে 'Whose' ব্যবহৃত হয়। এখানে বইটির মালিক কে তা জানতে চাওয়া হয়েছে।"
    );
},


/* 12 — Relative Pronoun */

function(){

    const n = randomName();

    return createQuestion(
        `${n} is the student ___ won the prize.`,
        `(${n} সেই ছাত্র/ছাত্রী যে পুরস্কার জিতেছে।)`,

        ["who","whom","whose","which"],

        "who",

        "এখানে blank-এর পর 'won' verb এসেছে এবং Pronoun-টি নিজেই কাজটি করছে। অর্থাৎ এটি Relative Clause-এর Subject। Person-এর Subject হিসেবে 'who' ব্যবহৃত হয়।"
    );
},


/* 13 — Which */

function(){

    return createQuestion(
        `This is the book ___ I bought yesterday.`,
        `(এটি সেই বই যা আমি গতকাল কিনেছিলাম।)`,

        ["who","whom","which","whose"],

        "which",

        "এখানে antecedent হলো 'book', অর্থাৎ একটি জিনিস। জিনিসের জন্য Relative Pronoun হিসেবে 'which' ব্যবহার করা যায়।"
    );
},


/* 14 — Whom Relative */

function(){

    const n = randomName();

    return createQuestion(
        `${n} is the person ___ I invited.`,
        `(${n} সেই ব্যক্তি যাকে আমি আমন্ত্রণ করেছিলাম।)`,

        ["who","whom","which","whose"],

        "whom",

        "এখানে 'I' হলো Subject এবং যাকে invite করা হয়েছে সে Object। তাই traditional formal grammar অনুযায়ী Object Relative Pronoun 'whom' হবে।"
    );
},


/* 15 — Indefinite Pronoun */

function(){

    return createQuestion(
        `Everyone should do ___ duty honestly.`,
        `(প্রত্যেকের নিজের কর্তব্য সৎভাবে করা উচিত।)`,

/* ---------------------------------------------------------
   Question State
--------------------------------------------------------- */

let currentQuestion = null;
let currentIndex = 0;
let score = 0;
let answered = false;
let totalAnswered = 0;


/* ---------------------------------------------------------
   Helpers
--------------------------------------------------------- */

function randomName(){

    return names[
        Math.floor(Math.random() * names.length)
    ];
}


function randomFemaleName(){

    const femaleNames = [
        "Fatiha",
        "Fatema",
        "Jui",
        "Ema",
        "Rupa",
        "Ferjousi",
        "Jannati",
        "Mini",
        "Joba",
        "Tanzila",
        "Rina",
        "Tania",
        "Taslima"
    ];

    return femaleNames[
        Math.floor(Math.random() * femaleNames.length)
    ];
}


/* ---------------------------------------------------------
   Create Question Object
--------------------------------------------------------- */

function createQuestion(
    question,
    meaning,
    options,
    answer,
    explanation
){

    return {
        question,
        meaning,
        options:shuffle([...options]),
        answer,
        explanation
    };
}


/* ---------------------------------------------------------
   Shuffle
--------------------------------------------------------- */

function shuffle(array){

    for(let i=array.length-1;i>0;i--){

        const j=Math.floor(Math.random()*(i+1));

        [array[i],array[j]]
        =[array[j],array[i]];
    }

    return array;
}


/* ---------------------------------------------------------
   Generate New Question
--------------------------------------------------------- */

function generateQuestion(){

    const generator =
        questionGenerators[
            Math.floor(
                Math.random() *
                questionGenerators.length
            )
        ];

    return generator();
}


/* ---------------------------------------------------------
   Load Question
--------------------------------------------------------- */

function loadQuestion(direction="next"){

    answered=false;

    currentQuestion =
        generateQuestion();

    const card =
        document.getElementById("questionCard");

    card.classList.remove(
        "transition-in",
        "transition-out"
    );

    void card.offsetWidth;

    card.classList.add("transition-in");

    document.getElementById(
        "questionNumber"
    ).textContent =
        `Question ${currentIndex + 1}`;

    document.getElementById(
        "questionCount"
    ).textContent =
        currentIndex + 1;

    document.getElementById(
        "progressText"
    ).textContent =
        `Question ${currentIndex + 1}`;

    document.getElementById(
        "question"
    ).textContent =
        currentQuestion.question;

    document.getElementById(
        "questionMeaning"
    ).textContent =
        currentQuestion.meaning;

    const optionsContainer =
        document.getElementById("options");

    optionsContainer.innerHTML="";

    currentQuestion.options.forEach(
        option => {

            const button =
                document.createElement("button");

            button.className="option";

            button.textContent=option;

            button.onclick=() =>
                selectAnswer(
                    option,
                    button
                );

            optionsContainer.appendChild(
                button
            );
        }
    );


    document.getElementById(
        "explanation"
    ).classList.remove("show");

    document.getElementById(
        "explanationText"
    ).textContent="";

    document.getElementById(
        "resultMessage"
    ).textContent="";


    updateProgress();

    document.getElementById(
        "previousBtn"
    ).disabled =
        currentIndex === 0;

    document.getElementById(
        "nextBtn"
    ).disabled=false;
}


/* ---------------------------------------------------------
   Select Answer
--------------------------------------------------------- */

function selectAnswer(
    selected,
    selectedButton
){

    if(answered) return;

    answered=true;
    totalAnswered++;

    const allOptions =
        document.querySelectorAll(".option");

    allOptions.forEach(
        button => {

            button.classList.add(
                "disabled"
            );

            if(
                button.textContent ===
                currentQuestion.answer
            ){

                button.classList.add(
                    "correct"
                );
            }
        }
    );


    if(
        selected ===
        currentQuestion.answer
    ){

        score++;

        selectedButton.classList.add(
            "correct"
        );

        document.getElementById(
            "resultMessage"
        ).textContent =
            "Correct ✓";

    }else{

        selectedButton.classList.add(
            "wrong"
        );

        document.getElementById(
            "resultMessage"
        ).textContent =
            `Wrong ✗  Correct answer: ${currentQuestion.answer}`;
    }


    document.getElementById(
        "explanationText"
    ).textContent =
        currentQuestion.explanation;

    document.getElementById(
        "explanation"
    ).classList.add("show");


    updateStats();
}


/* ---------------------------------------------------------
   Next
--------------------------------------------------------- */

function nextQuestion(){

    const card =
        document.getElementById(
            "questionCard"
        );

    card.classList.remove(
        "transition-in"
    );

    card.classList.add(
        "transition-out"
    );


    setTimeout(
        () => {

            currentIndex++;

            loadQuestion("next");

            window.scrollTo({
                top:0,
                behavior:"smooth"
            });

        },
        380
    );
}


/* ---------------------------------------------------------
   Previous
--------------------------------------------------------- */

function previousQuestion(){

    if(currentIndex <= 0)
        return;

    currentIndex--;

    loadQuestion("previous");
}


/* ---------------------------------------------------------
   Progress
--------------------------------------------------------- */

function updateProgress(){

    /*
       Since this is an infinite system,
       progress represents the current practice
       position in a repeating 100-question cycle.
    */

    const cyclePosition =
        ((currentIndex % 100) + 1);

    const percentage =
        cyclePosition;

    document.getElementById(
        "progressFill"
    ).style.width =
        percentage + "%";
}


/* ---------------------------------------------------------
   Statistics
--------------------------------------------------------- */

function updateStats(){

    document.getElementById(
        "score"
    ).textContent =
        score;


    const accuracy =
        totalAnswered === 0
        ? 0
        : Math.round(
            (score / totalAnswered) * 100
        );


    document.getElementById(
        "accuracy"
    ).textContent =
        accuracy + "%";
}


/* ---------------------------------------------------------
   Restart
--------------------------------------------------------- */

function restartPractice(){

    currentIndex=0;
    score=0;
    totalAnswered=0;
    answered=false;

    updateStats();

    loadQuestion();
}


/* ---------------------------------------------------------
   Keyboard Controls
--------------------------------------------------------- */

document.addEventListener(
    "keydown",
    function(event){

        if(event.key === "ArrowRight"){
            nextQuestion();
        }

        if(event.key === "ArrowLeft"){
            previousQuestion();
        }
    }
);


/* ---------------------------------------------------------
   Start
--------------------------------------------------------- */

loadQuestion();

</script>
