<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Firoz Study</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <!-- Header -->
        <header class="header">
            <div class="logo">F</div>

            <div>
                <h1>Firoz Study</h1>
                <p>Learn • Read • Grow</p>
            </div>
        </header>


        <!-- Welcome -->
        <section class="welcome">
            <p class="small-text">WELCOME BACK 👋</p>
            <h2>What do you want to study?</h2>
            <p class="description">
                Choose a subject and start learning.
            </p>
        </section>


        <!-- Topics -->
        <section class="topics">

            <div class="topic">
                <div class="topic-icon">📚</div>

                <div class="topic-info">
                    <h3>Qawmi Studie</h3>
                    <p>Qawmi Madrasa Study</p>
                </div>

                <span class="arrow">→</span>
            </div>


            <div class="topic">
                <div class="topic-icon">📖</div>

                <div class="topic-info">
                    <h3>Alia Study</h3>
                    <p>Alia Madrasa Studie</p>
                </div>

                <span class="arrow">→</span>
            </div>


            <div class="topic">
                <div class="topic-icon">📚</div>

                <div class="topic-info">
                    <h3>Other Studie</h3>
                    <p>Without Academy</p>
                </div>

                <span class="arrow">→</span>
            </div>


            <!-- পরে শুধু এইরকম নতুন topic যোগ করবে -->

                </div>

                <span class="arrow">→</span>

            -->

        <footer>
            <p>© 2026 Firoz Study</p>
        </footer>
