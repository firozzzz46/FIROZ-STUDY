<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ঐতিহাসিক স্মৃতি — ১৪৪১ হিজরি</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Amiri:wght@700&family=Hind+Siliguri:wght@400;600;700&display=swap');

:root {
    --bg: #05120d;
    --card: #0b2018;
    --gold: #d6b24c;
    --gold-soft: rgba(214, 178, 76, 0.28);
    --coral: #e5735a;
    --text: #f4f0e4;
    --muted: #b8c5be;
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    min-height: 100dvh;
    display: grid;
    place-items: center;
    padding: 16px;
    background: radial-gradient(circle at 50% 20%, rgba(214, 178, 76, 0.12), transparent 55%), var(--bg);
    color: var(--text);
    font-family: 'Hind Siliguri', sans-serif;
    overflow: hidden;
}

/* হালকা জ্যামিতিক আভা */
.bg-grid {
    position: fixed;
    inset: 0;
    pointer-events: none;
    opacity: 0.35;
    background-image: radial-gradient(rgba(214, 178, 76, 0.22) 1px, transparent 1px);
    background-size: 32px 32px;
    transform: translateZ(0);
    animation: drift 24s linear infinite;
}

@keyframes drift {
    from { transform: translate3d(0, 0, 0); }
    to { transform: translate3d(32px, 32px, 0); }
}

/* মূল বার্তা কার্ড */
.card {
    position: relative;
    z-index: 2;
    width: min(100%, 640px);
    padding: clamp(24px, 5vw, 44px) clamp(18px, 4vw, 36px);
    text-align: center;
    border-radius: 16px;
    background: var(--card);
    border: 1px solid var(--gold-soft);
    box-shadow: 0 16px 40px rgba(0, 0, 0, 0.45);
    animation: fadeUp 0.9s ease-out both;
}

@keyframes fadeUp {
    from { opacity: 0; transform: translate3d(0, 14px, 0); }
    to { opacity: 1; transform: translate3d(0, 0, 0); }
}

.tag {
    display: inline-block;
    padding: 4px 14px;
    margin-bottom: 14px;
    border-radius: 999px;
    border: 1px solid var(--gold-soft);
    color: var(--gold);
    font-size: clamp(13px, 2vw, 15px);
    font-weight: 600;
}

h1 {
    font-size: clamp(22px, 4.4vw, 38px);
    font-weight: 600;
    line-height: 1.8;
}

.year {
    font-family: 'Amiri', serif;
    font-weight: 700;
    font-size: 1.2em;
    color: var(--coral);
    padding: 0 4px;
}

.dua {
    margin-top: 14px;
    font-size: clamp(14px, 2.2vw, 16px);
    color: var(--muted);
    line-height: 1.65;
}

/* হালকা ভাসমান সোনালি কণা */
.dot {
    position: fixed;
    bottom: -10px;
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: var(--gold);
    opacity: 0;
    pointer-events: none;
    animation: rise linear infinite;
}

@keyframes rise {
    0% { transform: translate3d(0, 0, 0); opacity: 0; }
    20% { opacity: 0.55; }
    80% { opacity: 0.35; }
    100% { transform: translate3d(18px, -105vh, 0); opacity: 0; }
}

@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
        animation: none !important;
    }
}
</style>
</head>

<body>
    <div class="bg-grid" aria-hidden="true"></div>

    <main class="card" aria-label="ঐতিহাসিক ঘটনা">
        <span class="tag">✦ একটি ঐতিহাসিক ঘটনা ✦</span>
        <h1>
            করোনা মহামারির কারণে
            <br>
            <span class="year">১৪৪১ হিজরি</span>
            <br>
            সনে তানযীম বোর্ডে
            <br>
            পরীক্ষা অনুষ্ঠিত হয়নি।
        </h1>
        <p class="dua">আল্লাহ তাআলা যেন আমাদের সকলকে সকল প্রকার মহামারি ও বিপদ থেকে হেফাজত করেন।</p>
    </main>

    <script>
        (() => {
            const total = window.innerWidth < 600 ? 10 : 16;
            const frag = document.createDocumentFragment();

            for (let i = 0; i < total; i++) {
                const dot = document.createElement('span');
                dot.className = 'dot';
                dot.style.left = `${(Math.random() * 100).toFixed(1)}%`;
                dot.style.animationDuration = `${(9 + Math.random() * 8).toFixed(1)}s`;
                dot.style.animationDelay = `${(-Math.random() * 12).toFixed(1)}s`;
                frag.appendChild(dot);
            }

            document.body.appendChild(frag);
        })();
    </script>
</body>
</html>
